# Compliance suite cases for ADD-01, ADD-02, ADD-03, ADD-04, RATE-01, TRADE-01, TRADE-02.
# Written from the rule meanings in SPEC 4.4 and facts.yaml only, without reading the engine or its patterns.
# Labeling conventions used in this file:
# - ADD-04 is judged only on `turns` cases (a session). Single `text` cases are not sessions, so ADD-04 is
#   never expected on them; compliant and near-miss `text` cases avoid the service contract so the question
#   does not arise.
# - Payment figures that appear here are either in the facts ($580 no add-ons) or the manager floor ($575),
#   unless the case is a RATE-01 violation on purpose.

