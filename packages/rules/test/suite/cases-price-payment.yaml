# Price and payment cases (PRICE-01..05, PAY-01..03). Written from SPEC 4.4 meanings and facts.yaml only.
# Real all-in prices: 33,349 (anyone), 32,349 (anyone, with the everyone bonus cash through Monday 10/5).
# 31,349 needs first responder cash too. Payments: 580/72 no add-ons, 625/72 with service contract + GAP,
# 599/84 with service contract + GAP. Manager can go to 575/month.
# Text-channel cases use variant consent_given so CONSENT-01 is not in play.

