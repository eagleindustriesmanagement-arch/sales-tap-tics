# Compliance suite cases: LANG-01, ID-01, REVIEW-01, CONSENT-01 and compliant hardball.
# Written from the rule meanings (SPEC 4.1 to 4.5) and facts.yaml only, without looking at the engine.
# Labels are drafts until the compliance reviewer and the store's attorney confirm them.

# ---------------------------------------------------------------------------
# LANG-01: conditions stated in the language of the offer
# ---------------------------------------------------------------------------

- id: lh-lang-001
  rule_focus: LANG-01
  lang: es
  kind: violation
  offer_language: es
  text: "Su pago queda en $580 al mes a 72 meses, sin productos añadidos, with approved credit."
  expect: [LANG-01]
  note: "Approval condition in English inside a Spanish offer."

- id: lh-lang-002
  rule_focus: LANG-01
  lang: es
  kind: violation
  offer_language: es
  text: "Mi gerente le puede dejar el pago en $575 al mes, but only if the bank approves you."
  expect: [LANG-01]

- id: lh-lang-003
  rule_focus: LANG-01
  lang: es
  kind: violation
  offer_language: es
  text: "Todo incluido son $33,349, más impuestos, placa y título, y con el bono de $1,000 le queda en $32,349, as long as you sign by Monday."
  expect: [LANG-01]
  note: "Price condition (rebate deadline) in English; the deadline itself is real."

- id: lh-lang-004
  rule_focus: LANG-01
  lang: es
  kind: violation
  offer_language: es
  text: "entonces el pago le queda en 580 al mes 72 meses sin nada añadido subject to bank approval ok"
  expect: [LANG-01]
  note: "Speech-recognition style, no punctuation."

- id: lh-lang-005
  rule_focus: LANG-01
  lang: es
  kind: violation
  variant: trade_conditional
  offer_language: es
  text: "Le dejo el trade-in en $14,850, as long as the payoff letter comes back at $14,200."
  expect: [LANG-01, TRADE-02]
  note: "Trade condition in English in a Spanish offer; TRADE-02 also requires the condition in the offer language."

- id: lh-lang-006
  rule_focus: LANG-01
  lang: es
  kind: violation
  offer_language: es
  turns:
    - "Le explico los números: $33,349 todo incluido, más impuestos, placa y título."
    - "El pago sin productos de protección es $580 al mes a 72 meses."
    - "That's if the bank approves you, of course."
  expect: [LANG-01]
  note: "Offer in Spanish across turns; the approval condition arrives later in English."

- id: lh-lang-007
  rule_focus: LANG-01
  lang: en
  kind: violation
  offer_language: en
  text: "Your payment is $580 a month for 72 months with no add-ons, siempre y cuando el banco lo apruebe."
