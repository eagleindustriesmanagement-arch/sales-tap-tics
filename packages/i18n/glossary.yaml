# Approved Spanish glossary (es-US, Miami). Source: docs/spanish-style-guide.md section 4.
# Every term is translated the same way everywhere. confirm: true needs a Miami salesperson's approval before release.
# vocabulary and false_friends: words that must not appear (Spain-only vocabulary and false friends, sections 3.4 and 3.5).

interface:
  - en: "Sign in / Sign out"
    es: "Iniciar sesión / Cerrar sesión"
  - en: "Settings"
    es: "Configuración"
  - en: "Home / Today"
    es: "Inicio / Hoy"
  - en: "Dashboard"
    es: "Panel"
    note: "Not \"tablero de control\""
  - en: "Practice (noun)"
    es: "Práctica"
  - en: "Start practice"
    es: "Empezar práctica"
    note: "Button"
  - en: "Session"
    es: "Sesión"
  - en: "Roleplay"
    es: "Simulación"
    note: "\"Juego de roles\" sounds like a game; confirm"
    confirm: true
  - en: "Demonstration"
    es: "Demostración, ejemplo"
    note: "\"Ver ejemplo\" for the button"
  - en: "Debrief"
    es: "Resumen de la sesión"
  - en: "Score"
    es: "Puntaje"
    note: "Not \"puntuación\" (Spain) or \"marcador\""
  - en: "Behavior card"
    es: "Meta de la semana"
    note: "Says what it is; confirm"
    confirm: true
  - en: "Floor check"
    es: "Revisión en el piso"
    note: "Confirm with managers"
    confirm: true
  - en: "Assignment"
    es: "Tarea asignada"
  - en: "Due date"
    es: "Fecha límite / Vence el"
    note: "\"Vence el viernes\""
  - en: "Certification"
    es: "Certificación"
  - en: "Streak"
    es: "Racha"
  - en: "Progress"
    es: "Progreso"
  - en: "Library"
    es: "Biblioteca"
    note: "Not \"librería\""
  - en: "Technique"
    es: "Técnica"
  - en: "Objection"
    es: "Objeción"
  - en: "Evidence grade"
    es: "Nivel de evidencia"
  - en: "Microphone"
    es: "Micrófono"
  - en: "Allow access"
    es: "Permitir acceso"
  - en: "Try again"
    es: "Volver a intentar"
  - en: "Loading"
    es: "Cargando…"
  - en: "Something went wrong"
    es: "Algo salió mal"
  - en: "Saved"
    es: "Guardado"
  - en: "Private"
    es: "Privado"
  - en: "Manager"
    es: "Gerente"
  - en: "Salesperson"
    es: "Vendedor, vendedora"
    note: "Use neutral phrasing when gender is unknown"
  - en: "BDC agent"
    es: "Agente de BDC"
    note: "Keep \"BDC\""
sales:
  - en: "Customer"
    es: "Cliente"
  - en: "Up (a showroom customer)"
    es: "Cliente, \"un up\""
    note: "Confirm if reps say \"up\""
    confirm: true
  - en: "Close (the sale)"
    es: "Cierre, cerrar la venta"
    note: "Never confuse with the \"Cerrar\" button"
  - en: "Objection handling"
    es: "Manejo de objeciones"
  - en: "Walkaround"
    es: "Recorrido del vehículo"
  - en: "Test drive"
    es: "Prueba de manejo"
    note: "\"El test drive\" in dialogue is fine"
  - en: "Down payment"
    es: "La inicial, el down"
  - en: "Trade-in"
    es: "El trade-in"
  - en: "Monthly payment"
    es: "Pago mensual"
  - en: "Interest rate / APR"
    es: "La tasa / el APR"
    note: "Not only \"interés\""
  - en: "Out-the-door price"
    es: "Precio total final"
    note: "Spell out what is included"
  - en: "Dealer fee"
    es: "Cargo de concesionario, el dealer fee"
    note: "Use the store's exact document term"
  - en: "Upside down"
    es: "Estar al revés, deber más de lo que vale"
  - en: "Co-signer"
    es: "Co-firmante"
    note: "Accept \"co-signer\" and \"codeudor\""
  - en: "Credit score"
    es: "Puntaje de crédito, el score"
  - en: "Lease"
    es: "El lease, arrendamiento"
  - en: "Service contract"
    es: "Contrato de servicio"
    note: "Do not call it only \"garantía\""
  - en: "Warranty"
    es: "Garantía"
  - en: "Finance manager"
    es: "Gerente de financiamiento"
  - en: "Appointment"
    es: "Cita"
  - en: "Follow-up"
    es: "Seguimiento"
  - en: "Referral"
    es: "Referido"
  - en: "Payoff"
    es: "El payoff, saldo pendiente"
vocabulary:
  - meaning: "car"
    use: "carro, auto"
    not: "coche"
  - meaning: "cell phone"
    use: "celular"
    not: "móvil"
  - meaning: "computer"
    use: "computadora"
    not: "ordenador"
  - meaning: "drive"
    use: "manejar"
    not: "conducir (acceptable but less common)"
  - meaning: "park"
    use: "parquear, estacionar"
    not: "aparcar"
  - meaning: "pickup truck"
    use: "la troca, la camioneta"
    not: "el camión (for pickups)"
  - meaning: "tire"
    use: "la goma, la llanta"
    not: "el neumático"
  - meaning: "right now"
    use: "ahorita (now, soon)"
    not: "ahora mismo (fine), vale (never)"
false_friends:
  - en: "Apply (for credit)"
    wrong: "aplicar"
    right: "solicitar"
  - en: "Realize"
    wrong: "realizar"
    right: "darse cuenta"
  - en: "Support (help)"
    wrong: "soportar"
    right: "apoyar, ayudar"
  - en: "Assist"
    wrong: "asistir"
    right: "ayudar"
  - en: "Actually"
    wrong: "actualmente"
    right: "en realidad"
  - en: "Eventually"
    wrong: "eventualmente"
    right: "con el tiempo"
  - en: "Introduce (a person)"
    wrong: "introducir"
    right: "presentar"
  - en: "Library (of content)"
    wrong: "librería"
    right: "biblioteca"
  - en: "Record (audio)"
    wrong: "recordar"
    right: "grabar"
  - en: "Score (rating)"
    wrong: "marcador"
    right: "puntaje"
