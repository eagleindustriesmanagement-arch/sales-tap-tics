code: S-payment-buyer-L2
module: car-core
title:
  en: "\"The payment is too high\""
  es: "\"El pago está muy alto\""
setting:
  en: Tuesday, 12:40 p.m., showroom floor, right after a quick test drive on his lunch break.
  es: Martes, 12:40 p.m., en el piso de ventas, justo después de una prueba de manejo rápida en su hora de almuerzo.
persona: P-payment-buyer
objection: O03
channel: floor
language_options: [en, es]
difficulty: 2
start_state: objection
pre_brief:
  en: "{name}, early 30s, came in on his lunch break for a compact SUV and just drove the 2026 Equinox LT. Good credit, no trade, $2,000 down. The numbers sheet shows $612 a month on 72 months, and two other real options."
  es: "{name}, de treinta y pico, vino en su hora de almuerzo buscando una SUV compacta y acaba de manejar la Equinox LT 2026. Buen crédito, sin trade-in, $2,000 de inicial. La hoja de números muestra $612 al mes a 72 meses, y otras dos opciones reales."
opening:
  en: The payment is too high. And I'm on my lunch break, so I don't have long.
  es: El pago está muy alto. Y estoy en mi hora de almuerzo, así que no tengo mucho tiempo.
facts:
  session_date: "2026-10-06"
  vehicle: { year: 2026, make: Chevrolet, model: Equinox, trim: LT, color: Sterling Gray Metallic, stock: "4637", in_stock: true }
  price_cents: 3195000
  dealer_fees: [{ code: dealer_fee, cents: 89900 }]
  government_charges_customer_pays: [sales_tax, tag, title]
  all_in_price_cents: 3284900
  rebates: []
  deadlines: []
  inventory_same_trim_color: 2
  trade: null
  lender_state: not_applied
  add_ons: []
  # Estimates on the numbers sheet, all subject to the lender's approval. No add-ons in any of them.
  payment_options:
    - { code: quoted, cents: 61200, term_months: 72, down_cents: 200000 }
    - { code: more_down, cents: 54900, term_months: 72, down_cents: 550000 }
    - { code: longer_term, cents: 54100, term_months: 84, down_cents: 200000 }
  authority: { manager_has_room: false }
  text_consent: false
  customer_knows:
    payment_ceiling_cents: 55000
    quoted_payment_cents: 61200
    cash_available_cents: 600000
    back_after_work: Off at 5:00 today, ten minutes away
numbers_sheet: true
target_techniques: [T002, T110, T083, T121, T001, T005, T014]
rubric: R-objection
scoring:
  items:
    - code: O03-PAUSE
      behavior:
        en: "Paused at least two seconds before replying"
        es: "Hizo una pausa de al menos dos segundos antes de responder"
      dimension: composure
      method: timing
      points: 10
      voice_only: true
      evidence: "Gong: top reps pause longer after objections"
      technique: T001
      params: { min_pause_ms: 2000, after: objection }
    - code: O03-QFIRST
      behavior:
        en: "Asked what payment he had in mind before changing any number"
        es: "Preguntó qué pago tenía en mente antes de cambiar cualquier número"
      dimension: discovery
      method: judge
      points: 20
      evidence: "Gong: 54.3% versus 31.0%"
      technique: T002
    - code: O03-ISOLATE
      behavior:
        en: "Confirmed the car is right apart from the payment"
        es: "Confirmó que el carro es el correcto, aparte del pago"
      dimension: discovery
      method: judge
      points: 15
      evidence: Stated-versus-real reason data (CAR-Research XRM)
      technique: T005
    - code: O03-HIDDEN
      behavior:
        en: "Surfaced his real payment ceiling"
        es: "Sacó a la luz su tope real de pago"
      dimension: discovery
      method: engine
      points: 15
      evidence: Scenario design
      params: { event: hidden_revealed }
    - code: O03-OPTIONS
      behavior:
        en: "Showed only real options from the sheet, and said plainly that the lower payment takes more months"
        es: "Mostró solo opciones reales de la hoja y dijo claramente que el pago más bajo es a más meses"
      dimension: technique
      method: judge
      points: 20
      evidence: "Mark Tewart (T083); FTC payment-packing cases"
      technique: T083
    - code: O03-BRIEF
      behavior:
        en: "Respected his time: short turns, no long pitch"
        es: "Respetó su tiempo: turnos cortos, sin discursos largos"
      dimension: composure
      method: judge
      points: 10
      evidence: "Gong: shorter seller monologues in won deals"
    - code: O03-NEXT
      behavior:
        en: "Set a specific day and time to come back and choose"
        es: "Fijó un día y una hora específicos para volver a escoger"
      dimension: outcome
      method: engine_and_judge
      points: 10
      evidence: "T014"
      technique: T014
      params: { event: next_step }
  auto_fail:
    - code: hid_longer_term
      description:
        en: "Stretched the term to reach his number without saying it was longer"
        es: "Alargó el plazo para llegar a su número sin decir que era más largo"
      method: judge
    - code: made_up_deadline
      description:
        en: "Made up a deadline"
        es: "Inventó una fecha límite"
      method: rule_family
      rule_families: [deadlines]
    - code: misstated_number
      description:
        en: "Misstated a number"
        es: "Dijo un número que no es real"
      method: rule_family
      rule_families: [price, payment, rate_and_approval, trade]
exit_policy: { walk_away_base: 0.15, not_now_base: 0.25, triggers_raise_by: 0.25 }
max_turns: 20
time_limit_seconds: 360
demonstrations:
  flawed:
    notice:
      en: "Notice: he argued with the objection, never asked what number the customer needed, and let a rushed buyer leave with nothing scheduled."
      es: "Fíjese: discutió la objeción, nunca preguntó qué número necesitaba el cliente y dejó ir a un comprador apurado sin nada agendado."
    script:
      en:
        - { speaker: customer, text: "The payment is too high. And I'm on my lunch break, so I don't have long." }
        - { speaker: rep, text: "No, the payment isn't high. $612 a month is a great payment for an Equinox this well equipped." }
        - { speaker: customer, text: "It's still too high." }
        - { speaker: rep, text: "Everybody says that at first. Trust me, you'll forget about it after the first month. Want me to get it ready?" }
        - { speaker: customer, text: "I don't have time for this." }
        - { speaker: rep, text: "Okay, no problem. Here's my card. Call me if anything changes." }
        - { speaker: customer, text: "Yeah. Thanks." }
      es:
        - { speaker: customer, text: "El pago está muy alto. Y estoy en mi hora de almuerzo, así que no tengo mucho tiempo." }
        - { speaker: rep, text: "No, el pago no está alto. $612 al mes es un excelente pago para una Equinox tan bien equipada." }
        - { speaker: customer, text: "Igual está muy alto." }
        - { speaker: rep, text: "Todo el mundo dice eso al principio. Créame, después del primer mes ni se acuerda. ¿Se la preparo?" }
        - { speaker: customer, text: "No tengo tiempo para esto." }
        - { speaker: rep, text: "Bueno, no hay problema. Aquí tiene mi tarjeta. Me llama si algo cambia." }
        - { speaker: customer, text: "Sí. Gracias." }
  good:
    notice:
      en: Notice the question about his number before any new number, and how the rep says out loud that the lower payment takes more months.
      es: Fíjese en la pregunta por su número antes de cualquier número nuevo, y en cómo dice en voz alta que el pago más bajo es a más meses.
    script:
      en:
        - { speaker: customer, text: "The payment is too high. And I'm on my lunch break, so I don't have long." }
        - { speaker: rep, text: "[pause] Got it. I'll keep this quick. Help me understand: when you say the payment is too high, what number were you expecting?" }
        - { speaker: customer, text: "I've got a number in my head. I just didn't want to say it first." }
        - { speaker: rep, text: "That's fair. Other than the payment, is the Equinox the right car for you?" }
        - { speaker: customer, text: "Yeah, the car's fine. It's the monthly." }
        - { speaker: rep, text: "Then tell me the number, and I'll only show you options that are real. What payment do you need to stay under?" }
        - { speaker: customer, text: "Five fifty. I can't go over $550 a month, period." }
        - { speaker: rep, text: "Thank you, that helps. Two real ways to get there: $549 a month on 72 months with $5,500 down, or $541 a month with the same $2,000 down, but on a longer term, 84 months, so you pay more interest overall. Both are subject to the bank's approval. I'll print them side by side. Can you come back today at 5:30, after work, and pick one?" }
        - { speaker: customer, text: "5:30 works. Have both ready so I'm in and out." }
        - { speaker: rep, text: "They'll be printed and waiting at my desk. See you at 5:30." }
      es:
        - { speaker: customer, text: "El pago está muy alto. Y estoy en mi hora de almuerzo, así que no tengo mucho tiempo." }
        - { speaker: rep, text: "[pausa] Entendido. Voy a ser rápido. Ayúdeme a entender: cuando dice que el pago está muy alto, ¿qué número tenía en mente?" }
        - { speaker: customer, text: "Tengo un número en la cabeza. Es que no quería decirlo yo primero." }
        - { speaker: rep, text: "Me parece justo. Aparte del pago, ¿la Equinox es el carro para usted?" }
        - { speaker: customer, text: "Sí, el carro está bien. Es la mensualidad." }
        - { speaker: rep, text: "Entonces dígame el número, y le enseño solo opciones reales. ¿Cuál es el pago máximo que puede hacer al mes?" }
        - { speaker: customer, text: "Quinientos cincuenta. No me puedo pasar de $550 al mes, y punto." }
        - { speaker: rep, text: "Gracias, eso me ayuda. Hay dos maneras reales de llegar ahí: $549 al mes a 72 meses con $5,500 de inicial, o $541 al mes con los mismos $2,000 de inicial, pero a un plazo más largo, 84 meses, y al final paga más intereses. Las dos están sujetas a la aprobación del banco. Se las imprimo lado a lado. ¿Puede volver hoy a las 5:30, después del trabajo, y escoger una?" }
        - { speaker: customer, text: "A las 5:30 me sirve. Téngamelas listas para entrar y salir rápido." }
        - { speaker: rep, text: "Van a estar impresas y esperándolo en mi escritorio. Nos vemos a las 5:30." }
spanish_reviewed: false
