code: S-grinder-L3
module: car-core
title:
  en: "\"The price is too high\""
  es: "\"El precio está muy alto\""
setting:
  en: Weekday lunch hour, at your desk with the numbers sheet, right after the test drive.
  es: Un día de semana a la hora del almuerzo, en su escritorio con la hoja de números, justo después de la prueba de manejo.
persona: P-grinder
objection: O04
channel: floor
language_options: [en, es]
difficulty: 3
start_state: negotiation
pre_brief:
  en: "{name}, late 30s, runs a roofing crew and needs a full-size truck. He just drove the 2026 Silverado 1500 LT Z71 Crew Cab. The numbers sheet shows $48,810 out the door, with the $899 dealer fee already in; only tax, tag and title are added. He finances through his own credit union and has no trade. Your manager has given you room on this truck: you can go as low as $47,610 out the door."
  es: "{name}, de unos 38 años, tiene una cuadrilla de techos y necesita una camioneta grande. Acaba de manejar la Silverado 1500 LT Z71 doble cabina 2026. La hoja de números dice $48,810 con todo, con el cargo del dealer de $899 ya incluido; solo se suman impuestos, placa y título. Financia con su propia cooperativa de crédito y no tiene trade-in. Su gerente le dio margen en esta camioneta: puede bajar hasta $47,610 con todo."
opening:
  en: I've done my homework. Three thousand off, or I walk out that door.
  es: Yo hice mi tarea. Tres mil de descuento, o me voy por esa puerta.
facts:
  session_date: "2026-10-06"
  vehicle: { year: 2026, make: Chevrolet, model: Silverado 1500, trim: LT Z71 Crew Cab, color: Northsky Blue Metallic, stock: "7318", in_stock: true }
  price_cents: 4791100
  dealer_fees: [{ code: dealer_fee, cents: 89900 }]
  government_charges_customer_pays: [sales_tax, tag, title]
  all_in_price_cents: 4881000
  rebates: []
  deadlines: []
  inventory_same_trim_color: 2
  trade: null
  lender_state: not_applied
  add_ons: []
  payment_options: []
  authority: { manager_has_room: true, min_all_in_price_cents: 4761000 }
  text_consent: false
  customer_knows:
    demand_off_cents: 300000
    would_buy_at_off_cents: 120000
    financing: Own credit union
numbers_sheet: true
target_techniques: [T017, T028, T086, T001, T015, T110, T018]
rubric: R-objection
# Spec 10.5. The scenario table defines the total; universal items still run for coaching and mastery.
scoring:
  items:
    - code: O04-L3-PAUSE
      behavior:
        en: "Paused at least two seconds before replying to the demand"
        es: "Hizo una pausa de al menos dos segundos antes de responder a la exigencia"
      dimension: composure
      method: timing
      points: 10
      voice_only: true
      evidence: "Gong: top reps pause longer after objections"
      technique: T001
      params: { min_pause_ms: 2000, after: objection }
    - code: O04-L3-ANCHOR
      behavior:
        en: "Anchored with the real all-in price and a reason before moving at all"
        es: "Ancló con el precio total real y una razón antes de moverse"
      dimension: technique
      method: judge
      points: 15
      evidence: "2025 first-offer meta-analysis (T015)"
      technique: T015
    - code: O04-L3-CLUE
      behavior:
        en: "Treated the $3,000 demand as a clue and asked where it came from"
        es: "Trató la exigencia de $3,000 como una pista y preguntó de dónde salía"
      dimension: discovery
      method: judge
      points: 15
      evidence: "Malhotra and Bazerman (T110)"
      technique: T110
    - code: O04-L3-TRADE
      behavior:
        en: "Traded every concession for a commitment; never gave one away"
        es: "Cambió cada concesión por un compromiso; nunca regaló ninguna"
      dimension: technique
      method: judge
      points: 20
      evidence: "Practitioner tradition (T018); spec 4.1"
      technique: T018
    - code: O04-L3-STEPS
      behavior:
        en: "Moved in shrinking steps, each with a reason, and every number within the manager's authority"
        es: "Se movió en pasos cada vez más pequeños, cada uno con una razón, y todo número dentro del margen del gerente"
      dimension: technique
      method: judge
      points: 10
      evidence: "Kwon and Weingart 2004 (T019, T106)"
      technique: T019
    - code: O04-L3-HIDDEN
      behavior:
        en: "Surfaced the number he would really buy at"
        es: "Sacó a la luz el número con el que de verdad compraba"
      dimension: discovery
      method: engine
      points: 15
      evidence: Scenario design
      params: { event: hidden_revealed }
    - code: O04-L3-NEXT
      behavior:
        en: "Set a specific time today to sign and deliver, and he agreed"
        es: "Fijó una hora específica hoy para firmar y entregar, y el cliente aceptó"
      dimension: outcome
      method: engine_and_judge
      points: 15
      evidence: "T014"
      technique: T014
      params: { event: next_step }
  auto_fail:
    - code: insulted_customer
      description:
        en: "Insulted or mocked the customer's demand"
        es: "Insultó o se burló de lo que pedía el cliente"
      method: judge
    - code: made_up_deadline
      description:
        en: "Made up a deadline"
        es: "Inventó una fecha límite"
      method: rule_family
      rule_families: [deadlines]
    - code: misstated_number
      description:
        en: "Misstated a number or the manager's limit"
        es: "Dijo un número o un límite del gerente que no es real"
      method: rule_family
      rule_families: [price, payment, rate_and_approval, trade, authority]
exit_policy: { walk_away_base: 0.20, not_now_base: 0.20, triggers_raise_by: 0.30 }
max_turns: 24
time_limit_seconds: 480
demonstrations:
  flawed:
    notice:
      en: "Notice: he gave the whole $1,200 in one move, with no reason and nothing asked in return. The customer took it as proof there was more, and walked."
      es: "Fíjese: dio los $1,200 completos de un golpe, sin una razón y sin pedir nada a cambio. El cliente lo tomó como prueba de que había más, y se fue."
    script:
      en:
        - { speaker: customer, text: "I've done my homework. Three thousand off, or I walk out that door." }
        - { speaker: rep, text: "Three thousand? Come on, nobody gets that. Okay, okay. I'll knock $1,200 off right now. That puts you at $47,610 out the door." }
        - { speaker: customer, text: "Twelve hundred in ten seconds? Then there's more in there. Three thousand." }
        - { speaker: rep, text: "Let me see what else I can do for you." }
        - { speaker: customer, text: "Don't bother. If twelve hundred came that easy, the next dealer will do three thousand." }
        - { speaker: rep, text: "Okay. Here's my card. Let me know." }
        - { speaker: customer, text: "Yeah. We'll see." }
      es:
        - { speaker: customer, text: "Yo hice mi tarea. Tres mil de descuento, o me voy por esa puerta." }
        - { speaker: rep, text: "¿Tres mil? Ay, por favor, eso no se lo dan a nadie. Bueno, bueno. Le quito $1,200 ahora mismo. Eso lo deja en $47,610 con todo." }
        - { speaker: customer, text: "¿Mil doscientos en diez segundos? Entonces ahí hay más. Tres mil." }
        - { speaker: rep, text: "Déjeme ver qué más puedo hacer por usted." }
        - { speaker: customer, text: "No se moleste. Si los mil doscientos salieron tan fácil, el próximo dealer me da los tres mil." }
        - { speaker: rep, text: "Bueno. Aquí tiene mi tarjeta. Me avisa." }
        - { speaker: customer, text: "Sí. Ya veremos." }
  good:
    notice:
      en: "Notice the real price with a reason first, the question about the three thousand, and that every move is smaller than the last and bought with a commitment."
      es: "Fíjese en el precio real con una razón primero, en la pregunta sobre los tres mil, y en que cada paso es más pequeño que el anterior y se cambia por un compromiso."
    script:
      en:
        - { speaker: customer, text: "I've done my homework. Three thousand off, or I walk out that door." }
        - { speaker: rep, text: "[pause] I hear you, and I'd rather earn your business than watch you walk. This truck is $48,810 out the door, everything but tax, tag and title, because it's the LT Z71 crew cab you just drove, with every dealer charge already in it. Help me understand the three thousand. Where does that number come from?" }
        - { speaker: customer, text: "That's not my number. I said three thousand off." }
        - { speaker: rep, text: "I can't get to three thousand, but I'll move if you will. If I take $600 off, that's $48,210 out the door. Do we have a deal?" }
        - { speaker: customer, text: "Now you're talking like you want to sell a truck. Keep going." }
        - { speaker: rep, text: "I'll take one more step, and it's smaller, because we're close to what this truck is worth: another $400, $47,810 out the door. If I get you there, will you sign?" }
        - { speaker: customer, text: "Look, honestly? I never needed three grand. At twelve hundred off, I sign. I just wasn't going to pay sticker." }
        - { speaker: rep, text: "I appreciate the straight answer. Then here's my last step, and it's the smallest: another $200, which makes it the full $1,200 off, $47,610 out the door. In exchange, you sign the buyer's order now, and I'll have the truck detailed and ready for delivery at 5:30 today. Does 5:30 work?" }
        - { speaker: customer, text: "Fine. Write it up. I'll be here." }
      es:
        - { speaker: customer, text: "Yo hice mi tarea. Tres mil de descuento, o me voy por esa puerta." }
        - { speaker: rep, text: "[pausa] Lo entiendo, y prefiero ganarme su negocio que verlo irse. Esta camioneta está en $48,810 con todo, menos impuestos, placa y título, porque es la LT Z71 doble cabina que usted acaba de manejar, con todos los cargos del dealer ya incluidos. Ayúdeme a entender los tres mil. ¿De dónde sale ese número?" }
        - { speaker: customer, text: "Ese no es mi número. Le dije tres mil de descuento." }
        - { speaker: rep, text: "No puedo llegar a los tres mil, pero yo me muevo si usted se mueve. Si le quito $600, queda en $48,210 con todo. ¿Cerramos?" }
        - { speaker: customer, text: "Ahora sí está hablando como alguien que quiere vender una camioneta. Siga." }
        - { speaker: rep, text: "Doy un paso más, y es más pequeño, porque ya estamos cerca de lo que vale esta camioneta: $400 más, $47,810 con todo. Si se la dejo ahí, ¿la firma?" }
        - { speaker: customer, text: "Mire, la verdad, nunca necesité los tres mil. Con mil doscientos de descuento, firmo. Es que no iba a pagar el precio de lista." }
        - { speaker: rep, text: "Le agradezco que me hable claro. Entonces este es mi último paso, y es el más pequeño: $200 más, para llegar a los $1,200 completos de descuento, $47,610 con todo. A cambio, usted firma la orden de compra ahora, y le tengo la camioneta lavada y lista para entregársela a las 5:30 de hoy. ¿Le funcionan las 5:30?" }
        - { speaker: customer, text: "Está bien. Prepare los papeles. Aquí estaré." }
spanish_reviewed: false
