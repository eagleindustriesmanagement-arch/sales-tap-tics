code: S-spanish-contract-L1
module: car-language-trust
title:
  en: "\"Can I get the contract in Spanish?\""
  es: "\"¿Me puede dar el contrato en español?\""
setting:
  en: Saturday afternoon, at the desk, right after the test drive and the numbers.
  es: Sábado por la tarde, en el escritorio, justo después de la prueba de manejo y los números.
persona: P-spanish-contract
objection: O34
channel: floor
language_options: [es, en]
difficulty: 1
start_state: objection
pre_brief:
  en: "{name}, mid-50s, runs a small cleaning business in Hialeah. She just drove the 2026 Equinox LT and likes it. You showed her the all-in price of $32,849 plus tax, tag and title, and an estimated payment of $575 a month with $4,000 down, subject to the lender's approval. As you reach for the paperwork, she stops you."
  es: "{name}, de unos 55 años, tiene un pequeño negocio de limpieza en Hialeah. Acaba de manejar la Equinox LT 2026 y le gustó. Usted le enseñó el precio total de $32,849 más impuestos, tag y título, y un pago estimado de $575 al mes con $4,000 de down, sujeto a la aprobación del banco. Cuando usted va a buscar los papeles, ella lo para."
opening:
  en: Before we go on... can I get the contract in Spanish?
  es: Antes de seguir... ¿me puede dar el contrato en español?
# Which documents the store can give in Spanish is store policy set with counsel, so it is deliberately not a fact
# here: the good rep offers to check with the finance manager instead of promising or denying a Spanish contract.
facts:
  session_date: "2026-10-03"
  vehicle: { year: 2026, make: Chevrolet, model: Equinox, trim: LT, color: Sterling Gray Metallic, stock: "4651", in_stock: true }
  price_cents: 3195000
  dealer_fees: [{ code: dealer_fee, cents: 89900 }]
  government_charges_customer_pays: [sales_tax, tag, title]
  all_in_price_cents: 3284900
  rebates: []
  deadlines: []
  inventory_same_trim_color: 2
  trade: null
  lender_state: not_applied
  add_ons: []
  # An estimate on the numbers sheet, subject to the lender's approval. No add-ons in it.
  payment_options:
    - { code: quoted, cents: 57500, term_months: 72, down_cents: 400000 }
  authority: { manager_has_room: false }
  text_consent: false
  customer_knows:
    brother_contract: Her brother signed an English contract at another dealer last year and found an unexplained warranty in it with his first payment
    free_after_work: Off at 5:00 on weekdays
numbers_sheet: true
target_techniques: [T041, T070, T001, T003, T002, T014]
rubric: R-objection
scoring:
  items:
    - code: O34-PAUSE
      behavior:
        en: "Paused at least two seconds before replying"
        es: "Hizo una pausa de al menos dos segundos antes de responder"
      dimension: composure
      method: timing
      points: 10
      voice_only: true
      evidence: "Gong: top reps pause longer after objections"
      technique: T001
      params: { min_pause_ms: 2000, after: objection }
    - code: O34-SAME
      behavior:
        en: "Treated the request as fair and said the deal is the same in both languages"
        es: "Trató la pregunta como algo justo y dijo que el negocio es el mismo en los dos idiomas"
      dimension: technique
      method: judge
      points: 15
      evidence: "T041; FAIR-01"
      technique: T041
    - code: O34-QFIRST
      behavior:
        en: "Asked what worries her about the contract before answering"
        es: "Preguntó qué le preocupa del contrato antes de contestar"
      dimension: discovery
      method: judge
      points: 20
      evidence: "Gong: 54.3% versus 31.0%"
      technique: T002
    - code: O34-HIDDEN
      behavior:
        en: "Surfaced her fear of hidden terms"
        es: "Sacó a la luz su miedo a condiciones escondidas"
      dimension: discovery
      method: engine
      points: 15
      evidence: Scenario design
      params: { event: hidden_revealed }
    - code: O34-LINES
      behavior:
        en: "Promised a line-by-line review in Spanish before anything is signed, and offered to check which documents the store has in Spanish instead of guessing"
        es: "Prometió revisar línea por línea en español antes de firmar nada, y ofreció averiguar qué documentos tiene la tienda en español en vez de adivinar"
      dimension: technique
      method: judge
      points: 25
      evidence: "O34 core moves: T041, store policy set with counsel; T070"
      technique: T070
    - code: O34-NEXT
      behavior:
        en: "Set a specific day and time"
        es: "Fijó un día y una hora específicos"
      dimension: outcome
      method: engine_and_judge
      points: 15
      evidence: "T014"
      technique: T014
      params: { event: next_step }
  auto_fail:
    - code: guessed_store_policy
      description:
        en: "Promised a Spanish contract, or said there is none, without checking the store's policy"
        es: "Prometió un contrato en español, o dijo que no hay, sin averiguar la política de la tienda"
      method: judge
    - code: different_terms_by_language
      description:
        en: "Gave different numbers or terms in Spanish than in English"
        es: "Dio números o condiciones distintos en español que en inglés"
      method: judge
    - code: made_up_deadline
      description:
        en: "Made up a deadline"
        es: "Inventó una fecha límite"
      method: rule_family
      rule_families: [deadlines]
    - code: misstated_number
      description:
        en: "Misstated a number"
        es: "Dijo un número que no es real"
      method: rule_family
      rule_families: [price, payment, rate_and_approval, trade]
exit_policy: { walk_away_base: 0.10, not_now_base: 0.25, triggers_raise_by: 0.25 }
max_turns: 24
time_limit_seconds: 480
demonstrations:
  flawed:
    notice:
      en: "Notice: he called the contract standard, told her a relative could translate it, and pushed for today. He never asked what worried her about the contract."
      es: "Fíjese: dijo que el contrato era estándar, le dijo que un familiar se lo podía traducir y la presionó para hoy. Nunca le preguntó qué le preocupaba del contrato."
    script:
      en:
        - { speaker: customer, text: "Before we go on... can I get the contract in Spanish?" }
        - { speaker: rep, text: "Don't worry about that. It's a standard contract, the same one everybody signs." }
        - { speaker: customer, text: "Please don't rush me. I asked a simple question." }
        - { speaker: rep, text: "If you want, your son can translate it for you on the phone. Let's just do it today." }
        - { speaker: customer, text: "Not today. I'd rather come back when I can read everything calmly." }
        - { speaker: rep, text: "Alright. Here's my card. Call me when you're ready." }
        - { speaker: customer, text: "Thank you for your time." }
      es:
        - { speaker: customer, text: "Antes de seguir... ¿me puede dar el contrato en español?" }
        - { speaker: rep, text: "No se preocupe por eso. Es un contrato estándar, el mismo que firma todo el mundo." }
        - { speaker: customer, text: "Por favor, no me apure. Le hice una pregunta sencilla." }
        - { speaker: rep, text: "Si quiere, su hijo se lo traduce por teléfono. Hagámoslo hoy." }
        - { speaker: customer, text: "Hoy no. Prefiero volver cuando pueda leerlo todo con calma." }
        - { speaker: rep, text: "Está bien. Aquí tiene mi tarjeta. Llámeme cuando esté lista." }
        - { speaker: customer, text: "Gracias por su tiempo." }
  good:
    notice:
      en: Notice the pause, the promise that the deal is the same in both languages, the question about what worries her, and the honest offer to check what the store has in Spanish instead of guessing.
      es: Fíjese en la pausa, en que el negocio es el mismo en los dos idiomas, en la pregunta sobre qué le preocupa, y en la oferta honesta de averiguar qué tiene la tienda en español en vez de adivinar.
    script:
      en:
        - { speaker: customer, text: "Before we go on... can I get the contract in Spanish?" }
        - { speaker: rep, text: "[pause] Of course, that's a fair thing to ask. English or Spanish, it's the same price, same terms, same paperwork. Before I go find out exactly which documents we have in Spanish, can I ask what worries you about the contract?" }
        - { speaker: customer, text: "I just want to know exactly what I'm signing. Line by line." }
        - { speaker: rep, text: "That's fair. Setting the papers aside for a second, are the Equinox and the numbers we went over right for you?" }
        - { speaker: customer, text: "I love the car. It's the papers that make me nervous." }
        - { speaker: rep, text: "I understand. Has something happened before with a contract, to you or to someone close to you?" }
        - { speaker: customer, text: "Okay, I'll tell you. Last year my brother signed a contract in English at another dealer, and with the first payment he found out they had put in a warranty nobody explained. I don't want that to happen to me." }
        - { speaker: rep, text: "Thank you for telling me. Then here's how we'll do it: nothing gets signed until we go through every line together, in Spanish. There's nothing extra in this deal; it's $32,849 plus tax, tag and title, and the estimate is $575 a month with $4,000 down, subject to the lender's approval. Anything else the finance office offers is optional, and you decide. Meanwhile I'll ask our finance manager which documents we have in Spanish, so you have a real answer. Can you come Tuesday at 6, after work, to go through it all calmly?" }
        - { speaker: customer, text: "Tuesday at 6 works for me. I'll bring my glasses." }
        - { speaker: rep, text: "Perfect. I'll have every page ready. See you Tuesday at 6." }
      es:
        - { speaker: customer, text: "Antes de seguir... ¿me puede dar el contrato en español?" }
        - { speaker: rep, text: "[pausa] Claro que sí, es una pregunta muy justa. En inglés o en español, es el mismo precio, las mismas condiciones y los mismos papeles. Antes de ir a averiguar exactamente qué documentos tenemos en español, ¿le puedo preguntar qué es lo que le preocupa del contrato?" }
        - { speaker: customer, text: "Es que quiero saber exactamente lo que estoy firmando. Línea por línea." }
        - { speaker: rep, text: "Me parece justo. Dejando los papeles a un lado un momento, ¿la Equinox y los números que vimos le funcionan?" }
        - { speaker: customer, text: "El carro me encanta. Son los papeles los que me ponen nerviosa." }
        - { speaker: rep, text: "La entiendo. ¿Le ha pasado algo antes con un contrato, a usted o a alguien cercano?" }
        - { speaker: customer, text: "Bueno, se lo digo. El año pasado mi hermano firmó un contrato en inglés en otro dealer, y con el primer pago se enteró de que le habían metido una garantía que nadie le explicó. Yo no quiero que me pase lo mismo." }
        - { speaker: rep, text: "Gracias por contármelo. Entonces lo vamos a hacer así: no se firma nada hasta que revisemos juntos cada línea, en español. En este negocio no hay nada extra; son $32,849 más impuestos, tag y título, y el estimado es de $575 al mes con $4,000 de down, sujeto a la aprobación del banco. Cualquier otra cosa que le ofrezcan en finanzas es opcional, y usted decide. Mientras tanto le pregunto a nuestro gerente de finanzas qué documentos tenemos en español, para que usted tenga una respuesta de verdad. ¿Puede venir el martes a las 6, después del trabajo, para verlo todo con calma?" }
        - { speaker: customer, text: "El martes a las 6 me queda bien. Traigo mis espejuelos." }
        - { speaker: rep, text: "Perfecto. Le tengo todas las páginas listas. Nos vemos el martes a las 6." }
spanish_reviewed: false
