code: S-homes-advice-L1
module: homes-core
industry: homes
title:
  en: "\"What would you do if you were me?\""
  es: "\"¿Usted qué haría si fuera yo?\""
setting:
  en: Wednesday evening, at the sales office, after she walked both finished homes for the second time.
  es: Miércoles por la noche, en la oficina de ventas, después de recorrer por segunda vez las dos casas terminadas.
persona: P-homes-advice
objection: O58
channel: floor
language_options: [en, es]
difficulty: 1
start_state: objection
pre_brief:
  en: "{name}, mid-50s, rents in Doral with her son and has a preapproval from her own lender. Tonight she walked both finished homes at Cayo Verde Reserve again: the one-story Gumbo Limbo on Lot 15 at $549,990, and the two-story Ceiba on Lot 16 at $564,990, where every bedroom is upstairs. Neither has any other builder charge; closing costs are separate and her lender estimates them. She turns to you with a question."
  es: "{name}, de unos 55 años, vive alquilada en Doral con su hijo y tiene una preaprobación de su propio lender. Esta noche volvió a recorrer las dos casas terminadas en Cayo Verde Reserve: la Gumbo Limbo de un piso en el Lote 15, por $549,990, y la Ceiba de dos pisos en el Lote 16, por $564,990, donde todos los cuartos están arriba. Ninguna tiene otro cargo del builder; los closing costs son aparte y se los estima su lender. Ella se voltea y le hace una pregunta."
opening:
  en: What would you do if you were me?
  es: ¿Usted qué haría si fuera yo?
# The item, mapped onto the shared facts schema (decision 0033): make = builder (fictional), model = plan,
# trim = lot and elevation, stock = lot number, in_stock = a finished home, ready to close.
facts:
  session_date: "2026-10-07"
  vehicle: { year: 2026, make: Cayo Verde Homes, model: Gumbo Limbo, trim: "Lot 15, Elevation A, 3 bed + den, 2 bath, one-story", stock: "Lot 15", in_stock: true }
  price_cents: 54999000
  dealer_fees: []
  # Closing costs are not builder charges and not part of the price; the customer's lender estimates them.
  government_charges_customer_pays: []
  all_in_price_cents: 54999000
  rebates: []
  deadlines: []
  inventory_same_trim_color: 1
  alternatives:
    - { description: "Cayo Verde Homes Ceiba, Lot 16, finished, 4 bed, 2.5 bath, two-story, every bedroom upstairs", all_in_price_cents: 56499000 }
  trade: null
  # The customer's own lender issued a preapproval letter: not a loan approval, no rate. The builder has neither.
  lender_state: pending
  add_ons: []
  payment_options: []
  authority: { manager_has_room: false }
  text_consent: false
  customer_knows:
    father: Her father is 81, uses a walker, and moves in with her in the spring
    free_saturday: Free Saturday morning; her father can come
numbers_sheet: false
target_techniques: [T092, T001, T002, T093, T014]
rubric: R-objection
# Spec 10.5. The scenario table defines the total; universal items still run for coaching and mastery.
scoring:
  items:
    - code: HOM-O58-PAUSE
      behavior:
        en: "Paused at least two seconds before replying"
        es: "Hizo una pausa de al menos dos segundos antes de responder"
      dimension: composure
      method: timing
      points: 10
      voice_only: true
      evidence: "Gong: top reps pause longer after objections"
      technique: T001
      params: { min_pause_ms: 2000, after: objection }
    - code: HOM-O58-QFIRST
      behavior:
        en: "Asked who will live in the house and how before giving advice"
        es: "Preguntó quién va a vivir en la casa y cómo, antes de dar un consejo"
      dimension: discovery
      method: judge
      points: 20
      evidence: "Gong: 54.3% versus 31.0%"
      technique: T002
    - code: HOM-O58-HIDDEN
      behavior:
        en: "Surfaced that her father, who uses a walker, is moving in"
        es: "Sacó a la luz que su papá, que usa andador, se viene a vivir con ella"
      dimension: discovery
      method: engine
      points: 20
      evidence: Scenario design
      params: { event: hidden_revealed }
    - code: HOM-O58-RECOMMEND
      behavior:
        en: "Gave one clear recommendation with a reason tied to what she said"
        es: "Dio una recomendación clara con una razón basada en lo que ella dijo"
      dimension: technique
      method: judge
      points: 25
      evidence: "The JOLT Effect (T092)"
      technique: T092
    - code: HOM-O58-LIMIT
      behavior:
        en: "Kept the choice to the two homes she was already weighing"
        es: "Mantuvo la decisión entre las dos casas que ella ya estaba comparando"
      dimension: technique
      method: judge
      points: 10
      evidence: "Choice overload meta-analysis (T093)"
      technique: T093
    - code: HOM-O58-NEXT
      behavior:
        en: "Set a specific day and time"
        es: "Fijó un día y una hora específicos"
      dimension: outcome
      method: engine_and_judge
      points: 15
      evidence: "T014"
      technique: T014
      params: { event: next_step }
  auto_fail:
    - code: claimed_unchecked_access
      description:
        en: "Promised the home works for her father's walker without walking it with him"
        es: "Aseguró que la casa le sirve al andador de su papá sin haberla recorrido con él"
      method: judge
    - code: made_up_deadline
      description:
        en: "Made up a deadline"
        es: "Inventó una fecha límite"
      method: rule_family
      rule_families: [deadlines]
    - code: misstated_number
      description:
        en: "Misstated a number"
        es: "Dijo un número que no es real"
      method: rule_family
      rule_families: [price, payment, rate_and_approval]
exit_policy: { walk_away_base: 0.10, not_now_base: 0.25, triggers_raise_by: 0.25 }
max_turns: 24
time_limit_seconds: 480
demonstrations:
  flawed:
    notice:
      en: "Notice: he answered before asking a single question, gave no real reason, added more homes to an already hard choice, and pushed for a deposit."
      es: "Fíjese: contestó sin hacer una sola pregunta, no dio ninguna razón de verdad, le agregó más casas a una decisión que ya era difícil, y presionó para el depósito."
    script:
      en:
        - { speaker: customer, text: "What would you do if you were me?" }
        - { speaker: rep, text: "Easy. The Ceiba. Four bedrooms, two stories. Everybody wants the bigger one." }
        - { speaker: customer, text: "But why the Ceiba?" }
        - { speaker: rep, text: "It's just more house. And if you're still torn, let me show you the Jacaranda and the corner lots too, so you can compare all four." }
        - { speaker: customer, text: "Four? Now I'm more confused than when I came in." }
        - { speaker: rep, text: "Then just trust me and put the deposit down on the Ceiba today." }
        - { speaker: customer, text: "I think I'll go home and think about it." }
        - { speaker: rep, text: "Okay. Here's my card. Let me know." }
      es:
        - { speaker: customer, text: "¿Usted qué haría si fuera yo?" }
        - { speaker: rep, text: "Fácil. La Ceiba. Cuatro cuartos, dos pisos. Todo el mundo quiere la más grande." }
        - { speaker: customer, text: "¿Pero por qué la Ceiba?" }
        - { speaker: rep, text: "Porque es más casa. Y si todavía está indecisa, también le enseño la Jacaranda y los lotes de esquina, para que compare las cuatro." }
        - { speaker: customer, text: "¿Cuatro? Ahora estoy más confundida que cuando llegué." }
        - { speaker: rep, text: "Entonces confíe en mí y deje el depósito en la Ceiba hoy." }
        - { speaker: customer, text: "Creo que me voy a la casa a pensarlo." }
        - { speaker: rep, text: "Bueno. Aquí tiene mi tarjeta. Me avisa." }
  good:
    notice:
      en: Notice that he promises an answer, asks about her real life first, and then owns one recommendation with a reason, and a way to prove it with her father there.
      es: Fíjese en que promete una respuesta, primero pregunta por su vida real, y después se hace responsable de una recomendación con una razón, y de una manera de comprobarla con su papá presente.
    script:
      en:
        - { speaker: customer, text: "What would you do if you were me?" }
        - { speaker: rep, text: "[pause] I'll tell you exactly what I'd do, I promise. I just want my answer to be about your life, not mine. Who's going to live in the house with you?" }
        - { speaker: customer, text: "Mostly it's me and my son. But I'm not only buying for us." }
        - { speaker: rep, text: "That helps. And apart from the price, do the Ceiba and the Gumbo Limbo both feel like home when you walk them?" }
        - { speaker: customer, text: "They both feel like home. That's why I can't decide." }
        - { speaker: rep, text: "Then let's find what breaks the tie. Walk me through a normal week in that house. Who comes and goes, and what does the house have to make easy?" }
        - { speaker: customer, text: "It's my dad. He's 81, he uses a walker, and he moves in with me in the spring. In the Ceiba every bedroom is upstairs." }
        - { speaker: rep, text: "Thank you, that changes my answer. If I were you, I'd lean toward the Gumbo Limbo, because everything is on one floor, and your dad getting around safely is the one thing you can't compromise on. But I don't want you to take my word for it." }
        - { speaker: customer, text: "That's what I needed. Someone to just tell me straight." }
        - { speaker: rep, text: "Bring him Saturday at 10. We'll walk both homes with his walker, from the driveway to the bedroom and the shower, and you'll see it with your own eyes before you decide." }
        - { speaker: customer, text: "Okay, that works. I'll bring him." }
      es:
        - { speaker: customer, text: "¿Usted qué haría si fuera yo?" }
        - { speaker: rep, text: "[pausa] Le voy a decir exactamente lo que yo haría, se lo prometo. Solo quiero que mi respuesta sea sobre su vida, no la mía. ¿Quién va a vivir con usted en la casa?" }
        - { speaker: customer, text: "Más que nada somos mi hijo y yo. Pero no estoy comprando solo para nosotros." }
        - { speaker: rep, text: "Eso me ayuda. Y aparte del precio, ¿la Ceiba y la Gumbo Limbo se sienten como su casa cuando las recorre?" }
        - { speaker: customer, text: "Las dos se sienten como mi casa. Por eso es que no me decido." }
        - { speaker: rep, text: "Entonces busquemos qué inclina la balanza. Cuénteme cómo sería una semana normal en esa casa. ¿Quién entra y sale, y qué le tiene que hacer fácil la casa?" }
        - { speaker: customer, text: "Es mi papá. Tiene 81 años, usa andador, y se viene a vivir conmigo en la primavera. En la Ceiba todos los cuartos están arriba." }
        - { speaker: rep, text: "Gracias, eso cambia mi respuesta. Si yo fuera usted, me inclinaría por la Gumbo Limbo, porque todo está en un solo piso, y que su papá se pueda mover seguro es lo único en lo que no puede ceder. Pero no quiero que lo crea solo porque yo lo digo." }
        - { speaker: customer, text: "Eso es lo que necesitaba. Que alguien me lo dijera claro." }
        - { speaker: rep, text: "Tráigalo el sábado a las 10. Recorremos las dos casas con su andador, desde la entrada hasta el cuarto y la ducha, y usted lo ve con sus propios ojos antes de decidir." }
        - { speaker: customer, text: "Está bien, me queda bien. Lo traigo." }
spanish_reviewed: false
