code: L-deadline-tester
scenario: S-deadline-tester-L2
title:
  en: "\"I'm not buying today\": hand him the clock, then show the paper"
  es: "\"Hoy no voy a comprar\": déle el control del tiempo, y enséñele el papel"
hook:
  en: He likes the car. But every dealer in town told him "it ends this weekend." He is testing you.
  es: Le gusta el carro. Pero en todos los dealers le dijeron "eso se acaba este fin de semana". Lo está probando a usted.
tactic:
  en: When he says he isn't buying today, agree that he doesn't have to. Then show him the real deadline on paper, and let him pick the next step.
  es: "Cuando le diga que hoy no va a comprar, déle la razón: no tiene que comprar. Después enséñele la fecha real por escrito y deje que él escoja el próximo paso."
steps:
  - en: "Pause, then say: \"Fair question, and you don't have to buy anything today.\""
    es: "Haga una pausa y diga: \"Buena pregunta, y usted no tiene que comprar nada hoy.\""
  - en: Hand him the bulletin from Chevrolet with the end date on it.
    es: Póngale en la mano el boletín de Chevrolet con la fecha en que se acaba.
  - en: Don't add any pressure. Let him keep the bulletin.
    es: No le agregue presión. Deje que se quede con el boletín.
  - en: Ask what "not today" really means for him.
    es: Pregunte qué quiere decir de verdad ese "hoy no".
  - en: Offer two real times and let him choose one.
    es: Ofrézcale dos horas reales y deje que él escoja una.
what:
  en: Take the pressure off. Then let the real deadline, on paper, speak for itself.
  es: Quítele la presión. Después deje que la fecha real, por escrito, hable sola.
why:
  en: '"Not today" protects him. Other dealers lied to him about deadlines. Tell him he doesn''t have to buy, and he stops fighting. The bulletin shows the deadline is Chevrolet''s, not yours. When he feels in control, he can say yes.'
  es: 'El "hoy no" lo protege. Otros dealers le mintieron con fechas. Dígale que no tiene que comprar y deja de pelear. El boletín le enseña que la fecha es de Chevrolet, no suya. Cuando siente que tiene el control, puede decir que sí.'
when:
  en: 'He says "not today," and you have a real deadline with proof.'
  es: 'Él dice "hoy no" y usted tiene una fecha real con prueba.'
when_not:
  en: No bulletin in your hand? Don't mention a deadline. Just set the next step.
  es: ¿No tiene el boletín en la mano? No mencione ninguna fecha. Solo fije el próximo paso.
say:
  - en: Fair question, and you don't have to buy anything today.
    es: Buena pregunta, y usted no tiene que comprar nada hoy.
  - en: Don't take my word for it. Here's the bulletin from Chevrolet, with the end date on it.
    es: No me lo crea a mí nada más. Aquí está el boletín de Chevrolet, con la fecha en que se acaba.
  - en: The bulletin is yours to keep. No rush from me.
    es: El boletín es suyo, se lo lleva. De mi parte no hay apuro.
  - en: Is later today after work or tomorrow morning better to sit down?
    es: ¿Le queda mejor hoy más tarde, después del trabajo, o mañana por la mañana para sentarnos?
mistakes:
  - mistake:
      en: '"Trust me, it''s really ending."'
      es: '"Créame, de verdad se acaba."'
    fix:
      en: He doesn't trust you yet. Show him the paper.
      es: Todavía no confía en usted. Enséñele el papel.
  - mistake:
      en: Adding "someone else wants it" or "today only."
      es: Añadir "hay otro interesado" o "solo por hoy".
    fix:
      en: That is the lie he came in to test you for. The real deadline is enough.
      es: Esa es la mentira que vino a buscar. La fecha real es suficiente.
  - mistake:
      en: '"Okay, let me know."'
      es: '"Bueno, me avisa."'
    fix:
      en: He may want to buy. Offer him two real times.
      es: A lo mejor quiere comprar. Ofrézcale dos horas reales.
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: A calm pause tells him you won't pressure him.
      es: Una pausa tranquila le dice que no lo va a presionar.
    items: [O07-PAUSE]
  - name: { en: Hand him the clock, es: Déle el control del tiempo }
    idea:
      en: Tell him he doesn't have to buy today, and mean it.
      es: Dígale que no tiene que comprar hoy, y dígalo en serio.
    items: [O07-RESPECT]
  - name: { en: "Show, don't swear", es: "Enseñe, no jure" }
    idea:
      en: Put the bulletin and its date in his hands.
      es: Póngale en las manos el boletín y su fecha.
    items: [O07-PROOF]
  - name: { en: '"Not today" is a shield', es: 'El "hoy no" es un escudo' }
    idea:
      en: It protects him. He may buy today if the deadline is real.
      es: Lo protege. Puede que compre hoy si la fecha es real.
    items: [O07-HIDDEN]
  - name: { en: 'Advance, not "let me know"', es: 'Avance, no "me avisa"' }
    idea:
      en: End with a step he agrees to, not a maybe.
      es: Termine con un paso que él acepte, no con un "hablamos".
    items: [O07-ADVANCE]
  - name: { en: He picks the time, es: Él escoge la hora }
    idea:
      en: Give two real options. He picks the day and time.
      es: Déle dos opciones reales. Él escoge el día y la hora.
    items: [O07-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T107 Real deadline on the table; T068 Advance, not "let me know"; T014 Firm next step; T122 Graceful "not now"
  - Gino and Moore 2008 (only real deadlines help), via T107
  - Neil Rackham, SPIN Selling (advances versus continuations), via T068
spanish_reviewed: false
