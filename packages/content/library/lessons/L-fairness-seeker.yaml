code: L-fairness-seeker
scenario: S-fairness-seeker-L2
title:
  en: "\"Is that really your best price?\": one real move, earned"
  es: "\"¿Ese es su último precio?\": una rebaja real, bien ganada"
hook:
  en: He isn't arguing with your price. He noticed you haven't moved.
  es: No le discute el precio. Notó que usted no se ha movido.
tactic:
  en: When he asks if this is your best price, repeat the total and ask what feels fair. If you have room, give one small discount for his signature.
  es: Cuando le pregunte si es su último precio, repita el total y pregunte qué le parece justo. Si tiene margen, déle una rebaja chica a cambio de su firma.
steps:
  - en: Pause, then repeat the total price and what's in it.
    es: Haga una pausa y repita el precio total y lo que incluye.
  - en: "Ask: \"What would make this feel like a fair deal to you?\""
    es: "Pregunte: \"¿Qué haría que esto le pareciera un negocio justo?\""
  - en: Ask who he is thinking of when he talks about paying full price.
    es: Pregunte en quién está pensando cuando habla de pagar el precio completo.
  - en: "If you have room, offer one small discount. Ask: \"If my manager signs it, will you?\""
    es: "Si tiene margen, ofrezca una rebaja chica. Pregunte: \"Si mi gerente lo firma, ¿usted firma también?\""
  - en: Put the discount on its own line on paper. Set a time to sign.
    es: Ponga la rebaja en su propia línea en el papel. Fije una hora para firmar.
what:
  en: Help him feel the deal is fair, with one real discount he earned.
  es: Ayúdelo a sentir que el negocio es justo, con una rebaja real que se ganó.
why:
  en: He is protecting his pride. If nothing moves, he feels tricked, even at a good price. Someone at home may ask what he got off. One small discount he earned gives him a story. Giving it all at once makes the price look fake.
  es: Está cuidando su orgullo. Si nada se mueve, siente que lo engañaron, aunque el precio sea bueno. Alguien en la casa le puede preguntar cuánto le rebajaron. Una rebaja chica que se ganó le da algo que contar. Si lo da todo de una vez, el precio parece falso.
when:
  en: He asks if your total price is really your best.
  es: Él pregunta si su precio total es de verdad el último.
when_not:
  en: No room from your manager? Don't make up a discount or fake a manager trip. Hold the price.
  es: ¿Su gerente no le dio margen? No invente un descuento ni finja una ida al gerente. Sostenga el precio.
say:
  - en: Fair question. That's the all-in price, every dealer charge in it. I'd rather show you a real number than play games.
    es: Buena pregunta. Ese es el precio total, con todos los cargos de concesionario. Prefiero enseñarle un número real que andar con juegos.
  - en: Help me understand. What would make this feel like a fair deal to you?
    es: Ayúdeme a entender. ¿Qué haría que esto le pareciera un negocio justo?
  - en: When you say you don't want to pay full price, who are you thinking of?
    es: Cuando dice que no quiere pagar el precio completo, ¿en quién está pensando?
  - en: I won't invent a discount, but I have a little room. If my manager signs it, will you?
    es: No le voy a inventar un descuento, pero tengo un poquito de margen. Si mi gerente lo firma, ¿usted firma también?
mistakes:
  - mistake:
      en: '"Okay, I''ll knock it all off right now."'
      es: '"Bueno, se lo quito todo ahora mismo."'
    fix:
      en: Now he wonders what else you're hiding. Give one small step, with a reason.
      es: Ahora se pregunta qué más está escondiendo. Déle una sola rebaja chica, con su razón.
  - mistake:
      en: '"Honestly, that''s already a great deal."'
      es: '"La verdad, ya eso es un negocio buenísimo."'
    fix:
      en: That ignores his question. Ask what fair means to him.
      es: Eso ignora su pregunta. Pregúntele qué es justo para él.
  - mistake:
      en: Faking a trip to the manager's office for show.
      es: Fingir una ida a la oficina del gerente para aparentar.
    fix:
      en: Only describe a manager trip that really happened.
      es: Solo cuente una ida al gerente que de verdad pasó.
concepts:
  - name: { en: "The real price, again", es: "El precio real, otra vez" }
    idea:
      en: Pause. Repeat the total and what's in it.
      es: Haga una pausa. Repita el total y lo que incluye.
    items: [O33-PAUSE, O33-ANCHOR]
  - name: { en: "What does fair mean?", es: "¿Qué es lo justo?" }
    idea:
      en: Ask before you offer. You'll hear who he compares himself to.
      es: Pregunte antes de ofrecer. Va a oír con quién se compara.
    items: [O33-QFIRST, O33-HIDDEN]
  - name: { en: One earned step, es: Una rebaja ganada }
    idea:
      en: Small, real, with a reason. Never all your room at once.
      es: Chica, real y con su razón. Nunca todo el margen de una vez.
    items: [O33-EARNED]
  - name: { en: Trade it, es: Cámbiela }
    idea:
      en: Give the discount only for his promise to sign.
      es: Dé la rebaja solo a cambio de que se comprometa a firmar.
    items: [O33-TRADE]
  - name: { en: "On paper, on the clock", es: "Por escrito y con hora" }
    idea:
      en: Its own line on paper, then a time to sign.
      es: Su propia línea en el papel, y después una hora para firmar.
    items: [O33-NEXT]
sources:
  - T042 Visible concession ladder; T106 Concession staircase; T002 Clarify with a question; T001 Pause and slow down; T014 Firm next step
  - Ogliastri's business interviews, via T042
  - Kwon and Weingart (2004) on concession patterns, via T106
spanish_reviewed: false
