code: L-wary-first-timer
scenario: S-wary-first-timer-L2
title:
  en: "\"I didn't ask for that\": say optional, then find the fear"
  es: "\"Yo no pedí eso\": diga opcional, y después busque el miedo"
hook:
  en: His first car and first job. He reads every line with his finger, and stops at nitrogen and wheel locks.
  es: Es su primer carro y su primer trabajo. Lee cada línea con el dedo. Se detiene en el nitrógeno y las tuercas de seguridad.
tactic: { en: "Thank him and say \"optional\" in your first answer. Ask what worries him before you take it off. Then show both payments, each one labeled.", es: "Agradézcale y diga \"opcional\" en su primera respuesta. Pregúntele qué le preocupa antes de quitarlo. Después enséñele los dos pagos, cada uno identificado." }
steps:
  - { en: "Pause, then say: \"Good question, and thank you for asking before you sign anything.\"", es: "Haga una pausa y diga: \"Buena pregunta, y gracias por preguntar antes de firmar nada.\"" }
  - { en: "Say right away: \"That's optional, and it comes off if you don't want it.\"", es: "Diga enseguida: \"Eso es opcional, y se quita si usted no lo quiere.\"" }
  - { en: "Ask what worries him, and if it happened to someone he knows.", es: "Pregúntele qué le preocupa, y si le pasó a alguien que él conoce." }
  - { en: "Show his payment with it and without it, each one labeled. Without his yes, take it off.", es: "Enséñele su pago con eso y sin eso, cada uno identificado. Sin su sí, quíteselo." }
  - { en: "Print a clean sheet, and set a time to read it together.", es: "Imprima una hoja nueva y fije una hora para leerla juntos." }
what:
  en: His question is about one line. His worry is bigger. Answer both.
  es: Su pregunta es sobre una línea. Su preocupación es más grande. Conteste las dos.
why:
  en: First-time buyers have heard bad stories, often from someone close. He's really asking if you are the dealer from the story. If you cross out the line fast, he wonders what else is hidden. If you ask what worries him, he tells you.
  es: El que compra su primer carro ha oído cuentos malos, muchas veces de alguien cercano. En realidad pregunta si usted es el dealer del cuento. Si tacha la línea rápido, se queda pensando qué más está escondido. Si le pregunta qué le preocupa, se lo cuenta.
when:
  en: Any time a customer asks about an add-on, most of all a first-time buyer.
  es: Cada vez que el cliente pregunta por un accesorio, sobre todo si es su primer carro.
when_not:
  en: Ask one question, not ten. If he just wants it gone, take it off.
  es: Haga una pregunta, no diez. Si solo quiere que lo quite, quíteselo.
say:
  - en: Good question, and thank you for asking before you sign anything.
    es: Buena pregunta, y gracias por preguntar antes de firmar nada.
  - en: That's optional, and it comes off if you don't want it.
    es: Eso es opcional, y se quita si usted no lo quiere.
  - en: Before I take it off, can I ask what worries you about seeing it on the sheet?
    es: Antes de quitarlo, ¿le puedo preguntar qué le preocupa de verlo en la hoja?
  - en: Has something like that happened to you, or to someone you know?
    es: ¿Le ha pasado algo así a usted, o a alguien que usted conoce?
  - en: Here's your payment with it and without it, each one labeled.
    es: Aquí tiene su pago con eso y sin eso, cada uno identificado.
mistakes:
  - mistake:
      en: '"Everybody gets nitrogen. It''s good for the tires."'
      es: '"Todo el mundo lo lleva. El nitrógeno es bueno para las gomas."'
    fix:
      en: Defending it is exactly what the story warned him about.
      es: Defenderlo es justo lo que el cuento le advirtió.
  - mistake:
      en: Crossing out the line without a word and moving on.
      es: Tachar la línea sin decir nada y seguir.
    fix:
      en: You fixed the line, not the fear. Ask first.
      es: Arregló la línea, no el miedo. Pregunte primero.
  - mistake:
      en: Quoting only the payment with it in.
      es: Dar solo el pago con eso incluido.
    fix:
      en: Show both payments, each one labeled.
      es: Enseñe los dos pagos, cada uno identificado.
concepts:
  - name: { en: Pause and thank him, es: Pausa y agradézcale }
    idea:
      en: His question is fair. Don't defend the item.
      es: Su pregunta es justa. No defienda el producto.
    items: [O20-PAUSE, O20-ACK]
  - name: { en: "Optional, first answer", es: "Opcional, en la primera respuesta" }
    idea:
      en: Say it plainly, then take it off.
      es: Dígalo claro, y después quíteselo.
    items: [O20-OPTIONAL]
  - name: { en: "What worries you?", es: "¿Qué le preocupa?" }
    idea:
      en: Ask before you explain or remove anything.
      es: Pregunte antes de explicar o quitar nada.
    items: [O20-QFIRST]
  - name: { en: "Whose story is it?", es: "¿De quién es el cuento?" }
    idea:
      en: Someone he knows paid for extras they never agreed to. Ask, and he'll tell you.
      es: A alguien que él conoce le cobraron extras que nunca aceptó. Pregunte, y se lo cuenta.
    items: [O20-HIDDEN]
  - name: { en: Two-payment menu, es: Menú de dos pagos }
    idea:
      en: With and without, each one labeled.
      es: Con y sin, cada uno identificado.
    items: [O20-MENU]
  - name: { en: "Clean sheet, set time", es: "Hoja limpia, hora fija" }
    idea:
      en: Print the new sheet. Pick a time to read it together.
      es: Imprima la hoja nueva. Fije una hora para leerla juntos.
    items: [O20-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T120 Optional means optional; T002 Clarify with a question; T121 Two-payment menu; T014 Firm next step
  - Rules PAY-01 and PAY-02 (every payment labeled, with and without)
spanish_reviewed: false
