code: L-payment-buyer
scenario: S-payment-buyer-L2
title:
  en: "\"The payment is too high\": get his number before you move yours"
  es: "\"El pago está muy alto\": saque su número antes de mover el suyo"
hook:
  en: He saw the monthly payment, and his lunch break is almost over. Don't start cutting numbers.
  es: Vio el pago mensual, y se le acaba la hora de almuerzo. No empiece a bajar números.
tactic: { en: "Ask what payment he had in mind before you change any number. Then show only the real options, with what each one costs.", es: "Pregunte qué pago tenía en mente antes de cambiar cualquier número. Después enséñele solo las opciones reales, y lo que cuesta cada una." }
steps:
  - { en: "Pause, then ask: \"What payment were you expecting?\"", es: "Haga una pausa y pregunte: \"¿Qué pago tenía en mente?\"" }
  - { en: "Ask: \"Other than the payment, is this the right car for you?\"", es: "Pregunte: \"Aparte del pago, ¿este es el carro para usted?\"" }
  - { en: "Ask what monthly payment he needs to stay under.", es: "Pregunte por debajo de qué pago mensual necesita quedarse." }
  - { en: "Show only real options from the sheet. Say a longer term costs more interest.", es: "Enséñele solo opciones reales de la hoja. Diga claro que un plazo más largo cuesta más intereses." }
  - { en: "Keep it short, and set a time to come back and choose.", es: "Sea breve, y fije una hora para que vuelva a escoger." }
what:
  en: He has a budget he hasn't told you. Get it before you show any options.
  es: Tiene un presupuesto que no le ha dicho. Averígüelo antes de enseñarle opciones.
why:
  en: He won't say his number first. He thinks you'll build the deal right up to it. If you guess, you may give away money, or miss and lose him. If you ask, he works with you.
  es: No dice su número primero. Cree que usted va a armar el negocio justo hasta ahí. Si adivina, puede regalar dinero, o quedarse corto y perderlo. Si pregunta, él trabaja con usted.
when:
  en: As soon as he complains about the payment, before you touch any number.
  es: En cuanto se queje del pago, antes de tocar cualquier número.
when_not:
  en: Never make the loan longer without telling him. If no real option reaches his number, tell him honestly.
  es: Nunca alargue el plazo sin decírselo. Si ninguna opción real llega a su número, dígaselo con honestidad.
say:
  - en: Got it, I'll keep this quick. What payment were you expecting?
    es: Entendido, voy a ser rápido. ¿Qué pago tenía en mente?
  - en: Other than the payment, is this the right car for you?
    es: Aparte del pago, ¿este es el carro para usted?
  - en: Help me understand. What's behind that number?
    es: Ayúdeme a entender. ¿Qué hay detrás de ese número?
  - en: This one is lower because the term is longer, so you pay more interest overall.
    es: Este sale más bajo porque el plazo es más largo, así que al final paga más intereses.
mistakes:
  - mistake:
      en: '"Everybody says that at first. You''ll forget it after a month."'
      es: '"Todo el mundo dice eso al principio. Al mes ni se acuerda."'
    fix:
      en: That argues with his budget. Ask for his number instead.
      es: Eso es discutirle el presupuesto. Mejor pregúntele su número.
  - mistake:
      en: A lower payment on a longer term, without saying how many months.
      es: Un pago más bajo con un plazo más largo, sin decir cuántos meses.
    fix:
      en: More months cost more in total. Say the months and the extra interest.
      es: Más meses cuestan más en total. Diga los meses y los intereses de más.
  - mistake:
      en: A long sales talk to a man on his lunch break.
      es: Un discurso largo a un hombre en su hora de almuerzo.
    fix:
      en: Keep answers short. Out of time? Set a time to come back.
      es: Respuestas cortas. ¿Se le acabó el tiempo? Fije una hora para volver.
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: Wait two seconds. A fast answer sounds defensive.
      es: Espere dos segundos. Una respuesta rápida suena a que se está defendiendo.
    items: [O03-PAUSE]
  - name: { en: His number first, es: Primero su número }
    idea:
      en: Ask his payment, then why it matters. That's his real limit.
      es: Pregunte su pago y después por qué es importante. Ese es su límite real.
    items: [O03-QFIRST, O03-HIDDEN]
  - name: { en: '"Other than the payment…"', es: '"Aparte del pago…"' }
    idea:
      en: If the car is right, you only need to solve the math.
      es: Si el carro es el correcto, solo falta resolver los números.
    items: [O03-ISOLATE]
  - name: { en: 'Walk the wheel, honestly', es: 'Recorra las opciones, con la verdad' }
    idea:
      en: More down or a longer term. Only what's on the sheet, each with its cost.
      es: Más inicial o un plazo más largo. Solo lo que está en la hoja, cada uno con su costo.
    items: [O03-OPTIONS]
  - name: { en: Lunch-break pace, es: Ritmo de hora de almuerzo }
    idea:
      en: Short answers build trust faster than a long sales talk.
      es: Las respuestas cortas dan confianza más rápido que un discurso largo.
    items: [O03-BRIEF]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: Print the options and set a time to come back and pick one.
      es: Imprima las opciones y fije una hora para que vuelva a escoger una.
    items: [O03-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T005 Isolate; T110 Treat a hard demand as a clue; T083 Walk the wheel; T014 Firm next step
  - Malhotra and Bazerman, Negotiation Genius (the interest behind a firm number), via T110
  - Mark Tewart (walk the wheel), via T083
spanish_reviewed: false
