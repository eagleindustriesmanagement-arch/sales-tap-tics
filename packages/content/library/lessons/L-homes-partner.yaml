code: L-homes-partner
scenario: S-homes-partner-L1
title:
  en: "\"I need to talk to my husband\": find out what he'll ask"
  es: "\"Tengo que hablarlo con mi esposo\": averigüe qué va a preguntar él"
hook:
  en: "She loves the house. Then she says she needs to talk to her husband. Ask a question. Don't hand her a brochure."
  es: "Le encanta la casa. Entonces dice que tiene que hablarlo con su esposo. Haga una pregunta. No le dé un folleto."
tactic:
  en: "Agree, then ask what her husband will ask first. Send any loan or payment question to their loan officer."
  es: "Déle la razón y pregunte qué va a preguntar su esposo primero. Mande cualquier pregunta del préstamo o del pago a su loan officer."
steps:
  - en: "Pause, then agree: \"Of course. You should both feel good about it.\""
    es: "Haga una pausa y déle la razón: \"Claro que sí. Los dos tienen que sentirse bien.\""
  - en: "Ask: \"What do you think his first question will be?\""
    es: "Pregunte: \"¿Qué cree que él le va a preguntar primero?\""
  - en: "Ask if the house is right for them, apart from that."
    es: "Pregunte si la casa es la correcta, aparte de eso."
  - en: "Ask if the price fits what they planned with their lender."
    es: "Pregunte si el precio entra en lo que planearon con su lender."
  - en: "Send money questions to their loan officer. Set a day and time for both."
    es: "Mande las preguntas de dinero a su loan officer. Fije un día y una hora para los dos."
what:
  en: "Treat the husband as a buyer who isn't here yet. Find out what they will discuss at home."
  es: "Trate al esposo como un comprador que todavía no ha llegado. Averigüe de qué van a hablar en la casa."
why:
  en: "A house is often a joint decision. Often there is also a number she is worried about, like their preapproval amount. If you push, it gets worse. If you ask what he will ask, you are on her side."
  es: "Una casa muchas veces es una decisión de los dos. Muchas veces también hay un número que le preocupa, como el monto de su preaprobación. Si presiona, es peor. Si pregunta qué va a preguntar él, usted está de su lado."
when:
  en: "When a buyer names someone who isn't here."
  es: "Cuando el cliente nombra a alguien que no está."
when_not:
  en: "Never answer for the lender. If it's her call, ask for the sale."
  es: "Nunca conteste por el lender. Si la decisión es de ella, pídale la venta."
say:
  - en: Of course. This is your family's home, and you should both feel good about it.
    es: Claro que sí. Es la casa de su familia, y los dos tienen que sentirse bien con ella.
  - en: When you two sit down tonight, what do you think his first question will be?
    es: Cuando se sienten a hablarlo esta noche, ¿qué cree que él le va a preguntar primero?
  - en: When you two talked to your lender, is this where you planned to be?
    es: Cuando hablaron con su lender, ¿esto es lo que tenían planeado?
  - en: I can't tell you what a lender will do. Your loan officer can, so let's take both prices to them.
    es: Yo no le puedo decir lo que va a hacer un lender. Su loan officer sí, así que llevémosle los dos precios.
mistakes:
  - mistake:
      en: "\"Do you really need his permission?\""
      es: "\"¿De verdad necesita su permiso?\""
    fix:
      en: "That makes him the enemy. Ask about him instead."
      es: "Eso lo convierte en el enemigo. Mejor pregunte por él."
  - mistake:
      en: "Guessing what the lender will approve, or quoting a monthly payment."
      es: "Adivinar lo que va a aprobar el lender, o decir un pago mensual."
    fix:
      en: "Only the lender can give that number."
      es: "Ese número solo lo da el lender."
  - mistake:
      en: "Handing over a card with \"call me when he's ready.\""
      es: "Dar la tarjeta con un \"me llama cuando él esté listo\"."
    fix:
      en: "She may not come back. Set a day and time for both."
      es: "A lo mejor no vuelve. Fije un día y una hora para los dos."
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: "Wait two seconds. Silence shows you won't argue."
      es: "Espere dos segundos. El silencio dice que no va a discutir."
    items: [HOM-O01-PAUSE]
  - name: { en: Respect the partner, es: Respete a la pareja }
    idea:
      en: "He is a buyer too. Plan a visit for both."
      es: "Él también es comprador. Planee una visita para los dos."
    items: [HOM-O01-ACK, HOM-O01-NEXT]
  - name: { en: His first question, es: La primera pregunta de él }
    idea:
      en: "Asking what he will ask brings out her real worry."
      es: "Preguntar qué va a preguntar él saca la preocupación real."
    items: [HOM-O01-QFIRST, HOM-O01-HIDDEN]
  - name: { en: '"Other than that…"', es: '"Aparte de eso…"' }
    idea:
      en: "Check that the house is right, apart from the talk at home."
      es: "Confirme que la casa es la correcta, aparte de la conversación en la casa."
    items: [HOM-O01-ISOLATE]
  - name: { en: The lender's number, es: El número del lender }
    idea:
      en: "Loans, rates and payments come from their loan officer."
      es: "El préstamo, la tasa y el pago los da su loan officer."
    items: [HOM-O01-LENDER]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T002 Clarify with a question; T005 Isolate; T013 Include the decision maker; T014 Specific next step
  - RATE-01 Rates, payments and approvals match the facts
spanish_reviewed: false
