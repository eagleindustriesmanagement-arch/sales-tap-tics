code: L-furniture-price
scenario: S-furniture-price-L1
title:
  en: "\"The price is too high\": ask \"compared to what?\""
  es: "\"El precio está muy alto\": pregunte \"¿comparado con qué?\""
hook:
  en: "She loves the bedroom set, but says the price is too high. She is comparing it to a price you haven't seen."
  es: "Le encanta el juego de cuarto, pero dice que el precio está muy alto. Lo está comparando con un precio que usted no ha visto."
tactic:
  en: "Don't defend the price or cut it. Ask what she is comparing it to. Then compare both all-in, with the same features."
  es: "No defienda el precio ni lo rebaje. Pregunte con qué lo está comparando. Después compare los dos con precio total y las mismas características."
steps:
  - en: "Pause, thank her, then ask: \"Too high compared to what?\""
    es: "Haga una pausa, déle las gracias y pregunte: \"¿Muy alto comparado con qué?\""
  - en: "Ask if this is the set she wants, apart from the price."
    es: "Pregunte si este es el juego que quiere, aparte del precio."
  - en: "Ask what she saw. Don't call it worse."
    es: "Pregunte qué vio. No diga que es peor."
  - en: "Compare materials, drawers, and whether delivery and setup are included."
    es: "Compare materiales, gavetas, y si la entrega y la instalación están incluidas."
  - en: "Mention the real store promotion and when it ends. Set a day and time."
    es: "Mencione la promoción real y cuándo se acaba. Fije un día y una hora."
what:
  en: "Find her comparison first. Then compare both sets fairly, item by item."
  es: "Primero averigüe con qué lo compara. Después compare los dos juegos con justicia, punto por punto."
why:
  en: "Online, veneer and solid oak look the same, and delivery often costs extra. She is afraid of paying too much. If you ask, you see her comparison. If you argue, she leaves and buys the other one."
  es: "En internet, el enchapado y el roble macizo se ven iguales, y la entrega muchas veces cuesta aparte. Ella tiene miedo de pagar de más. Si pregunta, ve con qué lo compara. Si discute, ella se va y compra el otro."
when:
  en: "Any time a customer who wants the piece says the price is too high."
  es: "Cada vez que un cliente que quiere la pieza dice que el precio está muy alto."
when_not:
  en: "Never criticize a set you haven't seen. Win on what you can show."
  es: "Nunca hable mal de un juego que usted no ha visto. Gane con lo que puede enseñar."
say:
  - en: I appreciate you saying it straight. Too high compared to what?
    es: Le agradezco que me lo diga claro. ¿Muy alto comparado con qué?
  - en: Setting the price aside for a second, is this the set you want in your bedroom?
    es: Dejando el precio a un lado un momento, ¿este es el juego que quiere en su cuarto?
  - en: I haven't seen that set, so I won't tell you it's worse. Let's line them up side by side.
    es: Yo no he visto ese juego, así que no le voy a decir que es peor. Pongámoslos lado a lado.
  - en: Here's ours all-in, with white-glove delivery, plus sales tax. Now let's see theirs the same way.
    es: Aquí está el nuestro con precio total, con la entrega white-glove, más el impuesto de venta. Ahora veamos el otro igual.
mistakes:
  - mistake:
      en: "\"You get what you pay for.\""
      es: "\"Lo barato sale caro.\""
    fix:
      en: "That is a lecture. Ask what she saw."
      es: "Eso es un sermón. Pregúntele qué vio."
  - mistake:
      en: "\"What if I knock something off?\""
      es: "\"¿Y si le rebajo algo?\""
    fix:
      en: "A discount on a guess says the price wasn't real."
      es: "Un descuento sin saber nada dice que el precio no era real."
  - mistake:
      en: "Calling the online set junk."
      es: "Decir que el juego de internet es basura."
    fix:
      en: "You haven't seen it. Compare item by item."
      es: "Usted no lo ha visto. Compare punto por punto."
concepts:
  - name:
      en: "Pause, then thank her"
      es: "Pausa, y agradézcale"
    idea:
      en: "Wait two seconds. Thank her. Don't defend the price."
      es: "Espere dos segundos. Déle las gracias. No defienda el precio."
    items: [FUR-O04-PAUSE, FUR-O04-ACK]
  - name: { en: '"Compared to what?"', es: '"¿Comparado con qué?"' }
    idea:
      en: "It brings out the price she has in mind."
      es: "Saca el precio que ella tiene en la cabeza."
    items: [FUR-O04-QFIRST, FUR-O04-HIDDEN]
  - name:
      en: "The set, apart from the price"
      es: "El juego, aparte del precio"
    idea:
      en: "Check that she wants this set."
      es: "Confirme que quiere este juego."
    items: [FUR-O04-ISOLATE]
  - name:
      en: "Side by side, all-in"
      es: "Lado a lado, precio total"
    idea:
      en: "Same features, delivery included. Never criticize what you haven't seen."
      es: "Mismas características, con la entrega incluida. Nunca hable mal de lo que no ha visto."
    items: [FUR-O04-SIDE]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "She comes back with the link at a set time."
      es: "Que vuelva con el link a una hora fija."
    items: [FUR-O04-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T017 Sell value before discounting; T005 Isolate; T086 Side-by-side; T028 Counter a low anchor by refocusing; T014 Specific next step
spanish_reviewed: false
