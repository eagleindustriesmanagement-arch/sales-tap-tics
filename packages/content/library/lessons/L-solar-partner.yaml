code: L-solar-partner
scenario: S-solar-partner-L1
title:
  en: "\"I need to talk to my husband\": find out what he'll ask"
  es: "\"Tengo que hablarlo con mi esposo\": averigüe qué va a preguntar él"
hook:
  en: "The visit went well. Then she says she needs to talk to her husband. Don't just leave a brochure."
  es: "La visita salió bien. Entonces dice que tiene que hablarlo con su esposo. No se limite a dejarle un folleto."
tactic:
  en: "Agree, then ask what her husband will ask first. Invite him to a site survey that answers it."
  es: "Déle la razón y pregunte qué va a preguntar su esposo primero. Invítelo a una visita técnica que conteste esa pregunta."
steps:
  - en: "Pause, then agree: \"Of course. You should both be comfortable.\""
    es: "Haga una pausa y déle la razón: \"Claro que sí. Los dos tienen que sentirse cómodos.\""
  - en: "Ask: \"What do you think his first question will be?\""
    es: "Pregunte: \"¿Qué cree que él le va a preguntar primero?\""
  - en: "Ask if the system and the numbers make sense to her, apart from that."
    es: "Pregunte si el sistema y los números le parecen bien, aparte de eso."
  - en: "If the worry is the roof, don't guess. Offer a site survey with a written result."
    es: "Si la preocupación es el techo, no adivine. Ofrezca una visita técnica con el resultado por escrito."
  - en: "Set a day and time when her husband can be there."
    es: "Fije un día y una hora en que su esposo pueda estar."
what:
  en: "Treat the husband as a buyer who hasn't seen the roof yet. Find out what they will talk about tonight."
  es: "Trate al esposo como un comprador que todavía no ha visto el techo. Averigüe de qué van a hablar esta noche."
why:
  en: "The house belongs to both of them. Often she is repeating his worry, and it's usually about the house, not the panels. If you push, you prove him right. If you ask, you are on her side."
  es: "La casa es de los dos. Muchas veces ella trae la preocupación de él, y casi siempre es sobre la casa, no sobre los paneles. Si presiona, le da la razón a él. Si pregunta, usted está del lado de ella."
when:
  en: "Whenever a homeowner names someone who isn't at the table."
  es: "Cada vez que el dueño de la casa nombra a alguien que no está en la mesa."
when_not:
  en: "Don't push for a signature tonight. Set a visit with him there."
  es: "No presione para que firme esta noche. Fije una visita con él presente."
say:
  - en: Of course. It's your home, and you should both be comfortable with it.
    es: Claro que sí. Es su casa, y los dos tienen que sentirse cómodos.
  - en: When you sit down with him tonight, what do you think his first question will be?
    es: Cuando lo hablen esta noche, ¿qué cree que él le va a preguntar primero?
  - en: I'm not going to guess about your roof. Let's have the site survey check it with both of you here.
    es: No voy a adivinar sobre su techo. Que la visita técnica lo revise con los dos presentes.
mistakes:
  - mistake:
      en: "\"What if you sign tonight and tell him in the morning?\""
      es: "\"¿Y si firma esta noche y se lo cuenta a él en la mañana?\""
    fix:
      en: "That makes him the enemy. Ask about him instead."
      es: "Eso lo convierte en el enemigo. Mejor pregunte por él."
  - mistake:
      en: "\"The roof looks fine to me.\""
      es: "\"El techo se ve bien.\""
    fix:
      en: "You haven't inspected it. Offer the site survey."
      es: "Usted no lo ha inspeccionado. Ofrezca la visita técnica."
  - mistake:
      en: "Leaving a brochure with \"let me know.\""
      es: "Dejar el folleto con un \"me avisa\"."
    fix:
      en: "You will likely lose the sale. Set a day and time with him."
      es: "Lo más seguro es que pierda la venta. Fije un día y una hora con él."
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: "Wait two seconds. Silence shows you won't argue."
      es: "Espere dos segundos. El silencio dice que no va a discutir."
    items: [SOL-O01-PAUSE]
  - name: { en: Respect the partner, es: Respete a la pareja }
    idea:
      en: "He is a buyer too. Invite him to the next visit."
      es: "Él también es comprador. Invítelo a la próxima visita."
    items: [SOL-O01-ACK, SOL-O01-PARTNER]
  - name: { en: His first question, es: La primera pregunta de él }
    idea:
      en: "Asking what he will ask brings out the real worry, often the roof."
      es: "Preguntar qué va a preguntar él saca la preocupación real, muchas veces el techo."
    items: [SOL-O01-QFIRST, SOL-O01-HIDDEN]
  - name: { en: '"Setting that aside…"', es: '"Dejando eso a un lado…"' }
    idea:
      en: "Check that the system is right for her, apart from the talk at home."
      es: "Confirme que el sistema le parece bien, aparte de la conversación en la casa."
    items: [SOL-O01-ISOLATE]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "A site survey on a day and time that work for both."
      es: "Una visita técnica un día y a una hora que les sirvan a los dos."
    items: [SOL-O01-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T005 Isolate; T013 Include the decision maker; T014 Specific next step
spanish_reviewed: false
