code: L-furniture-thinker
scenario: S-furniture-thinker-L1
title:
  en: "\"I need to think about it\": find the one open question"
  es: "\"Lo tengo que pensar\": encuentre la única duda que queda"
hook:
  en: "He came back three weekends for the same dining set, and he still needs to think. One question is still open."
  es: "Volvió tres fines de semana por el mismo comedor, y todavía lo tiene que pensar. Le queda una duda."
tactic:
  en: "Agree, then ask what he still wants to be sure about. Settle it with something in writing, like a confirmed delivery date."
  es: "Déle la razón y pregunte qué es lo que todavía quiere tener claro. Resuélvalo con algo por escrito, como una fecha de entrega confirmada."
steps:
  - en: "Pause, then agree: \"That makes sense. It's a big purchase.\""
    es: "Haga una pausa y déle la razón: \"Tiene sentido. Es una compra grande.\""
  - en: "Ask: \"What's the part you still want to be sure about?\""
    es: "Pregunte: \"¿Qué es lo que todavía quiere tener seguro?\""
  - en: "Ask if the set and the price work for him, apart from that."
    es: "Pregunte si el juego y el precio le convencen, aparte de eso."
  - en: "Ask if he is buying it for a special day."
    es: "Pregunte si lo está comprando para una fecha especial."
  - en: "Don't guess a delivery date. Get it in writing. Set a time to review it."
    es: "No adivine una fecha de entrega. Consígala por escrito y fije una hora para revisarla."
what:
  en: "Find the one open question. Answer it with something in writing."
  es: "Encuentre la única duda. Contéstela con algo por escrito."
why:
  en: "People often buy a dining set for a special night, like Nochebuena. The fear is that it won't arrive in time. He may feel silly asking, so you ask."
  es: "Muchas veces la gente compra un comedor para una noche especial, como la Nochebuena. El miedo es que no llegue a tiempo. A lo mejor le da pena preguntar, así que pregunte usted."
when:
  en: "A customer who likes the piece says he needs to think."
  es: "Un cliente al que le gusta la pieza dice que lo tiene que pensar."
when_not:
  en: "No question left? Ask for the sale. If he needs a night, set a time first."
  es: "¿Sin dudas? Pídale la venta. Si necesita una noche, fije una hora primero."
say:
  - en: That makes sense. It's a big purchase for the family.
    es: Tiene sentido. Es una compra grande para la familia.
  - en: When you think it over tonight, what's the part you still want to be sure about?
    es: Cuando lo piense esta noche, ¿qué es lo que todavía quiere tener seguro?
  - en: Setting that aside, do the set and the price work for you?
    es: Dejando eso a un lado, ¿el juego y el precio le convencen?
  - en: I'm not going to guess a delivery date. I'll get it confirmed in writing before you decide.
    es: No voy a adivinar una fecha de entrega. Se la consigo confirmada por escrito antes de que usted decida.
mistakes:
  - mistake:
      en: "\"What's there to think about?\""
      es: "\"¿Pero qué hay que pensar?\""
    fix:
      en: "That makes his question sound silly. Ask what it is."
      es: "Eso hace ver su duda como una bobería. Pregúntele cuál es."
  - mistake:
      en: "\"No problem, it'll be there before Christmas.\""
      es: "\"No se preocupe, llega antes de Navidad.\""
    fix:
      en: "You don't control deliveries. Get the date in writing."
      es: "Usted no controla las entregas. Consiga la fecha por escrito."
  - mistake:
      en: "Walking him to three more dining sets."
      es: "Llevarlo a ver tres comedores más."
    fix:
      en: "More choices, more thinking. Answer his one question."
      es: "Más opciones, más que pensar. Resuelva su única duda."
concepts:
  - name:
      en: "Pause, then agree"
      es: "Pausa y acuerdo"
    idea:
      en: "Wait two seconds. Agree it's worth thinking about."
      es: "Espere dos segundos. Déle la razón: hay que pensarlo bien."
    items: [FUR-O05-PAUSE, FUR-O05-RESPECT]
  - name: { en: '"What part?"', es: '"¿Qué parte?"' }
    idea:
      en: "Ask what exactly he wants to think over."
      es: "Pregunte qué es exactamente lo que quiere pensar."
    items: [FUR-O05-QFIRST, FUR-O05-HIDDEN]
  - name: { en: Rule out the money, es: Descarte el dinero }
    idea:
      en: "Check that the set and the price work, so you solve the right problem."
      es: "Confirme que el juego y el precio le convencen, para resolver el problema correcto."
    items: [FUR-O05-ISOLATE]
  - name: { en: A date on paper, es: Una fecha en papel }
    idea:
      en: "A date confirmed in writing, never a guess."
      es: "Una fecha confirmada por escrito, nunca una adivinanza."
    items: [FUR-O05-PROOF]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "He comes back to see the date in writing."
      es: "Que vuelva a ver la fecha por escrito."
    items: [FUR-O05-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T002 Clarify with a question; T091 Name the fear; T005 Isolate; T094 Remove real risk; T093 Limit the exploration; T115 Set the time, then ask; T014 Specific next step
spanish_reviewed: false
