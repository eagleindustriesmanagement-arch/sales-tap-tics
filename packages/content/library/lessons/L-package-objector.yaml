code: L-package-objector
scenario: S-package-objector-L2
title:
  en: "\"I didn't ask for that package\": optional, priced apart, a real answer"
  es: "\"Yo no pedí ese paquete\": opcional, con su precio aparte, y una respuesta de verdad"
hook:
  en: He picked the car online. The sheet shows tint, door guards and mats he never asked for.
  es: Escogió el carro por internet. La hoja trae tinte, protectores de puertas y alfombras que nunca pidió.
tactic: { en: "Agree he didn't ask for it, and say it's optional. Give the price without it, and get your manager's answer by a set time today.", es: "Déle la razón de que no lo pidió, y dígale que es opcional. Déle el precio sin el paquete y consiga la respuesta de su gerente a una hora fija hoy." }
steps:
  - { en: "Pause, then agree: \"You're right, you didn't ask for it. It's optional.\"", es: "Haga una pausa y déle la razón: \"Tiene razón, usted no lo pidió. Es opcional.\"" }
  - { en: "Ask: \"Setting the package aside, is this the car you want?\"", es: "Pregunte: \"Dejando el paquete a un lado, ¿este es el carro que usted quiere?\"" }
  - { en: "Give the all-in price without it, and the package price on its own line.", es: "Déle el precio total sin el paquete, y el precio del paquete en su propia línea." }
  - { en: "Offer to sit down with your manager to find a solution.", es: "Ofrezca sentarse con su gerente para buscar una solución." }
  - { en: "Set a time today to come back with the answer in writing.", es: "Fije una hora hoy para volver con la respuesta por escrito." }
what:
  en: Give him the choice back, and be honest about what you don't know.
  es: Devuélvale la decisión. Diga con honestidad lo que usted todavía no sabe.
why:
  en: He isn't against tint. He's against being told what to pay for. "It's already on the car" sounds like no choice, so he wants to leave. "Optional" gives the choice back. Then he often says he'll buy today if the package is handled.
  es: No está en contra del tinte. Está en contra de que le digan qué pagar. "Ya viene en el carro" suena a que no tiene opción, y le dan ganas de irse. "Opcional" le devuelve la decisión. Entonces muchas veces dice que compra hoy si se resuelve lo del paquete.
when:
  en: Any time he says he didn't ask for an item the dealer installed.
  es: Cada vez que el cliente dice que no pidió un accesorio que instaló el dealer.
when_not:
  en: Don't promise it comes off or is free. The store has no policy yet. Get the answer, and say when.
  es: No prometa que se quita ni que es gratis. La tienda todavía no tiene política. Consiga la respuesta, y diga cuándo.
say:
  - en: You're right, you didn't ask for it. It's already on the car, but it's optional.
    es: Tiene razón, usted no lo pidió. Ya está instalado, pero es opcional.
  - en: Setting the package aside, is this the car you want?
    es: Dejando el paquete a un lado, ¿este es el carro que usted quiere?
  - en: Here's the all-in price without the package, and the package on its own line.
    es: Este es el precio total sin el paquete, y el paquete con su precio aparte.
  - en: Let me sit down with my manager to find a solution for the package.
    es: Déjeme sentarme con mi gerente para buscarle una solución al paquete.
mistakes:
  - mistake:
      en: '"It''s installed, so it can''t come off."'
      es: '"Ya está instalado, así que no se puede quitar."'
    fix:
      en: Never. Say "optional" and go to your manager.
      es: Nunca. Diga "opcional" y vaya con su gerente.
  - mistake:
      en: '"In this Miami sun, you''ll want that tint."'
      es: '"Con este sol de Miami, usted va a querer ese tinte."'
    fix:
      en: He said no. Stop selling and solve the problem.
      es: Dijo que no. Deje de vender y resuelva el problema.
  - mistake:
      en: '"Don''t worry, we''ll throw it in."'
      es: '"No se preocupe, se lo dejamos de regalo."'
    fix:
      en: You don't know that. Anything with a price is never free.
      es: Usted no lo sabe. Lo que tiene precio nunca es gratis.
concepts:
  - name: { en: Pause and agree, es: Pausa y déle la razón }
    idea:
      en: Wait two seconds. Then say, "You didn't ask for it."
      es: Espere dos segundos. Después diga "usted no lo pidió".
    items: [O65-PAUSE, O65-ACK]
  - name: { en: Optional means optional, es: Opcional quiere decir opcional }
    idea:
      en: Installed does not mean required. Say so, then offer your manager's help.
      es: Instalado no quiere decir obligatorio. Dígalo y ofrezca la ayuda de su gerente.
    items: [O65-OPTIONAL]
  - name: { en: 'Never "can''t," never "free"', es: 'Nunca "no se puede", nunca "gratis"' }
    idea:
      en: Both are untrue for this package.
      es: Las dos cosas son falsas con este paquete.
    items: [O65-HONEST]
  - name: { en: Price it without the package, es: El precio sin el paquete }
    idea:
      en: The full price without it. The package as its own number.
      es: El precio total sin el paquete. El paquete con su propio número.
    items: [O65-WITHOUT]
  - name: { en: Set the package aside, es: Deje el paquete a un lado }
    idea:
      en: If the car is right, only the package is left.
      es: Si el carro es el que quiere, solo queda el paquete.
    items: [O65-HIDDEN]
  - name: { en: "The answer, at a set time", es: "La respuesta, a una hora fija" }
    idea:
      en: A time today. The answer in writing, both sheets side by side.
      es: Una hora hoy. La respuesta por escrito, con las dos hojas lado a lado.
    items: [O65-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T120 Optional means optional; T030 Out-the-door first; T005 Isolate; T014 Firm next step
  - Rules ADD-02 (never "can't be removed"; no store policy set, so offer the manager) and ADD-03 (nothing charged is free)
spanish_reviewed: false
