code: L-homes-browser
scenario: S-homes-browser-L1
title:
  en: "\"I'm just looking\": take the pressure off, then ask about home"
  es: "\"Solo estoy mirando\": quítele la presión y pregunte por su casa"
hook:
  en: "A woman walks into the model home alone and says she's just looking. She doesn't trust you yet."
  es: "Una mujer entra sola a la casa modelo y dice que solo está mirando. Todavía no confía en usted."
tactic:
  en: "Take the pressure off. Then ask where she lives now. If she has to move by a date, help her make a calm plan."
  es: "Quítele la presión. Después pregúntele dónde vive ahora. Si tiene que mudarse para una fecha, ayúdela a hacer un plan con calma."
steps:
  - en: "Pause, then say: \"Take your time. You're free to look on your own.\""
    es: "Haga una pausa y diga: \"Tómese su tiempo. Puede mirar por su cuenta.\""
  - en: "Ask if she is just starting to look."
    es: "Pregunte si apenas está empezando a mirar."
  - en: "Ask: \"Where are you living now?\""
    es: "Pregunte: \"¿Dónde vive ahora?\""
  - en: "If she has a move date, suggest a lender she picks first, then homes that fit."
    es: "Si tiene fecha para mudarse, sugiera primero un lender que ella escoja y después las casas que le sirven."
  - en: "Set a day and time for her next visit."
    es: "Fije un día y una hora para su próxima visita."
what:
  en: "Make her feel free to look. Ask about her search and where she lives now. Never use her move date to push her."
  es: "Haga que se sienta libre de mirar. Pregunte por su búsqueda y por dónde vive ahora. Nunca use su fecha de mudanza para presionarla."
why:
  en: "Most people who say \"just looking\" have a reason to look now. Usually it's where they live today. She expects you to push. When you don't, she relaxes and tells you more."
  es: "Casi todos los que dicen \"solo estoy mirando\" tienen una razón para mirar ahora. Casi siempre es donde viven hoy. Ella espera que usted la presione. Cuando no lo hace, se relaja y le cuenta más."
when:
  en: "Any walk-in who answers your hello with \"just looking.\""
  es: "Cualquier cliente sin cita que le contesta el saludo con \"solo estoy mirando\"."
when_not:
  en: "Don't use her date against her. Saying \"You'd better sign before January\" is pressure, and it isn't true."
  es: "No use su fecha en contra de ella. Decir \"Mejor firme antes de enero\" es presión, y no es verdad."
say:
  - en: That's perfect. Take your time, and you're free to walk through on your own.
    es: Perfecto. Tómese su tiempo, y está en libertad de recorrerla por su cuenta.
  - en: Are you just starting to look, or have you narrowed it down a bit?
    es: ¿Apenas está empezando a mirar, o ya tiene algo más o menos pensado?
  - en: So I can point you to the right homes, where are you living now?
    es: Para orientarla bien, ¿dónde vive ahora?
  - en: That's enough time to do this calmly. First a lender you choose, then the homes that fit.
    es: Eso alcanza para hacerlo con calma. Primero un lender que usted escoja, después las casas que le sirven.
mistakes:
  - mistake:
      en: "\"Everybody's just looking!\""
      es: "\"¡Todo el mundo está solo mirando!\""
    fix:
      en: "That tells her she's lying. Agree, then ask one easy question."
      es: "Eso le dice que está mintiendo. Déle la razón y haga una pregunta fácil."
  - mistake:
      en: "Asking for her Social Security number or a credit application in the first five minutes."
      es: "Pedirle el seguro social o una solicitud de crédito en los primeros cinco minutos."
    fix:
      en: "That is for her lender, later. First, get her to come back."
      es: "Eso es para su lender, más adelante. Primero, logre que vuelva."
  - mistake:
      en: "Talking about the kitchen before you know anything about her."
      es: "Hablarle de la cocina antes de saber nada de ella."
    fix:
      en: "Ask about her life first."
      es: "Pregunte primero por su vida."
concepts:
  - name: { en: "Pause, then free", es: "Pausa, y libertad" }
    idea:
      en: "Wait two seconds. Then tell her she is free to look."
      es: "Espere dos segundos. Después dígale que puede mirar con libertad."
    items: [HOM-O06-PAUSE, HOM-O06-NOPRESSURE]
  - name: { en: Where are you in your search?, es: ¿En qué punto de la búsqueda está? }
    idea:
      en: "Ask an easy question about her search, not about the house."
      es: "Haga una pregunta fácil sobre su búsqueda, no sobre la casa."
    items: [HOM-O06-START]
  - name: { en: Ask about home, es: Pregunte por su casa }
    idea:
      en: "Where she lives now usually explains why she is looking now."
      es: "Dónde vive ahora casi siempre explica por qué está mirando ahora."
    items: [HOM-O06-QFIRST, HOM-O06-HIDDEN]
  - name: { en: "A plan, not a push", es: "Un plan, no presión" }
    idea:
      en: "Turn her date into simple steps and a visit."
      es: "Convierta su fecha en pasos sencillos y en una visita."
    items: [HOM-O06-PLAN, HOM-O06-NEXT]
sources:
  - T001 Pause and slow down; T031 "You are free to say no"; T084 "Starting to look" greeting; T002 Clarify with a question; T014 Specific next step
  - Gino and Moore (2008) on deadlines; the but-you-are-free meta-analysis of 42 studies, via T031
spanish_reviewed: false
