code: L-fee-surprised
scenario: S-fee-surprised-L2
title:
  en: "\"Your online price didn't include these fees\": total first, then every line"
  es: "\"El precio en internet no incluía estos cargos\": primero el total, después cada línea"
hook:
  en: He came for the price he saw online. Your sheet says more. He feels tricked.
  es: Vino por el precio que vio en internet. Su hoja dice más. Se siente engañado.
tactic:
  en: When he says the online price left out fees, say sorry and blame no one. Ask what bothers him, then give the total first and explain every line.
  es: Cuando le diga que el precio en internet no incluía los cargos, discúlpese sin culpar a nadie. Pregunte qué le molesta, después déle primero el total y explíquele cada línea.
steps:
  - en: "Pause, then say: \"I'm sorry that number surprised you.\""
    es: "Haga una pausa y diga: \"Disculpe que ese número lo haya sorprendido.\""
  - en: "Ask: \"Is it the total that bothers you, or not knowing what each line is for?\""
    es: "Pregunte: \"¿Lo que le molesta es el total, o no saber para qué es cada línea?\""
  - en: Say the total price first, before any line.
    es: Diga primero el precio total, antes de cualquier línea.
  - en: Explain each line with its amount. Use your store's approved words for the fee.
    es: Explique cada línea con su cantidad. Use las palabras aprobadas por su tienda para el cargo.
  - en: Give him the sheet. Set a day and time to go over it together.
    es: Déle la hoja. Fije un día y una hora para repasarla juntos.
what:
  en: "Win back his trust: total first, then every line, with nothing made up."
  es: "Recupere su confianza: primero el total, después cada línea, sin inventar nada."
why:
  en: He feels tricked, and people who feel tricked leave. Often the total is fine. He fears another surprise when he signs. Lines before the total look like new charges. Total first, and each line is just an explanation.
  es: Se siente engañado, y el que se siente engañado se va. Muchas veces el total le sirve. Le da miedo otra sorpresa al firmar. Las líneas antes del total parecen cargos nuevos. Con el total primero, cada línea es solo una explicación.
when:
  en: He compares your sheet to a price he saw elsewhere.
  es: Él compara su hoja con un precio que vio en otro lado.
when_not:
  en: Don't defend the fee with a speech. Only your manager can lower the price.
  es: No defienda el cargo con un discurso. Solo su gerente puede bajar el precio.
say:
  - en: I'm sorry that number surprised you. You should see the full price first, every time.
    es: Disculpe que ese número lo haya sorprendido. Usted debe ver el precio completo primero, siempre.
  - en: Is it the total itself that bothers you, or not knowing what each line is for?
    es: ¿Lo que le molesta es el total en sí, o no saber para qué es cada línea?
  - en: Here's the all-in total first. Then I'll go through every line with you.
    es: Primero el precio total. Después repasamos juntos cada línea.
  - en: The dealer fee is ours, not the state's. Tax, tag and title are the only government charges.
    es: El cargo de concesionario es nuestro, no del estado. Los únicos cargos del gobierno son los impuestos, el tag y el título.
mistakes:
  - mistake:
      en: '"That''s just how dealer fees work."'
      es: '"Así es como funcionan los cargos de concesionario."'
    fix:
      en: Now he is sure he was tricked. Say sorry, and blame nobody.
      es: Ahora está seguro de que lo engañaron. Discúlpese sin culpar a nadie.
  - mistake:
      en: Explaining the fee before he hears the total.
      es: Explicar el cargo antes de que oiga el total.
    fix:
      en: Total first. Lines without a total feel like new charges.
      es: El total primero. Líneas sin total se sienten como cargos nuevos.
  - mistake:
      en: Making up what the fee covers, or calling it a state fee.
      es: Inventar qué cubre el cargo, o decir que es del estado.
    fix:
      en: Use your store's approved words, or ask your manager.
      es: Use las palabras aprobadas por su tienda, o pregúntele a su gerente.
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: He is upset. A fast answer sounds defensive.
      es: Está molesto. Una respuesta rápida suena a defensa.
    items: [O19-PAUSE]
  - name: { en: "Own it, blame nobody", es: "Hágase cargo, sin culpar a nadie" }
    idea:
      en: Say sorry. Don't blame the website or other dealers.
      es: Discúlpese. No culpe a la página ni a otros dealers.
    items: [O19-ACK]
  - name: { en: Total or lines?, es: ¿El total o las líneas? }
    idea:
      en: One question tells you if it's the money or trust. Here it's usually trust.
      es: Una pregunta le dice si es el dinero o la confianza. Aquí casi siempre es la confianza.
    items: [O19-QFIRST, O19-HIDDEN]
  - name: { en: All-in price first, es: El precio total primero }
    idea:
      en: The total price before any details.
      es: El precio total antes de cualquier detalle.
    items: [O19-TOTALFIRST]
  - name: { en: "Every line, nothing invented", es: "Cada línea, sin inventar nada" }
    idea:
      en: Each charge with its amount and its true reason.
      es: Cada cargo con su cantidad y su razón real.
    items: [O19-ITEMIZE]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: He takes the sheet home. Set a time to go over it together.
      es: Él se lleva la hoja. Fije una hora para repasarla juntos.
    items: [O19-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T002 Clarify with a question; T030 Out-the-door first; T118 All-in quote; T014 Firm next step
  - Rules PRICE-01 (any price is the all-in price) and PRICE-05 (total before itemizing)
spanish_reviewed: false
