code: L-underwater-owner
scenario: S-underwater-owner-L2
title:
  en: "\"I'm upside down on my loan\": make it math, not shame"
  es: "\"Estoy al revés con el préstamo\": que sean números, no vergüenza"
hook:
  en: She loves the car, then stops you before the numbers. She expects to be judged.
  es: Le encanta el carro. Entonces le pide que pare antes de los números. Espera que la juzguen.
tactic: { en: "Stay calm and don't judge. Ask what she owes, show the difference on its own line, and offer real ways to cover it.", es: "Mantenga la calma y no la juzgue. Pregunte cuánto debe todavía, enséñele la diferencia en su propia línea y déle opciones reales para cubrirla." }
steps:
  - { en: "Pause, then say: \"Thank you for telling me up front. No judgment here.\"", es: "Haga una pausa y diga: \"Gracias por decírmelo de entrada. Aquí nadie la va a juzgar.\"" }
  - { en: "Ask: \"Do you have a rough idea of what you still owe?\"", es: "Pregunte: \"¿Tiene una idea más o menos de cuánto debe todavía?\"" }
  - { en: "Give the trade number. Say it holds only if the payoff letter matches.", es: "Dígale el valor del trade-in, y que se mantiene solo si la carta del payoff coincide." }
  - { en: "Show the difference on its own line. Offer cash down, a cheaper car, or financing it.", es: "Enséñele la diferencia en su propia línea. Ofrezca una inicial en efectivo, un carro que cueste menos o financiarla en el préstamo nuevo." }
  - { en: "Set a day and time to meet with the payoff letter.", es: "Fije un día y una hora para reunirse con la carta del payoff." }
what:
  en: Treat the old loan as math, and stay calm.
  es: Trate el préstamo viejo como números, nada más. Hable con calma.
why:
  en: She hides the number because she's embarrassed. One judging word and she leaves. If you stay calm, she tells you the real amount. If you hide the difference in a payment, she finds it later, and you lose her.
  es: Esconde el número porque le da vergüenza. Una sola palabra que suene a juicio, y se va. Si usted está tranquilo, le dice cuánto es de verdad. Si esconde la diferencia en un pago, ella la encuentra después, y usted la pierde.
when:
  en: Any time a customer owes more than the car is worth, or fears they do.
  es: Cada vez que un cliente debe más de lo que vale el carro, o tiene miedo de deberlo.
when_not:
  en: Don't promise it works before you see the payoff letter.
  es: No prometa que va a funcionar antes de ver la carta del payoff.
say:
  - en: Thank you for telling me up front. No judgment here.
    es: Gracias por decírmelo de entrada. Aquí nadie la va a juzgar.
  - en: Do you have a rough idea of what you still owe on it?
    es: ¿Tiene una idea más o menos de cuánto debe todavía?
  - en: That trade number holds if your lender's payoff letter matches.
    es: Ese valor del trade-in se mantiene si la carta del payoff de su banco coincide.
  - en: I won't hide the difference inside a payment. You'll see it on its own line.
    es: No le voy a esconder la diferencia dentro de un pago. La va a ver en su propia línea.
  - en: Cash down, a cheaper car, or the new loan.
    es: Una inicial, un carro más barato o el préstamo nuevo.
mistakes:
  - mistake:
      en: '"How did you end up owing that much?"'
      es: '"¿Cómo llegó a deber tanto?"'
    fix:
      en: Ask how much she owes, never why.
      es: Pregunte cuánto debe, nunca por qué.
  - mistake:
      en: '"Don''t worry, we''ll roll it into the new loan."'
      es: '"No se preocupe, eso se mete en el préstamo nuevo."'
    fix:
      en: That hides it. Say the amount and show it.
      es: Eso es esconder la diferencia. Diga cuánto es y enséñela.
  - mistake:
      en: Calling the trade number final before the payoff is confirmed.
      es: Dar el valor del trade-in como final antes de confirmar el payoff.
    fix:
      en: Say it depends on the payoff letter.
      es: Diga que depende de la carta del payoff.
concepts:
  - name: { en: 'Calm, no judgment', es: 'Calma, sin juzgar' }
    idea:
      en: Pause, thank her, and keep your face and voice calm.
      es: Haga la pausa y déle las gracias por decírselo. Cara y voz tranquilas.
    items: [O02-PAUSE, O02-ACK]
  - name: { en: Ask the payoff, es: Pregunte el payoff }
    idea:
      en: Ask before any solution. She tells the real amount when she feels safe.
      es: Pregunte antes de ofrecer cualquier solución. Ella le dice cuánto es de verdad cuando se siente segura.
    items: [O02-QFIRST, O02-HIDDEN]
  - name: { en: Write the condition in, es: Ponga la condición por escrito }
    idea:
      en: The trade number holds only if the payoff letter matches.
      es: El valor del trade-in se mantiene solo si la carta del payoff coincide.
    items: [O02-CONDITION]
  - name: { en: The gap on its own line, es: La diferencia en su propia línea }
    idea:
      en: What she owes above the car's value, on its own line, never hidden in a payment.
      es: Lo que debe por encima del valor del carro, en su propia línea, nunca escondido en un pago.
    items: [O02-OPTIONS]
  - name: { en: Ways to cover it, es: Maneras de cubrirla }
    idea:
      en: Cash down, a cheaper car, or financing it in the new loan. She chooses.
      es: Una inicial en efectivo, un carro que cueste menos, o financiarla en el préstamo nuevo. Ella escoge.
    items: [O02-OPTIONS]
  - name: { en: Bring the letter, es: Traiga la carta }
    idea:
      en: A day and time, payoff letter in hand.
      es: Un día y una hora para reunirse, con la carta del payoff en la mano.
    items: [O02-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T002 Clarify with a question; T111 Write the condition in; T029 Trade-value walkthrough; T096 Trade on its own line; T014 Firm next step
  - Malhotra and Bazerman, Negotiation Genius (contingent terms), via T111
  - O02 core moves (honest options, including waiting)
spanish_reviewed: false
