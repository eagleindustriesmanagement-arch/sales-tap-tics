code: L-phone-shopper
scenario: S-phone-shopper-L2
title:
  en: "\"Just give me your best price\" on the phone: the whole number first"
  es: "\"Deme su mejor precio\" por teléfono: el número completo primero"
hook:
  en: He's driving between jobs, calling three dealers. If you don't give a price, he moves on.
  es: Va manejando entre un trabajo y otro, llamando a tres dealers. Si usted no le da el precio, lo tacha de la lista.
tactic: { en: "Give him the full out-the-door price right away, dealer fee included. Then ask if his other quotes include the fee, and offer two times to come in.", es: "Déle el precio total enseguida, con el cargo del dealer incluido. Después pregúntele si los otros precios incluyen ese cargo, y ofrézcale dos horarios para venir." }
steps:
  - { en: "Pause, then say: \"Sure, I'll give you the full number right now.\"", es: "Haga una pausa y diga: \"Claro, le doy el número completo ahora mismo.\"" }
  - { en: "Say the total first, dealer fee included. Only tax, tag and title are added.", es: "Diga primero el precio total, con el cargo del dealer incluido. Solo se suman impuestos, placa y título." }
  - { en: "Ask: \"The numbers you're getting from other dealers, do they include the dealer fee?\"", es: "Pregunte: \"Los precios que le dan en otros dealers, ¿incluyen el cargo del dealer?\"" }
  - { en: "Offer to email the same price and have the truck ready to drive.", es: "Ofrezca mandarle el mismo precio por email y tenerle la camioneta lista para manejar." }
  - { en: "Offer two set times, and book the one he picks.", es: "Ofrezca dos horarios fijos y agende el que él escoja." }
what:
  en: Give the same price on the phone that anyone pays in the store.
  es: Dé por teléfono el mismo precio que paga cualquiera en la tienda.
why:
  en: He isn't wasting your time. He's saving his own. His other prices may hide fees, so he can't compare them. "Come in and we'll work something out" sounds like you're hiding something too. One clear, full price makes you the dealer he trusts.
  es: No le está haciendo perder el tiempo. Está cuidando el suyo. Puede que sus otros precios escondan cargos, y así no los puede comparar. "Venga y le resolvemos" suena a que usted también esconde algo. Un precio total y claro lo convierte en el dealer en el que confía.
when:
  en: Any call or message that asks for a price.
  es: Cualquier llamada o mensaje que pide un precio.
when_not:
  en: Never say "plus fees." Never quote a price only some buyers get, or one that changes in the store. No texts without his okay.
  es: Nunca diga "más cargos". Nunca dé un precio que solo algunos consiguen, ni uno que cambia en la tienda. No le mande textos sin su permiso.
say:
  - en: Sure, I'll give you the full number right now.
    es: Claro, le doy el número completo ahora mismo.
  - en: That's out the door, our dealer fee already in it. Only tax, tag and title are added.
    es: Ese es el precio total, con nuestro cargo del dealer ya incluido. Solo se suman impuestos, placa y título.
  - en: The numbers you're getting from other dealers, do they include the dealer fee?
    es: Los precios que le dan en otros dealers, ¿incluyen el cargo del dealer?
  - en: I'll email you this exact price and have the truck up front, ready to drive. This afternoon or tomorrow morning?
    es: Le mando este mismo precio por email y le tengo la camioneta al frente, lista para manejar. ¿Esta tarde o mañana por la mañana?
mistakes:
  - mistake:
      en: '"Prices change every day; best thing is to come in."'
      es: '"Los precios cambian todos los días; lo mejor es que venga."'
    fix:
      en: That avoids the question, and he can tell. Give the number.
      es: Eso es esquivar la pregunta, y él se da cuenta. Déle el número.
  - mistake:
      en: The vehicle price, then "plus fees."
      es: El precio del carro, y después "más cargos".
    fix:
      en: Total first, with the fee in it. The phone price is the store price.
      es: Diga el total primero, con el cargo incluido. El precio por teléfono es el mismo de la tienda.
  - mistake:
      en: '"Come by whenever and ask for me."'
      es: '"Pase cuando pueda y pregunte por mí."'
    fix:
      en: Offer two set times and a reason to make the trip.
      es: Ofrezca dos horarios fijos y una razón para hacer el viaje.
concepts:
  - name: { en: Number first, es: El número primero }
    idea:
      en: Pause briefly, then give the full price. Don't avoid it.
      es: Haga una pausa corta y después dé el precio completo. No lo esquive.
    items: [O14-PAUSE, O14-NUMBER]
  - name: { en: All-in price first, es: El precio total primero }
    idea:
      en: The store price, fee included. The total before the parts.
      es: El precio de la tienda, con el cargo incluido. El total antes que las partes.
    items: [O14-ALLIN]
  - name: { en: "Are theirs all-in?", es: "¿Los de ellos son con todo?" }
    idea:
      en: One question shows why he really called.
      es: Una pregunta saca por qué llamó de verdad.
    items: [O14-CLARIFY, O14-HIDDEN]
  - name: { en: "Two times, one reason", es: "Dos horarios, una razón" }
    idea:
      en: The truck ready to drive, and two times to pick from.
      es: La camioneta lista para manejar, y dos horarios para escoger.
    items: [O14-TWOTIMES]
  - name: { en: Book it, es: Agéndelo }
    idea:
      en: A day and a time he says yes to.
      es: Un día y una hora a los que él dice que sí.
    items: [O14-NEXT]
sources:
  - T118 All-in quote by phone or text; T062 Give the number, then a reason to visit; T063 Two appointment times with a reason; T002 Clarify with a question; T001 Pause and slow down; T014 Firm next step
spanish_reviewed: false
