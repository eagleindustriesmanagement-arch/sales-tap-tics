code: L-advice-seeker
scenario: S-advice-seeker-L1
title:
  en: "\"What would you do?\": earn the answer, then own it"
  es: "\"¿Usted qué haría?\": gánese la respuesta y dígala claro"
hook:
  en: She drove both cars and can't decide. Now she asks you.
  es: Manejó los dos carros y no se decide. Ahora le pregunta a usted.
tactic:
  en: When she asks what you would do, promise a straight answer. Ask about her daily life first, then recommend one of her two cars with a reason.
  es: Cuando le pregunte qué haría usted, prométale una respuesta clara. Primero pregunte por su día a día y después recomiéndele uno de los dos carros, con una razón.
steps:
  - en: "Pause, then promise: \"I'll tell you exactly what I'd do.\""
    es: "Haga una pausa y prométale: \"Le voy a decir exactamente lo que yo haría.\""
  - en: "Ask: \"Who usually rides with you, and what has to fit in the back?\""
    es: "Pregunte: \"¿Quién la acompaña normalmente, y qué tiene que caber atrás?\""
  - en: Recommend one of her two cars, with a reason from her own words.
    es: Recomiéndele uno de los dos carros, con una razón sacada de lo que ella le dijo.
  - en: Don't add more cars to compare. Stay with her two.
    es: No le agregue más carros para comparar. Quédese con los dos de ella.
  - en: Don't promise that something fits. Set a day and time to test it together.
    es: No prometa que algo cabe. Fije un día y una hora para probarlo juntos.
what:
  en: Help her decide with one honest answer, built on what she needs.
  es: Ayúdela a decidir con una respuesta honesta, basada en lo que ella necesita.
why:
  en: She is tired of choosing and wants help. If you dodge, she is alone with it. If you answer before you ask, you sound like you're pushing a car. A reason in her own words is one she trusts.
  es: Está cansada de escoger y quiere ayuda. Si usted esquiva la pregunta, la deja sola. Si contesta antes de preguntar, parece que le está vendiendo un carro. Una razón con sus propias palabras le da confianza.
when:
  en: A customer can't choose between two cars and asks for your opinion.
  es: Un cliente no se decide entre dos carros y le pide su opinión.
when_not:
  en: Never push the car you would rather sell. If her needs point to the cheaper one, say so.
  es: Nunca la empuje hacia el carro que a usted le conviene vender. Si lo que ella necesita apunta al más barato, dígaselo.
say:
  - en: I'll tell you exactly what I'd do. I just want it to be about your life, not mine.
    es: Le voy a decir exactamente lo que yo haría. Solo quiero que sea sobre su vida, no la mía.
  - en: Who usually rides with you, and what has to fit in the back?
    es: ¿Quién la acompaña normalmente, y qué tiene que caber atrás?
  - en: That changes my answer. If I were you, I'd lean that way, and here's why.
    es: Eso cambia mi respuesta. Si yo fuera usted, me inclinaría por esa, y le digo por qué.
  - en: Don't take my word for it. Bring it in, and we'll try it in both.
    es: No lo crea solo porque yo lo digo. Tráigala y la probamos en las dos.
mistakes:
  - mistake:
      en: '"Easy, the Equinox. Everybody loves it."'
      es: '"Fácil, la Equinox. A todo el mundo le encanta."'
    fix:
      en: You gave no reason and asked nothing. Ask first, then answer.
      es: No dio ninguna razón y no preguntó nada. Pregunte primero y conteste después.
  - mistake:
      en: '"Only you can decide that."'
      es: '"Eso solo lo puede decidir usted."'
    fix:
      en: She asked for help and got none. Tell her what you would do.
      es: Ella le pidió ayuda y no la recibió. Dígale lo que usted haría.
  - mistake:
      en: '"Let me show you two more to compare."'
      es: '"Le enseño dos más para que compare."'
    fix:
      en: Choosing between two is already hard. Four is worse. Stay with her two.
      es: Escoger entre dos ya es difícil. Entre cuatro es peor. Quédese con los dos carros de ella.
concepts:
  - name:
      en: "Pause, promise, ask"
      es: "Pausa, promesa, pregunta"
    idea:
      en: Pause for a moment. Promise an answer. Then ask about her day.
      es: Haga una pausa. Prometa una respuesta. Después pregunte por su día.
    items: [O58-PAUSE, O58-QFIRST]
  - name:
      en: "Who rides, what fits"
      es: "Quién va, qué cabe"
    idea:
      en: It is usually a person who rides along, or something that must fit.
      es: Casi siempre es una persona que va con ella, o algo que tiene que caber.
    items: [O58-HIDDEN]
  - name:
      en: "Own one answer"
      es: "Una sola respuesta"
    idea:
      en: 'Say "If I were you," name one car, and give the reason in her own words.'
      es: 'Diga "Si yo fuera usted", nombre un carro y explique por qué con las palabras de ella.'
    items: [O58-RECOMMEND]
  - name:
      en: "Two, not four"
      es: "Dos, no cuatro"
    idea:
      en: Don't add more choices. More choices bring more doubt.
      es: No agregue más opciones. Más opciones traen más dudas.
    items: [O58-LIMIT]
  - name:
      en: "Prove it on a day and time"
      es: "Compruébelo con día y hora"
    idea:
      en: Never promise it fits. Test it on a set day and time.
      es: Nunca prometa que cabe. Pruébelo en un día y una hora fijos.
    items: [O58-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T092 Personal recommendation; T093 Limit the exploration; T014 Firm next step
  - The JOLT Effect (Dixon and McKenna, 2022) on recommending to indecisive buyers; choice overload meta-analysis (Chernev and others, 2015), via T093
spanish_reviewed: false
