code: L-advice-seeker
scenario: S-advice-seeker-L1
title:
  en: "\"What would you do?\": earn the answer, then own it"
  es: "\"¿Usted qué haría?\": gánese la respuesta y dígala claro"
hook:
  en: She's driven both, she's worn out, and she turns to you. That's a gift. Don't waste it.
  es: Ya manejó las dos, está cansada de darle vueltas, y se voltea hacia usted. Eso es un regalo. No lo bote.
what:
  en: Promise a straight answer, then earn it with questions about her real week. Give one recommendation with a reason from her own words, stay with the two she's weighing, and offer a way to prove it.
  es: Prométale una respuesta clara y gánesela con preguntas sobre su semana de verdad. Déle una sola recomendación con una razón sacada de lo que ella dijo, quédese con las dos que está comparando y ofrezca cómo comprobarlo.
why:
  en: The choice has worn her out. "What would you do?" means "take a stand with me so it's not all on me." Dodge it and she's alone with it. Answer before you ask and it sounds like the car you want to sell. Built from her words, your answer is her own reason, said out loud.
  es: La decisión ya la tiene agotada. "¿Usted qué haría?" quiere decir "póngase de mi lado para que no sea todo mío". Si lo esquiva, la deja sola. Si contesta antes de preguntar, suena al carro que usted quiere vender. Si sale de sus palabras, su respuesta es la razón de ella, dicha en voz alta.
when:
  en: A torn buyer asks for your opinion between two cars.
  es: Un cliente indeciso le pide su opinión entre dos carros.
when_not:
  en: Never steer her to the car you'd rather sell. If her life points to the cheaper one, say so.
  es: Nunca la lleve al carro que a usted le conviene. Si su vida apunta a la más barata, dígaselo.
say:
  - en: I'll tell you exactly what I'd do. I just want it to be about your life, not mine.
    es: Le voy a decir exactamente lo que yo haría. Solo quiero que sea sobre su vida, no la mía.
  - en: Who usually rides with you, and what has to fit in the back?
    es: ¿Quién la acompaña normalmente, y qué tiene que caber atrás?
  - en: That changes my answer. If I were you, I'd lean that way, and here's why.
    es: Eso cambia mi respuesta. Si yo fuera usted, me inclinaría por esa, y le digo por qué.
  - en: Don't take my word for it. Bring it in, and we'll try it in both.
    es: No lo crea solo porque yo lo digo. Tráigala y la probamos en las dos.
mistakes:
  - mistake:
      en: '"Easy, the Equinox. Everybody loves it."'
      es: '"Fácil, la Equinox. A todo el mundo le encanta."'
    fix:
      en: No question, no reason. Ask first, then answer.
      es: Sin pregunta y sin razón. Pregunte primero, conteste después.
  - mistake:
      en: '"Only you can decide that."'
      es: '"Eso solo lo puede decidir usted."'
    fix:
      en: She asked for help and got a shrug. Take a stand.
      es: Le pidió ayuda y usted se encogió de hombros. Dígale lo que haría.
  - mistake:
      en: '"Let me show you two more to compare."'
      es: '"Le enseño dos más para que compare."'
    fix:
      en: Two is hard. Four is worse. Stay with her two.
      es: Entre dos ya es difícil. Entre cuatro, peor. Quédese con las dos.
concepts:
  - name:
      en: "Pause, promise, ask"
      es: "Pausa, promesa, pregunta"
    idea:
      en: A beat of quiet, promise an answer, then ask about her day.
      es: Un momento de silencio, prometa una respuesta y pregunte por su día.
    items: [O58-PAUSE, O58-QFIRST]
  - name:
      en: "Who rides, what fits"
      es: "Quién va, qué cabe"
    idea:
      en: The tie-breaker is usually a person or a thing that has to fit.
      es: Lo que desempata casi siempre es una persona o algo que tiene que caber.
    items: [O58-HIDDEN]
  - name:
      en: "Own one answer"
      es: "Una sola respuesta"
    idea:
      en: '"If I were you," one car, and a reason in her own words.'
      es: '"Si yo fuera usted", un carro, y una razón con las palabras de ella.'
    items: [O58-RECOMMEND]
  - name:
      en: "Two, not four"
      es: "Dos, no cuatro"
    idea:
      en: Limit the exploration. More options, more doubt.
      es: Limite la búsqueda. Más opciones, más dudas.
    items: [O58-LIMIT]
  - name:
      en: "Prove it on a day and time"
      es: "Compruébelo con día y hora"
    idea:
      en: Never promise it fits. Test it, on a set day and time.
      es: Nunca prometa que cabe. Pruébelo, con día y hora fijos.
    items: [O58-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T092 Personal recommendation; T093 Limit the exploration; T014 Firm next step
  - The JOLT Effect (Dixon and McKenna, 2022) on recommending to indecisive buyers; choice overload meta-analysis (Chernev and others, 2015), via T093
spanish_reviewed: false
