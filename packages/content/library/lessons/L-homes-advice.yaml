code: L-homes-advice
scenario: S-homes-advice-L1
title:
  en: "\"What would you do?\": earn the answer, then own it"
  es: "\"¿Usted qué haría?\": gánese la respuesta y dígala claro"
hook:
  en: "She has seen both homes twice. Now she asks what you would do. Don't default to the bigger home. Find what decides it."
  es: "Ya vio las dos casas dos veces. Ahora le pregunta qué haría usted. No se vaya por la más grande. Busque lo que decide."
tactic:
  en: "Promise a straight answer, but first ask who will live in the house. Then recommend one of her two homes and say why."
  es: "Prométale una respuesta clara, pero primero pregunte quién va a vivir en la casa. Después recomiende una de sus dos casas y diga por qué."
steps:
  - en: "Pause, then promise: \"I'll tell you exactly what I'd do.\""
    es: "Haga una pausa y prométale: \"Le voy a decir exactamente lo que yo haría.\""
  - en: "Ask: \"Who's going to live in the house with you?\""
    es: "Pregunte: \"¿Quién va a vivir con usted en la casa?\""
  - en: "Keep asking about her daily life until you find what decides it."
    es: "Siga preguntando por su vida diaria hasta encontrar lo que hace la diferencia."
  - en: "Recommend one of her two homes, with a reason in her own words."
    es: "Recomiende una de sus dos casas, con una razón sacada de lo que ella dijo."
  - en: "Set a day and time to walk both homes with that person."
    es: "Fije un día y una hora para recorrer las dos casas con esa persona."
what:
  en: "Earn the answer with questions. Then give one clear answer. Stay with her two homes."
  es: "Gánese la respuesta con preguntas. Después dé una sola respuesta clara. Quédese con sus dos casas."
why:
  en: "A house is a big decision, and she is tired of making it alone. If you avoid the question, she feels alone again. If you answer before you ask, it sounds like selling. Here, a family member moving in decides it."
  es: "Una casa es una decisión grande, y ella está cansada de tomarla sola. Si esquiva la pregunta, se vuelve a sentir sola. Si contesta antes de preguntar, suena a venta. Aquí lo que decide es un familiar que se viene a vivir con ella."
when:
  en: "A buyer who can't choose between two homes asks for your opinion."
  es: "Una clienta que no puede decidir entre dos casas le pide su opinión."
when_not:
  en: "Don't give your pick before you ask. Without her reasons, it sounds like a push."
  es: "No dé su recomendación antes de preguntar. Sin las razones de ella, suena a que la está empujando."
say:
  - en: I'll tell you exactly what I'd do. I just want it to be about your life, not mine.
    es: Le voy a decir exactamente lo que yo haría. Solo quiero que sea sobre su vida, no la mía.
  - en: Who's going to live in the house with you?
    es: ¿Quién va a vivir con usted en la casa?
  - en: That changes my answer. If I were you, I'd lean that way, and here's why.
    es: Eso cambia mi respuesta. Si yo fuera usted, me inclinaría por esa, y le digo por qué.
  - en: Don't take my word for it. Bring him, and we'll walk both homes together.
    es: No lo crea solo porque yo lo digo. Tráigalo y recorremos las dos casas juntos.
mistakes:
  - mistake:
      en: "\"Easy, the Ceiba. Everybody wants the bigger one.\""
      es: "\"Fácil, la Ceiba. Todo el mundo quiere la más grande.\""
    fix:
      en: "No question, no reason. Ask first, then answer."
      es: "Sin pregunta y sin razón. Pregunte primero y conteste después."
  - mistake:
      en: "\"Only you can decide that.\""
      es: "\"Eso solo lo puede decidir usted.\""
    fix:
      en: "She asked for help. Tell her what you would do."
      es: "Le pidió ayuda. Dígale lo que usted haría."
  - mistake:
      en: "\"Let me show you two more lots to compare.\""
      es: "\"Le enseño dos lotes más para que compare.\""
    fix:
      en: "Two is already hard. Four is worse. Stay with her two."
      es: "Dos ya es difícil. Cuatro es peor. Quédese con las dos de ella."
concepts:
  - name: { en: "Pause, promise, ask", es: "Pausa, promesa, pregunta" }
    idea:
      en: "Wait two seconds, promise an answer, then ask who will live there."
      es: "Espere dos segundos, prometa una respuesta y pregunte quién va a vivir ahí."
    items: [HOM-O58-PAUSE, HOM-O58-QFIRST]
  - name: { en: "Who lives there", es: "Quién vive ahí" }
    idea:
      en: "What decides it is usually a person, like a parent with a walker."
      es: "Lo que decide casi siempre es una persona, como un papá con andador."
    items: [HOM-O58-HIDDEN]
  - name: { en: "Own one answer", es: "Una sola respuesta" }
    idea:
      en: "Say \"If I were you,\" name one home, and give a reason."
      es: "Diga \"Si yo fuera usted\", nombre una casa y dé una razón."
    items: [HOM-O58-RECOMMEND]
  - name: { en: "Two, not four", es: "Dos, no cuatro" }
    idea:
      en: "Don't add homes. More homes, more doubt."
      es: "No agregue casas. Más casas, más dudas."
    items: [HOM-O58-LIMIT]
  - name: { en: "Prove it on a day and time", es: "Compruébelo con día y hora" }
    idea:
      en: "Don't promise it works for him. Walk it with him on a set day."
      es: "No prometa que le sirve a él. Recórranla con él un día fijo."
    items: [HOM-O58-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T092 Personal recommendation; T093 Limit the exploration; T014 Firm next step
  - The JOLT Effect (Dixon and McKenna, 2022) on recommending to indecisive buyers; choice overload meta-analysis (Chernev and others, 2015), via T093
spanish_reviewed: false
