code: L-burned-buyer
scenario: S-burned-buyer-L3
title:
  en: "\"I don't trust dealers\": don't ask for trust, put it on paper"
  es: "\"No confío en los dealers\": no pida confianza, póngala en papel"
hook:
  en: Arms crossed before you sit down. Another dealer treated her badly.
  es: Brazos cruzados antes de que usted se siente. Otro dealer la trató mal.
tactic:
  en: When she says she doesn't trust dealers, don't ask for trust. Say her fears first, ask what happened, and put the whole deal on one sheet.
  es: Cuando diga que no confía en los dealers, no le pida confianza. Diga primero lo que ella teme, pregunte qué pasó y ponga todo el negocio en una hoja.
steps:
  - en: "Pause. Then say: \"You're probably expecting games with the numbers.\""
    es: "Haga una pausa y diga: \"Seguramente piensa que le voy a jugar con los números.\""
  - en: "Ask: \"What happened the last time you bought a car?\" Then listen."
    es: "Pregunte: \"¿Qué le pasó la última vez que compró carro?\" Y escuche."
  - en: "Give her one sheet: total price with the fee in, nothing she didn't ask for."
    es: "Déle una hoja: precio total con el cargo incluido, nada que ella no haya pedido."
  - en: Say any extra product is optional, and no is a fine answer.
    es: Dígale que cualquier producto extra es opcional y que puede decir que no.
  - en: Set a day and time to check the contract against the sheet, line by line.
    es: Fije un día y una hora para revisar el contrato contra la hoja, línea por línea.
what:
  en: Earn her trust with paper she can check, not with promises.
  es: Gánese su confianza con un papel que ella pueda revisar, no con promesas.
why:
  en: She is angry at the last dealer, not at you. Every "trust me" sounds like him. Say her fears out loud and she calms down. Her story tells you what your sheet must prove.
  es: Está molesta con el último dealer, no con usted. Cada "confíe en mí" le suena a él. Diga en voz alta lo que ella teme y se calma. Su historia le dice qué tiene que probar su hoja.
when:
  en: A customer says she doesn't trust you, before any numbers.
  es: Un cliente dice que no confía en usted, antes de los números.
when_not:
  en: Never promise what you don't control. The finance office may offer products. You can promise she'll see them as optional.
  es: Nunca prometa lo que no controla. En financiamiento le pueden ofrecer productos. Puede prometer que los va a ver como opcionales.
say:
  - en: That's fair. You're probably expecting me to play games with the numbers and keep you here four hours.
    es: Me parece justo. Seguramente usted piensa que le voy a jugar con los números y tenerla aquí cuatro horas.
  - en: What happened the last time you bought a car?
    es: ¿Qué le pasó la última vez que compró carro?
  - en: Nothing gets added that you don't ask for. Anything optional, you'll see the payment with it and without it, and no is a fine answer.
    es: No se le agrega nada que usted no pida. Si algo es opcional, le enseñan el pago con eso y sin eso, y decir que no está bien.
  - en: Take this sheet home. Before you sign, we check the contract against it, line by line.
    es: Llévese esta hoja. Antes de firmar, revisamos el contrato contra ella, línea por línea.
mistakes:
  - mistake:
      en: '"Trust me, we''re not like other dealers."'
      es: '"Confíe en mí, no somos como los otros dealers."'
    fix:
      en: The last dealer said that too. Show her paper instead.
      es: Eso mismo le dijo el último dealer. Mejor enséñele el papel.
  - mistake:
      en: Defending the store before you know what happened.
      es: Defender la tienda antes de saber qué pasó.
    fix:
      en: Ask first. You can't fix what you haven't heard.
      es: Pregunte primero. No puede arreglar lo que no ha oído.
  - mistake:
      en: '"Let''s just get the paperwork started."'
      es: '"Vamos a empezar los papeles ya."'
    fix:
      en: Signing late and tired is how it went wrong last time. Give her the sheet and a calm day.
      es: Así le salió mal la última vez, cansada y tarde. Déle la hoja y un día tranquilo para firmar.
concepts:
  - name:
      en: "Pause, don't defend"
      es: "Pausa, no se defienda"
    idea:
      en: A fast answer sounds like a sales speech.
      es: Una respuesta rápida suena a discurso de vendedor.
    items: [O18-L3-PAUSE]
  - name:
      en: "Say her doubts first"
      es: "Diga las dudas de ella primero"
    idea:
      en: Say what she expects before she does. Never say "trust me."
      es: Diga lo que ella espera antes que ella. Nunca diga "confíe en mí".
    items: [O18-L3-DOUBTS]
  - name:
      en: "Ask what happened"
      es: "Pregunte qué pasó"
    idea:
      en: Her last signing is the real problem. Get the details.
      es: Su última firma es el problema real. Pida los detalles.
    items: [O18-L3-ASK, O18-L3-HIDDEN]
  - name:
      en: "One sheet, all in"
      es: "Una hoja, todo incluido"
    idea:
      en: Total first, fee inside. Nothing she didn't ask for. Extras marked optional.
      es: El total primero, con el cargo adentro. Nada que no pidió. Lo extra, marcado como opcional.
    items: [O18-L3-SHEET]
  - name:
      en: "Sign against the sheet"
      es: "Firme contra la hoja"
    idea:
      en: Set a day and time to check the contract line by line. That is the proof.
      es: Fije un día y una hora para revisar el contrato línea por línea. Esa es la prueba.
    items: [O18-L3-NEXT]
sources:
  - T001 Pause and slow down; T100 Say their doubts first; T002 Clarify with a question; T085 Declared transparency; T009 Transparent numbers; T121 Two-payment menu; T014 Firm next step
  - Rules PRICE-01, PRICE-05, ADD-01, ADD-03 (all-in price first, optional is optional, nothing charged is free)
  - Accusation audit (Chris Voss, Never Split the Difference, 2016)
spanish_reviewed: false
