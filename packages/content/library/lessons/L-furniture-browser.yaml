code: L-furniture-browser
scenario: S-furniture-browser-L1
title:
  en: "\"I'm just looking\": take the pressure off, then ask about the room"
  es: "\"Solo estoy mirando\": quite la presión, y pregunte por el espacio"
hook:
  en: "A young man is alone in the living room section. You say hello, and he says \"I'm just looking.\""
  es: "Un muchacho está solo en la sección de salas. Usted lo saluda y él dice: \"Solo estoy mirando\"."
tactic:
  en: "Tell him he's free to look on his own. Then ask about the room he is furnishing, and help him make a calm plan."
  es: "Dígale que puede mirar por su cuenta. Después pregunte por el espacio que va a amueblar y ayúdelo a hacer un plan con calma."
steps:
  - en: "Pause, then say: \"Take your time. You're free to look on your own.\""
    es: "Haga una pausa y diga: \"Tómese su tiempo. Puede mirar por su cuenta.\""
  - en: "Ask if he is just starting to look."
    es: "Pregunte si apenas está empezando a mirar."
  - en: "Ask what room he is shopping for, and what's in it now."
    es: "Pregunte para qué cuarto está buscando y qué tiene ahí ahora."
  - en: "If he is moving, suggest he bring the floor plan."
    es: "Si se está mudando, sugiérale que traiga el plano."
  - en: "Set a day and time for him to come back with it."
    es: "Fije un día y una hora para que vuelva con el plano."
what:
  en: "Ask about the room, not the sofa in front of him. His reason for coming in will come out."
  es: "Pregunte por el espacio, no por el sofá que tiene delante. Así sale la razón por la que vino."
why:
  en: "Most shoppers expect a salesperson to follow them around. \"Just looking\" keeps you away. When he feels free to leave, he is more likely to stay and tell you what's changing at home."
  es: "Casi todos esperan que un vendedor los siga por toda la tienda. \"Solo estoy mirando\" lo mantiene lejos. Cuando se siente libre de irse, es más fácil que se quede y le cuente qué está cambiando en su casa."
when:
  en: "When you greet a customer, or when one walks away from a piece."
  es: "En el saludo, o cuando un cliente se aleja de una pieza."
when_not:
  en: "Don't say he is free and then follow him. Check back only once."
  es: "No le diga que está libre para después seguirlo. Vuelva una sola vez."
say:
  - en: That's perfect. Take your time, and you're free to walk around on your own.
    es: Perfecto. Tómese su tiempo, y está en libertad de mirar por su cuenta.
  - en: Are you just starting to look, or have you narrowed it down a bit?
    es: ¿Apenas está empezando a mirar, o ya tiene algo más o menos pensado?
  - en: So I can point you to the right pieces, what room are you shopping for?
    es: Para orientarlo bien, ¿para qué cuarto está buscando?
  - en: Bring the floor plan and we'll lay out the room on paper. No decisions until it all fits.
    es: Traiga el plano y armamos el espacio en papel. Nada de decidir hasta que todo quepa.
mistakes:
  - mistake:
      en: "\"Everybody's just looking!\""
      es: "\"¡Todo el mundo está solo mirando!\""
    fix:
      en: "That tells him he's lying. Agree instead."
      es: "Eso le dice que miente. Mejor déle la razón."
  - mistake:
      en: "Talking about fabric before you know the room."
      es: "Hablarle de la tela antes de saber cómo es el espacio."
    fix:
      en: "Ask about the room first."
      es: "Pregunte primero por el espacio."
  - mistake:
      en: "\"You close in five weeks? Order today.\""
      es: "\"¿Cierra en cinco semanas? Ordene hoy.\""
    fix:
      en: "That turns his news into pressure. Make it a plan."
      es: "Eso convierte su noticia en presión. Conviértala en un plan."
concepts:
  - name:
      en: "Pause, then free him"
      es: "Pausa, y déjelo libre"
    idea:
      en: "Wait two seconds. Tell him he can look on his own."
      es: "Espere dos segundos. Dígale que puede mirar por su cuenta."
    items: [FUR-O06-PAUSE, FUR-O06-NOPRESSURE]
  - name: { en: '"Just starting?"', es: '"¿Apenas empezando?"' }
    idea:
      en: "Ask where he is in his search, not which sofa he likes."
      es: "Pregunte en qué punto de la búsqueda está, no qué sofá le gusta."
    items: [FUR-O06-START]
  - name:
      en: "The room, not the sofa"
      es: "El espacio, no el sofá"
    idea:
      en: "Ask about the room. The real reason he came in will come out."
      es: "Pregunte por el espacio. Así sale la razón real por la que vino."
    items: [FUR-O06-QFIRST, FUR-O06-HIDDEN]
  - name:
      en: "A plan, not a push"
      es: "Un plan, no presión"
    idea:
      en: "A move date is a reason to plan, never to rush him."
      es: "Una mudanza es una razón para planificar, nunca para apurarlo."
    items: [FUR-O06-PLAN]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "He comes back with the floor plan on a set day and time."
      es: "Que vuelva con el plano un día y a una hora fijos."
    items: [FUR-O06-NEXT]
sources:
  - T001 Pause and slow down; T031 You are free to say no; T084 Starting-to-look greeting; T002 Clarify with a question; T014 Specific next step
spanish_reviewed: false
