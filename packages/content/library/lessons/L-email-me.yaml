code: L-email-me
scenario: S-email-me-L2
title:
  en: "\"Just email me the out-the-door\": say it now, send the same number"
  es: "\"Mándeme el precio final por email\": dígalo ahora, mande el mismo número"
hook:
  en: She is on her break and wants the price in writing. "Come in and we'll talk" loses her.
  es: Está en su descanso y quiere el precio por escrito. Con "venga y hablamos", la pierde.
tactic:
  en: When she asks you to email the price, say the full total on the call. Then email her the same number.
  es: Cuando le pida el precio por email, dígale el precio total ahí mismo en la llamada. Después mándele el mismo número por email.
steps:
  - en: "Pause, then say: \"I'll send it, and I'll give it to you right now.\""
    es: "Haga una pausa y diga: \"Con gusto se lo mando, y también se lo digo ahora mismo.\""
  - en: Say the total first, dealer fee included. Only tax, tag and title are added.
    es: Diga primero el total, con el cargo de concesionario incluido. Solo se suman impuestos, tag y título.
  - en: "Ask: \"Has a dealer ever changed the price on you when you got there?\""
    es: "Pregunte: \"¿Algún dealer le ha cambiado el precio cuando usted llegó?\""
  - en: Email the same number, with the car and fee listed. No texts.
    es: Mándele el mismo número por email, con el carro y el cargo detallados. Nada de textos.
  - en: Offer two times. Then repeat the car and the price.
    es: Ofrézcale dos horarios. Después repita el carro y el precio.
what:
  en: Give her the same price twice, out loud now and in writing after.
  es: Déle el mismo precio dos veces, en voz alta ahora y por escrito después.
why:
  en: A dealer once quoted her one price by phone and a higher one in person. Dodge the price and you look like him. Say it now, send the same number, and coming in feels safe.
  es: Una vez un dealer le dio un precio por teléfono y otro más alto en persona. Si esquiva el precio, se parece a él. Dígalo ahora, mande el mismo número, y venir ya no es un riesgo.
when:
  en: Any call or lead that asks for a price.
  es: Cualquier llamada o lead que pide un precio.
when_not:
  en: Don't text it. She hasn't agreed to texts.
  es: No se lo mande por texto. Ella no ha dado permiso para textos.
say:
  - en: I'll send it, and I'll give it to you right now so you hear it from me first.
    es: Con gusto se lo mando, y también se lo digo ahora mismo para que lo oiga de mí primero.
  - en: That's the all-in price. It already includes our dealer fee; only tax, tag and title are added.
    es: Ese es el precio total. Ya incluye nuestro cargo de concesionario; solo se suman los impuestos, el tag y el título.
  - en: Can I ask, has a dealer ever changed the price on you when you got there?
    es: ¿Le puedo preguntar algo? ¿Algún dealer le ha cambiado el precio cuando usted llegó?
  - en: So we're set. The Blazer will be up front, at the same price that's in your email.
    es: Entonces quedamos así. La Blazer la tengo al frente, con el mismo precio que tiene en su email.
mistakes:
  - mistake:
      en: '"We don''t email prices. You''ll have to come in."'
      es: '"No mandamos precios por email. Tiene que venir."'
    fix:
      en: That is the dealer from her bad experience.
      es: Ese es el dealer de su mala experiencia.
  - mistake:
      en: Leaving out the dealer fee to get her to come in.
      es: Darle el precio sin el cargo de concesionario para que venga.
    fix:
      en: A phone price must be the full price she pays in person.
      es: El precio por teléfono tiene que ser el precio completo que paga en persona.
  - mistake:
      en: '"That price is only good if you come in today."'
      es: '"Ese precio vale solo si viene hoy."'
    fix:
      en: That deadline is made up. The written price is good either way.
      es: Esa fecha es inventada. El precio por escrito vale igual.
concepts:
  - name: { en: "Pause, don't rush off", es: "Pausa, sin apurarse a colgar" }
    idea:
      en: Short call, calm answer.
      es: Llamada corta, respuesta con calma.
    items: [O41-PAUSE]
  - name: { en: Say it now, es: Dígalo ahora }
    idea:
      en: Say the price on the call, not only in the email.
      es: Diga el precio en la llamada, no solo en el email.
    items: [O41-NOW]
  - name: { en: All-in price first, es: El precio total primero }
    idea:
      en: The full price she would pay in person. Total first.
      es: El precio completo que pagaría en persona. Primero el total.
    items: [O41-ALLIN]
  - name: { en: "Same number, in writing", es: "El mismo número, por escrito" }
    idea:
      en: Email it with the car and fee listed. No texts without her OK.
      es: Mándelo por email con el carro y el cargo detallados. Nada de textos sin su permiso.
    items: [O41-WRITING]
  - name: { en: Has it happened before?, es: ¿Ya le pasó antes? }
    idea:
      en: A dealer who changed the price is why she wants it in writing.
      es: Un dealer que le cambió el precio es la razón por la que lo quiere por escrito.
    items: [O41-HIDDEN]
  - name: { en: "Two times, then confirm", es: "Dos horarios, y confirme" }
    idea:
      en: Offer a day and time. Then repeat the car and price.
      es: Ofrezca día y hora. Después repita el carro y el precio.
    items: [O41-NEXT, O41-CONFIRM]
sources:
  - T001 Pause and slow down; T118 All-in quote by phone or text; T062 Give the number, then a reason to visit; T014 Firm next step; T076 Two-touch confirmation
  - Rules PRICE-02 (a phone price is the full walk-in price), PRICE-05, CONSENT-01
spanish_reviewed: false
