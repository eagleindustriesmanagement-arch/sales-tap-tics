code: L-solar-payment
scenario: S-solar-payment-L1
title:
  en: "\"The payment is too high\": ask his number, then what's in it"
  es: "\"El pago está muy alto\": pregunte su número, y después qué hay adentro"
hook:
  en: "He wanted solar to lower his bills. Before you change any number, find out what he thinks he is paying for."
  es: "Él quería solar para bajar la cuenta de la luz. Antes de cambiar un número, averigüe qué cree que está pagando."
tactic:
  en: "Ask what payment he expected. Then say what is in it and what is optional. Show real estimates with and without the optional parts."
  es: "Pregunte qué pago esperaba. Después diga qué incluye y qué es opcional. Enseñe estimados reales con las partes opcionales y sin ellas."
steps:
  - en: "Pause, then ask: \"What payment were you expecting?\""
    es: "Haga una pausa y pregunte: \"¿Qué pago tenía en mente?\""
  - en: "Ask if the system itself is right for his house."
    es: "Pregunte si el sistema en sí es el correcto para su casa."
  - en: "Name what is in the payment: the home battery and the monitoring upgrade."
    es: "Diga qué incluye el pago: la batería y el monitoreo."
  - en: "Say plainly that both are optional."
    es: "Diga claramente que los dos son opcionales."
  - en: "Show real estimates with and without them, same term, subject to approval. Set a day and time."
    es: "Enseñe estimados reales con ellos y sin ellos, al mismo plazo, sujetos a aprobación. Fije un día y una hora."
what:
  en: "Find out what is in the payment. Name each optional part. Show real estimates both ways."
  es: "Averigüe qué hay en el pago. Nombre cada parte opcional. Enseñe estimados reales de las dos maneras."
why:
  en: "Other salespeople told some solar buyers that a battery is required. A buyer who believes that won't ask to remove it. He'll just say the payment is too high and leave."
  es: "Otros vendedores les dijeron a algunos clientes de solar que la batería es obligatoria. El que lo cree no va a pedir que se la quiten. Solo va a decir que el pago está muy alto, y se va a ir."
when:
  en: "A financed quote includes an optional add-on, and he says the payment is too high."
  es: "Una cotización financiada incluye un adicional opcional, y él dice que el pago está muy alto."
when_not:
  en: "Never quote a payment that isn't on the sheet, or one that depends on a tax credit."
  es: "Nunca dé un pago que no esté en la hoja, ni uno que dependa de un crédito de impuestos."
say:
  - en: Help me understand. When you say too high, what payment were you expecting?
    es: Ayúdeme a entender. Cuando dice que está muy alto, ¿qué pago tenía en mente?
  - en: Other than the payment, is the system itself right for your house?
    es: Aparte del pago, ¿el sistema en sí es el correcto para su casa?
  - en: That payment includes the home battery and the monitoring upgrade, and both are optional.
    es: Ese pago incluye la batería y el monitoreo, y los dos son opcionales.
  - en: I'll put both estimates in writing, with and without the battery, same term, subject to approval.
    es: Le pongo los dos estimados por escrito, con la batería y sin ella, al mismo plazo, sujetos a la aprobación.
mistakes:
  - mistake:
      en: "\"That's a great payment for everything you're getting.\""
      es: "\"Ese es un excelente pago por todo lo que lleva.\""
    fix:
      en: "You argued with his budget. Ask for his number."
      es: "Le discutió su presupuesto. Pregúntele su número."
  - mistake:
      en: "Stretching the loan before you know what's in the payment."
      es: "Alargar el plazo antes de saber qué hay en el pago."
    fix:
      en: "First find what's in it he doesn't want. That may be enough."
      es: "Primero averigüe qué hay ahí que no quiere. Puede que baste."
  - mistake:
      en: "Quoting a payment with the battery and never naming it."
      es: "Dar un pago con la batería y nunca nombrarla."
    fix:
      en: "Name every add-on in the payment and say it's optional."
      es: "Nombre cada adicional del pago y diga que es opcional."
concepts:
  - name: { en: The pause, es: La pausa }
    idea:
      en: "Wait two seconds before you start on the numbers."
      es: "Espere dos segundos antes de empezar con los números."
    items: [SOL-O03-PAUSE]
  - name: { en: His number first, es: Primero su número }
    idea:
      en: "His number tells you what to look for."
      es: "Su número le dice qué buscar."
    items: [SOL-O03-QFIRST]
  - name: { en: Right system, es: El sistema correcto }
    idea:
      en: "Confirm the panels are right for him, apart from the payment."
      es: "Confirme que los paneles son los correctos, aparte del pago."
    items: [SOL-O03-ISOLATE]
  - name: { en: What's in the payment, es: Qué hay en el pago }
    idea:
      en: "Ask what he wants in it. Then say plainly what is optional."
      es: "Pregunte qué quiere ahí. Después diga claramente qué es opcional."
    items: [SOL-O03-HIDDEN, SOL-O03-OPTIONAL]
  - name: { en: "Two real estimates, then a time", es: "Dos estimados reales, y después la hora" }
    idea:
      en: "Show both on the same term. Then set a day to go over them."
      es: "Enseñe los dos al mismo plazo. Después fije un día para revisarlos."
    items: [SOL-O03-OPTIONS, SOL-O03-NEXT]
sources:
  - T001 Pause; T002 Clarify with a question; T005 Isolate; T110 Treat a hard demand as a clue; T121 Two-payment menu; T014 Firm next step
spanish_reviewed: false
