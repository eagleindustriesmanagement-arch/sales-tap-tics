code: L-homes-thinker
scenario: S-homes-thinker-L1
title:
  en: "\"I need to think about it\": find the one open question"
  es: "\"Lo tengo que pensar\": encuentre la única duda que queda"
hook:
  en: "He read every review and checked the numbers. He still needs to think. One question is left. Find it."
  es: "Leyó todas las reseñas y sacó las cuentas. Todavía lo tiene que pensar. Le queda una duda. Encuéntrela."
tactic:
  en: "Agree, then ask what he still wants to be sure about. Let him test it himself instead of making a promise."
  es: "Déle la razón y pregunte qué es lo que todavía quiere tener claro. Deje que él mismo lo pruebe, en vez de prometerle algo."
steps:
  - en: "Pause, then agree: \"That makes sense.\""
    es: "Haga una pausa y déle la razón: \"Tiene sentido.\""
  - en: "Ask: \"What's the part you still want to be sure about?\""
    es: "Pregunte: \"¿Qué es lo que quiere tener claro antes de decidir?\""
  - en: "Ask if the house and the price work for him, apart from that."
    es: "Pregunte si la casa y el precio le convencen, aparte de eso."
  - en: "Ask where he works and what time he must be there."
    es: "Pregunte dónde trabaja y a qué hora tiene que llegar."
  - en: "Don't guess the drive time. Set a day and time for him to drive it."
    es: "No adivine cuánto se demora el viaje. Fije un día y una hora para que lo haga."
what:
  en: "Find the one doubt. Settle it with a real test, not a promise."
  es: "Encuentre la única duda. Resuélvala con una prueba real, no con una promesa."
why:
  en: "\"I need to think\" is rarely about the house. It's about daily life he can't picture yet. Here it's the drive to Brickell at rush hour. It feels small, so he may not say it."
  es: "\"Lo tengo que pensar\" casi nunca es por la casa. Es por la vida diaria que todavía no se imagina. Aquí es el viaje a Brickell en hora pico. Le parece poca cosa, así que a lo mejor no lo dice."
when:
  en: "He likes the home and the numbers, but stops with no clear reason."
  es: "Le gustan la casa y los números, pero se frena sin una razón clara."
when_not:
  en: "Never guess a drive time. Set up the test instead."
  es: "Nunca adivine cuánto se demora el viaje. Mejor organice la prueba."
say:
  - en: That makes sense. When you think it over tonight, what's the part you still want to be sure about?
    es: Tiene sentido. Cuando lo piense esta noche, ¿qué es lo que quiere tener claro antes de decidir?
  - en: Setting that aside for a second, do the house and the price work for you?
    es: Dejando eso a un lado un momento, ¿la casa y el precio le convencen?
  - en: Walk me through a normal weekday. Where do you work, and what time do you have to be there?
    es: Cuénteme cómo es un día normal de semana. ¿Dónde trabaja, y a qué hora tiene que estar allá?
  - en: I'm not going to guess a drive time for you. Let's have you do the drive for real.
    es: No le voy a adivinar cuánto se demora. Mejor haga el viaje de verdad.
mistakes:
  - mistake:
      en: "\"What's there to think about?\""
      es: "\"¿Qué hay que pensar?\""
    fix:
      en: "That makes a careful buyer feel silly. Ask what he is thinking about."
      es: "Eso hace sentir mal a un cliente cuidadoso. Pregunte qué está pensando."
  - mistake:
      en: "Showing him two more plans and the townhomes."
      es: "Enseñarle dos modelos más y los townhomes."
    fix:
      en: "More homes, more to think about. Settle the one doubt."
      es: "Más casas, más que pensar. Resuelva la única duda."
  - mistake:
      en: "\"Oh, it's an easy drive.\""
      es: "\"Ay, ese viaje es facilito.\""
    fix:
      en: "You don't know his drive. Let him do it."
      es: "Usted no conoce su viaje. Deje que lo haga él."
concepts:
  - name: { en: "Pause, then agree", es: Pausa y acuerdo }
    idea:
      en: "Wait two seconds. Agree that a home is worth thinking about."
      es: "Espere dos segundos. Déle la razón: una casa hay que pensarla."
    items: [HOM-O05-PAUSE, HOM-O05-RESPECT]
  - name: { en: '"What part?"', es: '"¿Qué parte?"' }
    idea:
      en: "One question turns \"I need to think\" into a real doubt."
      es: "Una pregunta convierte el \"lo tengo que pensar\" en una duda real."
    items: [HOM-O05-QFIRST, HOM-O05-HIDDEN]
  - name: { en: '"Apart from that…"', es: '"Aparte de eso…"' }
    idea:
      en: "Check that the house and the price are fine, so the doubt is all that's left."
      es: "Confirme que la casa y el precio están bien, para saber que solo queda la duda."
    items: [HOM-O05-ISOLATE]
  - name: { en: "Test, don't promise", es: "Pruebe, no prometa" }
    idea:
      en: "A real drive at rush hour is better than any guess."
      es: "Un viaje de verdad en hora pico es mejor que adivinar."
    items: [HOM-O05-PROOF, HOM-O05-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T002 Clarify with a question; T005 Isolate; T094 Remove real risk; T014 Specific next step
  - The JOLT Effect (Dixon and McKenna, 2022) on fear of a wrong choice, via T094
spanish_reviewed: false
