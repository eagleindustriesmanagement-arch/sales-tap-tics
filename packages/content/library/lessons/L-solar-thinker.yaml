code: L-solar-thinker
scenario: S-solar-thinker-L1
title:
  en: "\"I need to think about it\": ask what part"
  es: "\"Lo tengo que pensar\": pregunte qué parte"
hook:
  en: "He checked your quote against his own numbers and still needs to think. One question is still open."
  es: "Revisó su cotización con sus propios números y todavía lo tiene que pensar. Le queda una duda abierta."
tactic:
  en: "Agree, then ask what he still wants to be sure about. Settle it with a real answer, like the HOA's, not a promise."
  es: "Déle la razón y pregunte qué es lo que todavía quiere tener claro. Resuélvalo con una respuesta real, como la de la HOA, no con una promesa."
steps:
  - en: "Pause, then agree: \"That makes sense. It's a big decision.\""
    es: "Haga una pausa y déle la razón: \"Tiene sentido. Es una decisión grande.\""
  - en: "Ask: \"What's the part you still want to be sure about?\""
    es: "Pregunte: \"¿Qué es lo que todavía quiere tener seguro?\""
  - en: "Ask if the price and the estimate work for him, apart from that."
    es: "Pregunte si el precio y el estimado le funcionan, aparte de eso."
  - en: "Ask if an HOA has to approve what goes on his roof."
    es: "Pregunte si una HOA tiene que aprobar lo que va en su techo."
  - en: "Don't predict the HOA's answer. Set a day and time to fill out their application together."
    es: "No adivine lo que va a decir la HOA. Fije un día y una hora para llenar juntos la solicitud."
what:
  en: "Find the one open question. Answer it with something real, not a promise."
  es: "Encuentre la única duda. Contéstela con algo real, no con una promesa."
why:
  en: "A careful homeowner worries about what he can't check yet. In planned communities, that is often the HOA. He doesn't want to sign and then get a letter from them. Help him get the real answer, and the worry goes away."
  es: "A un dueño cuidadoso le preocupa lo que todavía no puede comprobar. En las comunidades planificadas, muchas veces es la HOA. No quiere firmar y después recibir una carta de ellos. Ayúdelo a conseguir la respuesta real, y la preocupación se va."
when:
  en: "When a homeowner who has done the math says he needs time."
  es: "Cuando un dueño que ya hizo las cuentas dice que necesita tiempo."
when_not:
  en: "Never predict what an HOA, a city or a lender will decide."
  es: "Nunca adivine lo que va a decidir una HOA, la ciudad o el banco."
say:
  - en: That makes sense. It's a big decision, and you clearly did your homework.
    es: Tiene sentido. Es una decisión grande, y se nota que usted hizo su tarea.
  - en: When you think it over tonight, what's the part you still want to be sure about?
    es: Cuando lo piense esta noche, ¿qué es lo que todavía quiere tener seguro?
  - en: Does anyone else have to approve what goes on your roof, like an HOA?
    es: ¿Alguien más tiene que aprobar lo que va en su techo, como la HOA?
  - en: I'm not going to tell you what your HOA will decide. Let's fill out their application together.
    es: No le voy a decir lo que va a decidir su HOA. Llenemos juntos la solicitud de ellos.
mistakes:
  - mistake:
      en: "\"What's there to think about?\""
      es: "\"¿Pero qué hay que pensar?\""
    fix:
      en: "That makes his careful work sound silly. Ask what part instead."
      es: "Eso hace ver su trabajo cuidadoso como una tontería. Mejor pregunte qué parte."
  - mistake:
      en: "Adding the battery and the monitoring \"while we're at it.\""
      es: "Agregarle la batería y el monitoreo \"ya que estamos\"."
    fix:
      en: "More options, more to think about. Settle the one open question."
      es: "Más opciones, más que pensar. Resuelva la única duda abierta."
  - mistake:
      en: "\"Don't worry, the HOA always approves these.\""
      es: "\"No se preocupe, la HOA siempre aprueba eso.\""
    fix:
      en: "You don't know that. Get him their written answer."
      es: "Usted no lo sabe. Consígale la respuesta por escrito."
concepts:
  - name: { en: The pause, es: La pausa }
    idea:
      en: "Two seconds of silence shows you won't argue."
      es: "Dos segundos de silencio le dicen que no va a discutir."
    items: [SOL-O05-PAUSE]
  - name: { en: Respect the thinking, es: Respete el pensarlo }
    idea:
      en: "Agree it is worth thinking about."
      es: "Déle la razón: hay que pensarlo bien."
    items: [SOL-O05-RESPECT]
  - name: { en: '"What part?"', es: '"¿Qué parte?"' }
    idea:
      en: "One question turns \"I need to think\" into the real doubt."
      es: "Una pregunta convierte el \"lo tengo que pensar\" en la duda real."
    items: [SOL-O05-QFIRST, SOL-O05-HIDDEN]
  - name: { en: Price aside, es: Aparte del precio }
    idea:
      en: "Check that the numbers work, so you know the doubt isn't money."
      es: "Confirme que los números funcionan, para saber que la duda no es dinero."
    items: [SOL-O05-ISOLATE]
  - name: { en: "The real answer, then a time", es: "La respuesta real, y después la hora" }
    idea:
      en: "Fill out the HOA application together, on a set day and time."
      es: "Llenen juntos la solicitud de la HOA, un día y a una hora fijos."
    items: [SOL-O05-PROOF, SOL-O05-NEXT]
sources:
  - T001 Pause; T003 Acknowledge; T002 Clarify with a question; T005 Isolate; T094 Remove real risk; T014 Firm next step
spanish_reviewed: false
