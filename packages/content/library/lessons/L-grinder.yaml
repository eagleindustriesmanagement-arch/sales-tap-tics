code: L-grinder
scenario: S-grinder-L3
title:
  en: "\"The price is too high\": make him earn every dollar"
  es: "\"El precio está muy alto\": que se gane cada dólar"
hook:
  en: He demands a big discount, one hand on the door. It's his first number, not his last.
  es: Pide una rebaja grande con una mano en la puerta. Es su primer número, no el último.
tactic:
  en: When he demands a big discount, hold your total price and ask where his number comes from. Then come down in small, shrinking steps, each for a commitment.
  es: Cuando le pida una rebaja grande, sostenga su precio total y pregunte de dónde sale su número. Después baje en pasos chicos, cada vez menores, y cada uno a cambio de un compromiso.
steps:
  - en: Pause. Then give the total price and why.
    es: Haga una pausa. Después dé el precio total y por qué.
  - en: "Ask: \"Help me understand your number. Where does it come from?\""
    es: "Pregunte: \"Ayúdeme a entender su número. ¿De dónde sale?\""
  - en: "Before you move, ask: \"If I get you closer, do we have a deal?\""
    es: "Antes de moverse, pregunte: \"Si lo acerco, ¿cerramos?\""
  - en: Come down in small steps, each smaller than the last. Stay within your manager's limit.
    es: Baje en pasos chicos, cada uno menor que el anterior. No se pase del límite de su gerente.
  - en: With the last step, get his signature and set a delivery time today.
    es: Con el último paso, consiga su firma y fije una hora de entrega para hoy.
what:
  en: Make every dollar off cost him a commitment, in shrinking steps.
  es: Que cada dólar de rebaja le cueste un compromiso, en pasos cada vez menores.
why:
  en: He wants proof he got your best price. A big, fast drop says there is more, so he pushes harder. Small steps that cost him something say you are near the end. Then he can say yes and feel he won.
  es: Quiere la prueba de que sacó su mejor precio. Una rebaja grande y rápida le dice que hay más, y aprieta más. Pasos chicos que le cuestan algo le dicen que ya casi llega al final. Así puede decir que sí y sentir que ganó.
when:
  en: He names a number and threatens to leave.
  es: Él dice una cifra y amenaza con irse.
when_not:
  en: Never go below your manager's limit, and never make up a lowest price. If there is still room, "not a dollar more" is a lie.
  es: Nunca baje del límite de su gerente, y nunca invente un precio mínimo. Si todavía hay margen, "ni un dólar más" es mentira.
say:
  - en: I'd rather earn your business than watch you walk. Here's why it's priced there.
    es: Prefiero ganarme su negocio que verlo irse. Le explico por qué tiene ese precio.
  - en: Help me understand your number. Where does it come from?
    es: Ayúdeme a entender su número. ¿De dónde sale?
  - en: I'll move if you will. If I get you closer, do we have a deal?
    es: Yo me muevo si usted se mueve. Si lo acerco, ¿cerramos?
  - en: This step is smaller, because we're close to what this truck is worth.
    es: Este paso es más chico, porque ya estamos cerca de lo que vale esta camioneta.
mistakes:
  - mistake:
      en: '"Okay, I''ll knock it all off right now."'
      es: '"Bueno, se lo quito todo ahora mismo."'
    fix:
      en: One big drop says there is more. Use small steps, each with a reason.
      es: Una rebaja grande le dice que hay más. Use pasos chicos, cada uno con su razón.
  - mistake:
      en: '"Let me see what else I can do."'
      es: '"Déjeme ver qué más puedo hacer."'
    fix:
      en: 'That gives something for free. Ask first: "If I get you there, will you sign?"'
      es: 'Eso es regalar. Pregunte primero: "Si se lo consigo, ¿firma?"'
  - mistake:
      en: '"That''s my bottom," when it isn''t.'
      es: '"Eso es lo más bajo", cuando no lo es.'
    fix:
      en: A false lowest price is a lie. Say "my steps are getting smaller."
      es: Un precio mínimo falso es una mentira. Diga "mis pasos son cada vez más chicos".
concepts:
  - name: { en: "Real price, real reason", es: "Precio real, razón real" }
    idea:
      en: Pause. Then the total price and why, before any dollar moves.
      es: Haga una pausa. Después el precio total y por qué, antes de mover un dólar.
    items: [O04-L3-PAUSE, O04-L3-ANCHOR]
  - name: { en: His number is a clue, es: Su número es una pista }
    idea:
      en: Ask where it comes from. That leads to the number he'll really pay.
      es: Pregunte de dónde sale. Eso lo lleva al número que de verdad va a pagar.
    items: [O04-L3-CLUE, O04-L3-HIDDEN]
  - name: { en: "Trade, never give", es: "Intercambiar, nunca regalar" }
    idea:
      en: For every dollar you give, ask for a commitment.
      es: Por cada dólar que da, pida un compromiso.
    items: [O04-L3-TRADE]
  - name: { en: Shrinking steps, es: Pasos cada vez menores }
    idea:
      en: Each step smaller, each with a reason, within your manager's limit.
      es: Cada paso más chico, cada uno con su razón, dentro del límite de su gerente.
    items: [O04-L3-STEPS]
  - name: { en: Sign and deliver, es: Firma y entrega }
    idea:
      en: The last step gets a signature and a delivery time today.
      es: El último paso consigue una firma y una hora de entrega hoy.
    items: [O04-L3-NEXT]
sources:
  - T015 Anchor with the real price and a reason; T110 Treat a hard demand as a clue; T018 Trade, never give; T019 Small concessions, shrinking; T001 Pause and slow down; T014 Firm next step
  - Malhotra and Bazerman's negotiation method, via T110
  - Kwon and Weingart (2004) on concession patterns, via T019
spanish_reviewed: false
