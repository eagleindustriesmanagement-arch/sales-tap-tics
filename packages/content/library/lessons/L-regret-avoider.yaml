code: L-regret-avoider
scenario: S-regret-avoider-L2
title:
  en: "\"I don't want to regret it\": shrink the fear to one choice"
  es: "\"No quiero arrepentirme\": achique el miedo a una sola decisión"
hook:
  en: Third visit. Everybody loves the truck. He still can't pull the trigger.
  es: Tercera visita. A todos les encanta la camioneta. Y él todavía no se decide.
what:
  en: You know the pause and the question. Now go deeper. Name the fear of choosing wrong, shrink it to the one choice he's stuck on, and take out the risk with facts he can check.
  es: La pausa y la pregunta ya usted las sabe. Ahora vaya más hondo. Nombre el miedo de escoger mal, achíquelo a la decisión donde está trancado, y quítele el riesgo con datos que él pueda comprobar.
why:
  en: To a scared buyer, doing nothing feels safer than choosing wrong. A wrong pick is his fault; waiting isn't. So every push makes waiting look smarter, and "you won't regret it" sounds like a salesman. Name the fear and it's normal. Shrink it to one choice and you solve it together.
  es: Para un cliente con miedo, no hacer nada se siente más seguro que escoger mal. Si escoge mal, la culpa es suya; si espera, no. Por eso cada empujón hace que quedarse quieto parezca lo inteligente, y "no se va a arrepentir" suena a vendedor. Si nombra el miedo, se vuelve normal. Si lo achica a una decisión, la resuelven juntos.
when:
  en: He likes the car and the numbers, but keeps coming back without deciding.
  es: Le gustan el carro y los números, pero vuelve y vuelve sin decidirse.
when_not:
  en: Don't invent the fear for him. If he names a real problem, work that.
  es: No le invente el miedo. Si nombra un problema real, trabaje eso.
say:
  - en: That's smart. It's a lot of money, and you should feel sure.
    es: Eso es sensato. Es mucho dinero, y usted tiene que sentirse seguro.
  - en: A lot of people worry about picking the wrong one and regretting it. Is any of that going on for you?
    es: Mucha gente tiene miedo de escoger mal y arrepentirse después. ¿Le está pasando algo de eso?
  - en: So the truck is right and the numbers work. Is it which version to get?
    es: Entonces la camioneta es la correcta y los números funcionan. ¿La duda es cuál versión?
  - en: Let's settle it with facts. Sit in both, and list what you'd use every week and what you'd never touch.
    es: Resolvámoslo con datos. Siéntese en las dos y anotamos lo que usaría todas las semanas y lo que nunca tocaría.
mistakes:
  - mistake:
      en: '"You won''t regret it, trust me."'
      es: '"No se va a arrepentir, confíe en mí."'
    fix:
      en: A promise he can't check makes him more nervous. Show him facts.
      es: Una promesa que no puede comprobar lo pone más nervioso. Enséñele datos.
  - mistake:
      en: '"We''ve also got the RST and the Z71."'
      es: '"También tenemos la RST y la Z71."'
    fix:
      en: Every new trim is one more to regret. Close the search.
      es: Cada versión nueva es una más para arrepentirse. Cierre la búsqueda.
  - mistake:
      en: '"Just take it today and stop worrying."'
      es: '"Llévesela hoy y deje de preocuparse."'
    fix:
      en: Pressure makes waiting look safe. Slow down, set a day.
      es: La presión hace que esperar parezca seguro. Baje el ritmo y fije un día.
concepts:
  - name:
      en: "Pause, then agree"
      es: "Pausa y déle la razón"
    idea:
      en: Wanting to be sure is smart. Say so first.
      es: Querer estar seguro es inteligente. Dígaselo primero.
    items: [O60-PAUSE, O60-ACK]
  - name:
      en: "Name the fear"
      es: "Nombre el miedo"
    idea:
      en: Say "picking the wrong one" out loud. Now he can talk about it.
      es: Diga "escoger mal" en voz alta. Le da permiso para hablar.
    items: [O60-NAMEFEAR]
  - name:
      en: "Shrink it to one choice"
      es: "Achíquelo a una decisión"
    idea:
      en: Isolate. Truck and numbers settled, what's left is the real fork.
      es: Aísle. Con la camioneta y los números resueltos, lo que queda es la duda real.
    items: [O60-HIDDEN]
  - name:
      en: "Facts, not promises"
      es: "Datos, no promesas"
    idea:
      en: Remove real risk with what he can check, between the two trims in play.
      es: Quite el riesgo real con lo que él puede comprobar, entre las dos versiones en juego.
    items: [O60-RISK, O60-LIMIT]
  - name:
      en: "Bring the family, set the time"
      es: "Traiga a la familia, fije la hora"
    idea:
      en: Everyone who rides sees both, on a set day and time.
      es: Todos los que se van a montar ven las dos, con día y hora fijos.
    items: [O60-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T091 Name the fear; T005 Isolate; T094 Remove real risk; T093 Limit the exploration; T014 Firm next step
  - The JOLT Effect (Dixon and McKenna, 2022); omission bias (Ritov and Baron, 1990)
spanish_reviewed: false
