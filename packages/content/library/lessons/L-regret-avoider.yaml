code: L-regret-avoider
scenario: S-regret-avoider-L2
title:
  en: "\"I don't want to regret it\": shrink the fear to one choice"
  es: "\"No quiero arrepentirme\": achique el miedo a una sola decisión"
hook:
  en: It's his third visit. The whole family loves the truck. He still can't decide.
  es: Es su tercera visita. A toda la familia le encanta la camioneta. Y él todavía no se decide.
tactic: { en: "He is afraid of choosing wrong. Name that fear, find the one choice he's stuck on, and settle it with facts he can check.", es: "Tiene miedo de escoger mal. Nombre ese miedo, encuentre la única decisión que le falta y resuélvala con datos que él pueda comprobar." }
steps:
  - { en: "Pause, then agree: \"That's smart. You should feel sure.\"", es: "Haga una pausa y déle la razón: \"Eso es sensato. Usted tiene que sentirse seguro.\"" }
  - { en: "Ask if he's worried about picking the wrong one.", es: "Pregúntele si le preocupa escoger mal." }
  - { en: "Check the truck and numbers are fine. Then ask: \"Is it which version to get?\"", es: "Confirme que la camioneta y los números están bien. Después pregunte: \"¿La duda es cuál versión?\"" }
  - { en: "Compare only the two trims. Sit in both and list what he'd really use.", es: "Compare solo las dos versiones. Siéntense en las dos y anoten lo que de verdad usaría." }
  - { en: "Set a day and time for the family to see both trims.", es: "Fije un día y una hora para que la familia vea las dos." }
what:
  en: You know the pause and the question. Now name his fear and narrow it to one choice.
  es: Ya sabe hacer la pausa y la pregunta. Ahora nombre su miedo y redúzcalo a una sola decisión.
why:
  en: To a nervous buyer, doing nothing feels safer than choosing wrong. A wrong choice is his fault. Waiting is not. So every push makes waiting look smarter. Naming the fear makes it feel normal. One choice is easy to solve together.
  es: Para un cliente nervioso, no hacer nada se siente más seguro que escoger mal. Si escoge mal, la culpa es suya. Si espera, no. Por eso cada empujón hace que esperar parezca lo más inteligente. Nombrar el miedo lo hace normal. Una sola decisión es fácil de resolver juntos.
when:
  en: He likes it all, but keeps coming back without deciding.
  es: Le gusta todo, pero vuelve y vuelve sin decidirse.
when_not:
  en: Don't make up a fear for him. If he names a real problem, work on that.
  es: No le invente un miedo. Si él nombra un problema real, trabaje en ese problema.
say:
  - en: That's smart. It's a lot of money, and you should feel sure.
    es: Eso es sensato. Es mucho dinero, y usted tiene que sentirse seguro.
  - en: A lot of people worry about picking the wrong one and regretting it. Is any of that going on for you?
    es: Mucha gente tiene miedo de escoger mal y arrepentirse después. ¿Le está pasando algo de eso?
  - en: So the truck is right and the numbers work. Is it which version to get?
    es: Entonces la camioneta es la correcta y los números funcionan. ¿La duda es cuál versión?
  - en: Let's settle it with facts. Sit in both, and list what you'd use every week and what you'd never touch.
    es: Resolvámoslo con datos. Siéntese en las dos y anotamos lo que usaría todas las semanas y lo que nunca tocaría.
mistakes:
  - mistake:
      en: '"You won''t regret it, trust me."'
      es: '"No se va a arrepentir, confíe en mí."'
    fix:
      en: He can't check a promise, so it makes him more nervous. Show facts.
      es: Una promesa no se puede comprobar, y lo pone más nervioso. Enséñele datos.
  - mistake:
      en: '"We''ve also got the RST and the Z71."'
      es: '"También tenemos la RST y la Z71."'
    fix:
      en: More trims mean more ways to choose wrong. Keep it to two.
      es: Más versiones son más formas de escoger mal. Quédese con dos.
  - mistake:
      en: '"Just take it today and stop worrying."'
      es: '"Llévesela hoy y deje de preocuparse."'
    fix:
      en: Pressure makes waiting feel safer. Slow down and set a day.
      es: La presión hace que esperar se sienta más seguro. Vaya más despacio y fije un día.
concepts:
  - name:
      en: "Pause, then agree"
      es: "Pausa y déle la razón"
    idea:
      en: Wanting to be sure is smart. Say so first.
      es: Querer estar seguro es inteligente. Dígaselo primero.
    items: [O60-PAUSE, O60-ACK]
  - name:
      en: "Name the fear"
      es: "Nombre el miedo"
    idea:
      en: Say "picking the wrong one" out loud. Then he can talk about it.
      es: Diga "escoger mal" en voz alta. Así él puede hablar de eso.
    items: [O60-NAMEFEAR]
  - name:
      en: "Shrink it to one choice"
      es: "Achíquelo a una decisión"
    idea:
      en: Truck and numbers are settled. What's left is the real choice.
      es: La camioneta y los números ya están resueltos. Lo que queda es la duda real.
    items: [O60-HIDDEN]
  - name:
      en: "Facts, not promises"
      es: "Datos, no promesas"
    idea:
      en: Facts he can check, only between the two trims.
      es: Datos que él pueda comprobar, solo entre las dos versiones.
    items: [O60-RISK, O60-LIMIT]
  - name:
      en: "Bring the family, set the time"
      es: "Traiga a la familia, fije la hora"
    idea:
      en: Everyone who will ride sees both, on a set day and time.
      es: Todos los que se van a montar ven las dos, con día y hora fijos.
    items: [O60-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T091 Name the fear; T005 Isolate; T094 Remove real risk; T093 Limit the exploration; T014 Firm next step
  - The JOLT Effect (Dixon and McKenna, 2022); omission bias (Ritov and Baron, 1990)
spanish_reviewed: false
