code: L-browser
scenario: S-browser-L1
title:
  en: "\"I'm just looking\": lower the guard, then ask about her car"
  es: "\"Solo estoy mirando\": bájele la guardia y pregunte por su carro"
hook:
  en: After work, alone on the lot, arms crossed. She speaks first.
  es: Después del trabajo, sola en el lote, con los brazos cruzados. Ella habla primero.
tactic:
  en: When she says she is just looking, agree and take the pressure off. Then ask about the car she drives now. Her real timing is there.
  es: Cuando le diga que solo está mirando, déle la razón y quítele la presión. Después pregúntele por el carro que maneja ahora. Ahí está su fecha real.
steps:
  - en: "Pause, then agree: \"Take your time, you're free to walk around on your own.\""
    es: "Haga una pausa y déle la razón: \"Tómese su tiempo, puede mirar por su cuenta, sin compromiso.\""
  - en: "Ask: \"Are you just starting to look, or have you narrowed it down?\""
    es: "Pregunte: \"¿Apenas está empezando a mirar, o ya tiene algo pensado?\""
  - en: Ask what she drives now, and when that has to change.
    es: Pregunte qué maneja ahora y cuándo tiene que cambiarlo.
  - en: If a date comes up, like a lease ending, make a calm plan.
    es: Si sale una fecha, como el fin de un lease, haga un plan con calma.
  - en: Set a day and time for her next visit.
    es: Fije un día y una hora para su próxima visita.
what:
  en: Make her feel free to look. Then find out when she really needs a car.
  es: Haga que se sienta libre de mirar. Después averigüe cuándo necesita carro de verdad.
why:
  en: '"Just looking" protects her. It is not a lie. If you push, she holds on to it. If she feels free to go, she relaxes and talks. Her current car usually holds her deadline.'
  es: '"Solo estoy mirando" la protege. No es una mentira. Si la presiona, se agarra más a eso. Si se siente libre de irse, se relaja y habla. Su carro actual casi siempre tiene la fecha límite.'
when:
  en: You greet someone on the lot, or a customer says it to keep you away.
  es: Cuando saluda a alguien en el lote, o un cliente lo dice para mantenerlo lejos.
when_not:
  en: Don't say it if you don't mean it. If she is free to look, step back and let her look.
  es: No lo diga si no lo cree. Si de verdad puede mirar con calma, apártese y déjela mirar.
say:
  - en: That's perfect. Take your time, you're free to walk around on your own.
    es: Perfecto. Tómese su tiempo, puede mirar por su cuenta, sin compromiso.
  - en: Are you just starting to look, or have you narrowed it down a bit?
    es: ¿Apenas está empezando a mirar, o ya tiene algo más o menos pensado?
  - en: So I can point you to the right ones, what are you driving now?
    es: Para orientarla bien, ¿qué carro tiene ahora?
  - en: Thanks for telling me. There's time to do this calmly. Here's an easy plan.
    es: Gracias por decírmelo. Hay tiempo para hacer esto con calma. Le propongo algo fácil.
mistakes:
  - mistake:
      en: '"Everybody''s just looking!"'
      es: '"¡Todo el mundo está solo mirando!"'
    fix:
      en: That tells her you don't believe her. Agree, and give her space.
      es: Eso le dice que usted no le cree. Déle la razón y déjele espacio.
  - mistake:
      en: Talking about the touchscreen in the first minute.
      es: Hablarle de la pantalla en el primer minuto.
    fix:
      en: Ask about her car before you talk about features.
      es: Pregunte por su carro antes de hablar del equipamiento.
  - mistake:
      en: Hearing her lease date and pushing her to buy today.
      es: Oír la fecha del lease y presionarla para que compre hoy.
    fix:
      en: That is pressure, and she will leave. Make a calm plan instead.
      es: Eso es presión, y se va a ir. Mejor haga un plan con calma.
concepts:
  - name:
      en: '"You''re free to look"'
      es: '"Mire con calma"'
    idea:
      en: Tell her out loud she can leave. Then she won't need to.
      es: Dígale en voz alta que se puede ir. Así no va a tener que irse.
    items: [O06-PAUSE, O06-NOPRESSURE]
  - name:
      en: '"Just starting to look?"'
      es: '"¿Apenas empezando?"'
    idea:
      en: Ask where she is in her search, not which car she wants.
      es: Pregunte en qué punto de la búsqueda está, no qué carro quiere.
    items: [O06-START]
  - name:
      en: "Ask about today's car"
      es: "Pregunte por el carro de hoy"
    idea:
      en: A lease, a repair, a loan. Her timing comes from the car she drives now.
      es: Un lease, una reparación, un préstamo. Su fecha sale del carro que maneja ahora.
    items: [O06-QFIRST, O06-HIDDEN]
  - name:
      en: "A plan, not a push"
      es: "Un plan, no presión"
    idea:
      en: A real date gives you a plan, with steps and a next visit.
      es: Una fecha real le da un plan, con pasos y una próxima visita.
    items: [O06-PLAN]
  - name:
      en: "Lock a day and time"
      es: "Amarre un día y una hora"
    idea:
      en: Book her next visit, not a sale today.
      es: Fije su próxima visita, no una venta para hoy.
    items: [O06-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T084 "Starting to look" greeting; T031 "You are free to say no"; T002 Clarify with a question; T014 Firm next step
  - '"But you are free" meta-analysis, 42 studies, small effect (Carpenter, 2013), via T031'
spanish_reviewed: false
