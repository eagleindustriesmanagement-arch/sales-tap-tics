code: L-browser
scenario: S-browser-L1
title:
  en: "\"I'm just looking\": lower the guard, then ask about her car"
  es: "\"Solo estoy mirando\": bájele la guardia y pregunte por su carro"
hook:
  en: Tuesday after work, alone by the small SUVs, arms crossed. She fires first.
  es: Martes después del trabajo, sola al lado de las SUV pequeñas, con los brazos cruzados. Ella dispara primero.
what:
  en: Agree, and take the pressure off out loud. Ask where she is in her search, then what she drives now. If a date comes up, make it a calm plan, never a push.
  es: Déle la razón y quítele la presión en voz alta. Pregunte en qué punto de la búsqueda está y después qué maneja ahora. Si sale una fecha, conviértala en un plan tranquilo, nunca en presión.
why:
  en: She came alone on a weekday evening to look without a salesman on her. "Just looking" is a shield, not a lie. Push and she has to hold it up. Tell her she's free to walk and she puts it down. Then the real story comes from the car she's in now. That's where the clock usually is.
  es: Vino sola un día de semana por la tarde para mirar sin un vendedor encima. "Solo estoy mirando" es un escudo, no una mentira. Si la presiona, lo tiene que sostener. Si le dice que está en libertad, lo baja. Y la historia de verdad sale del carro que tiene ahora. Ahí casi siempre está el reloj.
when:
  en: The lot greeting, or any up who says it to keep you at arm's length.
  es: El saludo en el lote, o cualquier cliente que lo diga para mantenerlo a distancia.
when_not:
  en: Don't say it if you don't mean it. Free to look means you step back.
  es: No lo diga de dientes para afuera. Si está en libertad de mirar, usted se aparta y la deja mirar.
say:
  - en: That's perfect. Take your time, you're free to walk around on your own.
    es: Perfecto. Tómese su tiempo, está en libertad de mirar por su cuenta.
  - en: Are you just starting to look, or have you narrowed it down a bit?
    es: ¿Apenas está empezando a mirar, o ya tiene algo más o menos pensado?
  - en: So I can point you to the right ones, what are you driving now?
    es: Para orientarla bien, ¿qué carro tiene ahora?
  - en: Thanks for telling me. There's time to do this calmly. Here's an easy plan.
    es: Gracias por decírmelo. Hay tiempo para hacer esto con calma. Le propongo algo fácil.
mistakes:
  - mistake:
      en: '"Everybody''s just looking!"'
      es: '"¡Todo el mundo está solo mirando!"'
    fix:
      en: You just called her a liar. Agree, and give her room.
      es: La acaba de llamar mentirosa. Déle la razón y espacio.
  - mistake:
      en: Pitching the screen in the first minute.
      es: Venderle la pantalla en el primer minuto.
    fix:
      en: Features come after you know her. Ask about her car first.
      es: El equipamiento viene después de conocerla. Pregunte primero por su carro.
  - mistake:
      en: Hearing the lease date and pushing for today.
      es: Oír la fecha del lease y presionar para hoy.
    fix:
      en: That's pressure with a date on it. She walks. Make it a plan.
      es: Eso es presión con fecha, y se va. Conviértalo en un plan.
concepts:
  - name:
      en: '"You''re free to look"'
      es: '"Está en libertad de mirar"'
    idea:
      en: Pause, then say out loud she can leave. Now she doesn't have to.
      es: Haga una pausa y dígale en voz alta que se puede ir. Así no tiene que hacerlo.
    items: [O06-PAUSE, O06-NOPRESSURE]
  - name:
      en: '"Just starting to look?"'
      es: '"¿Apenas empezando?"'
    idea:
      en: Ask where she is in the search, not which car she wants.
      es: Pregunte en qué punto está, no qué carro quiere.
    items: [O06-START]
  - name:
      en: "Ask about today's car"
      es: "Pregunte por el carro de hoy"
    idea:
      en: A lease, a repair, a payoff. The timing lives in the car she drives now.
      es: Un lease, una reparación, lo que debe. La fecha vive en el carro que maneja hoy.
    items: [O06-QFIRST, O06-HIDDEN]
  - name:
      en: "A plan, not a push"
      es: "Un plan, no presión"
    idea:
      en: A real date is a reason to plan calmly, never to sign today.
      es: Una fecha real es razón para planificar con calma, nunca para firmar hoy.
    items: [O06-PLAN]
  - name:
      en: "Lock a day and time"
      es: "Amarre un día y una hora"
    idea:
      en: Close the next visit, not the car.
      es: Cierre la próxima visita, no el carro.
    items: [O06-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T084 "Starting to look" greeting; T031 "You are free to say no"; T002 Clarify with a question; T014 Firm next step
  - '"But you are free" meta-analysis, 42 studies, small effect (Carpenter, 2013), via T031'
spanish_reviewed: false
