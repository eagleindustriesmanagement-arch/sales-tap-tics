code: L-partner-check
scenario: S-partner-check-L1
title:
  en: "\"I need to talk to my wife\": find out what she'll ask"
  es: "\"Tengo que hablarlo con mi esposa\": averigüe qué va a preguntar ella"
hook:
  en: The test drive went great. Then he says it. Many reps just hand him a card. Don't.
  es: La prueba de manejo salió muy bien. Entonces lo dice. Muchos vendedores le dan la tarjeta y ya. Usted no.
tactic: { en: "When he says he needs to talk to his wife, don't push. Find out what she will ask, and set a time to come back together.", es: "Cuando le diga que tiene que hablarlo con su esposa, no presione. Averigüe qué va a preguntar ella y fije una hora para que vuelvan juntos." }
steps:
  - { en: "Pause, then agree: \"Of course. It's a big decision.\"", es: "Haga una pausa y déle la razón: \"Claro que sí. Es una decisión grande.\"" }
  - { en: "Ask: \"What do you think her first question will be?\"", es: "Pregunte: \"¿Cuál cree que va a ser la primera pregunta de ella?\"" }
  - { en: "Answer that question, or offer to show her the numbers too.", es: "Conteste esa pregunta u ofrezca enseñarle los números a ella también." }
  - { en: "Ask if anything else is holding him back.", es: "Pregunte si hay algo más que lo detenga." }
  - { en: "Before he leaves, set a day and time for both of them.", es: "Antes de que se vaya, fije un día y una hora para los dos." }
what:
  en: Treat his wife as a buyer who isn't here yet. Give them both a reason to come back.
  es: Trate a la esposa como una compradora que todavía no ha llegado. Déles a los dos una razón para volver.
why:
  en: Sometimes they really decide together. Often it's a polite way out. He may have a number he can't explain at home. If you push, he expects a fight at home. If you ask what she'll ask, you're on his side.
  es: A veces de verdad deciden juntos. Muchas veces es una forma educada de irse. Puede que tenga un número que no sabe explicar en la casa. Si usted presiona, él espera una discusión en la casa. Si pregunta qué va a preguntar ella, usted está de su lado.
when:
  en: Any time a customer names someone who isn't there, before you talk numbers again.
  es: Cada vez que el cliente nombra a alguien que no está, antes de volver a hablar de números.
when_not:
  en: Not a trick to keep him here. If she really decides, help him take everything home and set the visit.
  es: No es un truco para que no se vaya. Si de verdad decide ella, ayúdelo a llevarse todo y fijen la visita.
say:
  - en: Of course. It's a big decision and you should both be comfortable.
    es: Claro que sí. Es una decisión grande y los dos tienen que sentirse cómodos.
  - en: When you talk tonight, what do you think her first question will be?
    es: Cuando lo hablen esta noche, ¿cuál cree que va a ser la primera pregunta de ella?
  - en: Other than talking it over at home, is anything about the car or the numbers holding you back?
    es: Aparte de hablarlo en la casa, ¿hay algo del carro o de los números que lo detenga?
  - en: Would she rather see it in person, or should we set up a quick video call?
    es: ¿Ella prefiere verlo en persona, o hacemos una videollamada rapidita?
mistakes:
  - mistake:
      en: '"What if you sign now and tell her tonight?"'
      es: '"¿Y si firma ahora y se lo cuenta esta noche?"'
    fix:
      en: That makes her the enemy. Ask about her instead.
      es: Así la convierte en la enemiga. Mejor pregunte por ella.
  - mistake:
      en: Cutting the price or adding months before you know the problem.
      es: Bajar el precio o alargar el plazo sin saber cuál es el problema.
    fix:
      en: Ask one question first. The real worry usually comes out next.
      es: Primero haga una pregunta. La preocupación real casi siempre sale después.
  - mistake:
      en: Handing over a card with "let me know."
      es: Dar la tarjeta con un "me avisa".
    fix:
      en: Then he leaves with no next step. Set a day and a time.
      es: Así se va sin próximo paso. Fije un día y una hora.
concepts:
  - name: { en: The two-second pause, es: La pausa de dos segundos }
    idea:
      en: Two seconds of quiet show you heard him and won't argue.
      es: Dos segundos de silencio le dicen que usted lo escuchó y no va a discutir.
    items: [O01-PAUSE]
  - name: { en: Respect the partner, es: Respete a la pareja }
    idea:
      en: She's a buyer, not a problem. Agree, and offer to include her.
      es: Ella es compradora, no un problema. Déle la razón y ofrezca incluirla.
    items: [O01-ACK, O01-PARTNER]
  - name: { en: Her first question, es: La primera pregunta de ella }
    idea:
      en: Asking what she'll ask brings out the real worry. Usually it's the payment.
      es: Preguntar qué va a preguntar ella saca la preocupación real. Casi siempre es el pago.
    items: [O01-QFIRST, O01-HIDDEN]
  - name: { en: '"Other than that…"', es: '"Aparte de eso…"' }
    idea:
      en: Ask if talking at home is the only thing stopping him.
      es: Pregunte si hablarlo en la casa es lo único que lo detiene.
    items: [O01-ISOLATE]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "A next step both agree to: day, time and who is coming."
      es: "Un próximo paso que los dos aceptan: día, hora y quién viene."
    items: [O01-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T005 Isolate; T013 Include the decision maker; T014 Specific next step
spanish_reviewed: false
