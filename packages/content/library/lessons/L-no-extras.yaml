code: L-no-extras
scenario: S-no-extras-L2
title:
  en: "\"No extras in finance\": honor the no, then show the menu"
  es: "\"No quiero extras en financiamiento\": respete el no, y enseñe el menú"
hook:
  en: He sits down in the finance office, arms crossed, and says no before hello.
  es: Se sienta en la oficina de financiamiento con los brazos cruzados y dice que no antes de saludar.
tactic:
  en: When he says no extras, accept it. Ask what happened last time. Then show every payment side by side, labeled, and let him choose.
  es: Cuando diga que no quiere extras, acéptelo. Pregunte qué le pasó la última vez. Después enséñele todos los pagos lado a lado, identificados, y que él escoja.
steps:
  - en: "Pause, then agree: \"That's your decision. Nothing goes in without your yes.\""
    es: "Haga una pausa y déle la razón: \"Eso lo decide usted. No se agrega nada sin su sí.\""
  - en: "Ask: \"Can I ask what happened last time that makes you say that?\""
    es: "Pregunte: \"¿Le puedo preguntar qué le pasó la última vez para que me diga eso?\""
  - en: Show every payment side by side, including the one with no products.
    es: Enséñele todos los pagos lado a lado, también el que no tiene productos.
  - en: Say every product is optional. None affects approval, rate or delivery.
    es: Diga que todo producto es opcional. Ninguno afecta la aprobación, la tasa ni la entrega.
  - en: Print what he chose and set a delivery time he agrees to.
    es: Imprima lo que él escogió y fije una hora de entrega que él acepte.
what:
  en: Respect his no, and let him see every choice clearly.
  es: Respete su no y deje que vea cada opción con claridad.
why:
  en: His no is about his last finance office, where a product got hidden in his payment. Agree, and there is no fight. His story tells you what he might want. A labeled menu hides nothing.
  es: Su no viene de la última oficina de financiamiento, donde le escondieron un producto en el pago. Déle la razón y no hay pelea. Su historia le dice qué podría querer. Un menú bien identificado no esconde nada.
when:
  en: A customer says no to products before seeing any.
  es: Un cliente dice que no a los productos antes de ver ninguno.
when_not:
  en: Don't use this as a trick to sell. If he still says no, print the no-products payment and deliver.
  es: No lo use como truco para venderle. Si sigue diciendo que no, imprima el pago sin productos y entregue el carro.
say:
  - en: Understood, that's your decision. Nothing goes in your contract without your yes.
    es: Entendido, eso lo decide usted. No se agrega nada a su contrato sin que usted diga que sí.
  - en: Can I ask what happened last time that makes you say that?
    es: ¿Le puedo preguntar qué le pasó la última vez para que me diga eso?
  - en: Every product is optional. None affects your approval, rate or delivery.
    es: Todos los productos son opcionales. Ninguno afecta su aprobación, su tasa ni su entrega.
  - en: The service contract is optional. Cancel within 60 days for a full refund, less claims paid and an admin fee of up to 5%.
    es: El contrato de servicio es opcional. Si lo cancela dentro de 60 días le devuelven todo, menos los reclamos pagados y un cargo administrativo de hasta 5%.
mistakes:
  - mistake:
      en: '"Most of my customers take the service contract."'
      es: '"La mayoría de mis clientes se llevan el contrato de servicio."'
    fix:
      en: You decided for him after his no. Show it with its price, and let him decide.
      es: Decidió por él después de su no. Enséñelo con su precio, y que decida él.
  - mistake:
      en: Quoting only the payment with everything in it.
      es: Dar solo el pago con todo incluido.
    fix:
      en: Show every payment, including the one with no products.
      es: Enseñe todos los pagos, también el que no tiene productos.
  - mistake:
      en: '"The bank likes to see GAP on a loan like this."'
      es: '"Al banco le gusta ver el GAP en un préstamo así."'
    fix:
      en: Never. No product is required for approval, rate or delivery.
      es: Nunca. Ningún producto es requisito para la aprobación, la tasa ni la entrega.
concepts:
  - name: { en: "Pause, then accept the no", es: "Pausa, y acepte el no" }
    idea:
      en: Wait two seconds, then agree. Nothing goes in without his yes.
      es: Espere dos segundos y déle la razón. No entra nada sin su sí.
    items: [O46-PAUSE, O46-ACK]
  - name: { en: What happened last time?, es: ¿Qué le pasó la última vez? }
    idea:
      en: Ask before any product. His story tells you what he might want.
      es: Pregunte antes de cualquier producto. Su historia le dice qué podría querer.
    items: [O46-QFIRST, O46-HIDDEN]
  - name: { en: Two-payment menu, es: Menú de dos pagos }
    idea:
      en: Label every payment. Never make the loan longer to hide a product.
      es: Identifique cada pago. Nunca alargue el plazo para esconder un producto.
    items: [O46-MENU]
  - name: { en: Optional means optional, es: Opcional quiere decir opcional }
    idea:
      en: No product affects approval, rate or delivery.
      es: Ningún producto afecta la aprobación, la tasa ni la entrega.
    items: [O46-NOREQ]
  - name: { en: The 60-day reassurance, es: La tranquilidad de los 60 días }
    idea:
      en: He can cancel within 60 days for a refund. The 60-day rule is for the service contract only; don't quote it for GAP.
      es: Puede cancelarlo dentro de 60 días con reembolso. La regla de 60 días es solo del contrato de servicio; no la use para el GAP.
    items: [O46-SC]
  - name: { en: Lock the delivery time, es: Amarre la hora de entrega }
    idea:
      en: Print what he chose. Set a time he agrees to.
      es: Imprima lo que escogió. Fije una hora que él acepte.
    items: [O46-NEXT]
sources:
  - T001 Pause and slow down; T051 Do not pre-judge products; T002 Clarify with a question; T121 Two-payment menu; T074 The 60-day reassurance; T014 Firm next step
  - Rules ADD-01, ADD-04, PAY-01, PAY-02, PAY-03
spanish_reviewed: false
