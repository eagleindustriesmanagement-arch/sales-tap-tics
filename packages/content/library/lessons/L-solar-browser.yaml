code: L-solar-browser
scenario: S-solar-browser-L1
title:
  en: "\"I'm just looking\": take the pressure off, then ask why now"
  es: "\"Solo estoy mirando\": quite la presión y pregunte por qué ahora"
hook:
  en: "She booked the visit herself, then says she's just getting information. Believe her. Then find out why she booked."
  es: "Ella misma pidió la visita, y ahora dice que solo busca información. Créale. Después averigüe por qué la pidió."
tactic:
  en: "Agree, and tell her she is free to say no. Then ask what made her book the visit now."
  es: "Déle la razón y dígale que puede decir que no. Después pregúntele qué la hizo pedir la visita ahora."
steps:
  - en: "Pause, then say: \"That's what this visit is for. You're free to say no.\""
    es: "Haga una pausa y diga: \"Para eso es esta visita. Usted puede decir que no.\""
  - en: "Ask if she is just starting or has compared companies."
    es: "Pregunte si apenas está empezando o si ya comparó compañías."
  - en: "Ask what made her book now, and how long she'll stay in the house."
    es: "Pregunte qué la hizo pedir la visita y cuánto tiempo piensa quedarse en la casa."
  - en: "If she may sell, offer written loan terms and the cash price. Promise nothing about resale."
    es: "Si piensa vender, ofrezca los términos del préstamo por escrito y el precio de contado. No prometa nada sobre la venta."
  - en: "Set a day and time to go over the terms."
    es: "Fije un día y una hora para revisar los términos."
what:
  en: "Take the pressure off first. Then find the reason she booked. That reason tells you what to do next."
  es: "Primero quite la presión. Después busque la razón por la que pidió la visita. Esa razón le dice qué hacer."
why:
  en: "A homeowner who expects a hard sell gets defensive. When she feels free to say no, she relaxes. Here she might sell in a few years, and a long loan worries her. Don't promise the house will sell for more. Give her the terms in writing."
  es: "La dueña que espera que le vendan a la fuerza se pone a la defensiva. Cuando siente que puede decir que no, se relaja. Aquí a lo mejor vende en unos años, y un préstamo largo le preocupa. No le prometa que la casa se va a vender por más. Déle los términos por escrito."
when:
  en: "At the door, when she says she's only gathering information."
  es: "En la puerta, cuando dice que solo está buscando información."
when_not:
  en: "Never turn her plans into pressure. Never promise what a buyer would pay for her house."
  es: "Nunca convierta sus planes en presión. Nunca le prometa lo que un comprador pagaría por su casa."
say:
  - en: That's perfect. Information is what this visit is for, and you're free to say no to all of it.
    es: Perfecto. Para eso es esta visita, para información, y usted está en libertad de decirle que no a todo.
  - en: So I show you what matters to you, what made you book the visit now?
    es: Para enseñarle lo que a usted le importa, ¿qué la puso a buscar esto ahora?
  - en: How long do you see yourself staying in this house?
    es: ¿Cuánto tiempo se ve viviendo en esta casa?
  - en: I'll get you the loan terms in writing, including what happens if you sell, with the cash price next to them.
    es: Le consigo los términos del préstamo por escrito, incluido qué pasa si vende, con el precio de contado al lado.
mistakes:
  - mistake:
      en: "\"Everybody's just looking!\""
      es: "\"¡Todo el mundo está solo mirando!\""
    fix:
      en: "That tells her she's lying. Agree with her."
      es: "Eso le dice que está mintiendo. Déle la razón."
  - mistake:
      en: "Starting with the battery and the monitoring app."
      es: "Empezar con la batería y la aplicación del monitoreo."
    fix:
      en: "Ask about her before you show any equipment."
      es: "Pregunte por ella antes de enseñar cualquier equipo."
  - mistake:
      en: "\"Panels add value. Your house will sell faster.\""
      es: "\"Los paneles le suben el valor. La casa se le vende más rápido.\""
    fix:
      en: "You can't promise that. Give her the written terms."
      es: "Eso no lo puede prometer. Déle los términos por escrito."
concepts:
  - name: { en: The pause, es: La pausa }
    idea:
      en: "Wait two seconds before you answer."
      es: "Espere dos segundos antes de contestar."
    items: [SOL-O06-PAUSE]
  - name: { en: '"You''re free to say no"', es: '"Está en libertad de decir que no"' }
    idea:
      en: "Saying it out loud helps her relax."
      es: "Decirlo en voz alta la ayuda a relajarse."
    items: [SOL-O06-NOPRESSURE]
  - name: { en: Where is she in the search?, es: ¿En qué punto de la búsqueda está? }
    idea:
      en: "Starting or comparing? Then ask why now."
      es: "¿Empezando o comparando? Después pregunte por qué ahora."
    items: [SOL-O06-START, SOL-O06-QFIRST]
  - name: { en: The plan behind the visit, es: El plan detrás de la visita }
    idea:
      en: "Answer her plans with written terms, not a promise."
      es: "Conteste sus planes con términos por escrito, no con promesas."
    items: [SOL-O06-HIDDEN, SOL-O06-PLAN]
  - name: { en: A calm next visit, es: Una próxima visita con calma }
    idea:
      en: "A day and a time to read the written terms together."
      es: "Un día y una hora para leer juntos los términos por escrito."
    items: [SOL-O06-NEXT]
sources:
  - T084 "Starting to look" greeting; T031 "You are free to say no"; T002 Clarify with a question; T094 Remove real risk; T014 Firm next step
spanish_reviewed: false
