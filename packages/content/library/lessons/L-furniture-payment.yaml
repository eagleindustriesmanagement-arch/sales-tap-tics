code: L-furniture-payment
scenario: S-furniture-payment-L1
title:
  en: "\"The payment is too high\": get his number, show only real options"
  es: "\"El pago está muy alto\": sáquele su número, enseñe solo opciones reales"
hook:
  en: "His wife already said yes to the sectional. He reads the numbers sheet and says the payment is too high."
  es: "La esposa ya dijo que sí al sectional. Él lee la hoja de números y dice que el pago está muy alto."
tactic:
  en: "Ask what payment he needs. Build to it with real options from the sheet, like a longer term. Say the plan is optional."
  es: "Pregunte qué pago necesita. Llegue a ese número con opciones reales de la hoja, como un plazo más largo. Diga que el plan es opcional."
steps:
  - en: "Pause, then ask: \"What number were you expecting?\""
    es: "Haga una pausa y pregunte: \"¿Qué número tenía en mente?\""
  - en: "Ask if this is the right sectional, apart from the payment."
    es: "Pregunte si este es el sectional que quiere, aparte del pago."
  - en: "Say the protection plan is optional. Show the payment both ways."
    es: "Diga que el plan de protección es opcional. Enseñe el pago de las dos maneras."
  - en: "Build to his number from the sheet: more down, or more months."
    es: "Llegue a su número con la hoja: más inicial, o más meses."
  - en: "Say each payment is an estimate until credit is approved. Set a day and time."
    es: "Diga que cada pago es un estimado hasta que aprueben el crédito. Fije un día y una hora."
what:
  en: "Get his number first. Then work toward it with real options only."
  es: "Primero sáquele su número. Después trabaje hacia ese número, solo con opciones reales."
why:
  en: "He won't say his number first. He is afraid you will build the deal right up to it. Ask for it, use only real numbers, and he will relax."
  es: "Él no va a decir su número primero. Tiene miedo de que usted le arme el negocio justo hasta ahí. Pídaselo, use solo números reales, y se va a relajar."
when:
  en: "Any time a customer on store financing says the payment is too high."
  es: "Cada vez que un cliente con financiamiento de la tienda dice que el pago está muy alto."
when_not:
  en: "Don't quote a payment that isn't on the sheet."
  es: "No dé un pago que no esté en la hoja."
say:
  - en: Help me understand. When you say the payment is too high, what number were you expecting?
    es: Ayúdeme a entender. Cuando dice que el pago está muy alto, ¿qué número tenía en mente?
  - en: Other than the payment, is this the right sectional for your family room?
    es: Aparte del pago, ¿este es el sectional para su family room?
  - en: The protection plan is optional. I'll show you the payment with it and without it.
    es: El plan de protección es opcional. Le enseño el pago con el plan y sin el plan.
  - en: A longer term gets you under your number. It's an estimate until the credit is approved.
    es: Con un plazo más largo, le queda por debajo de su número. Es un estimado hasta que aprueben el crédito.
mistakes:
  - mistake:
      en: "\"That's a great payment. You'll forget about it.\""
      es: "\"Ese es un excelente pago. Después ni se acuerda.\""
    fix:
      en: "It's his budget. Ask for his number."
      es: "Es su presupuesto. Pregúntele su número."
  - mistake:
      en: "Leaving the plan inside the payment without saying so."
      es: "Dejar el plan metido en el pago sin decirlo."
    fix:
      en: "Name it, say it's optional, and show the payment both ways."
      es: "Nómbrelo, diga que es opcional y enseñe el pago de las dos maneras."
  - mistake:
      en: "Cutting the price before you know his number."
      es: "Bajar el precio antes de saber su número."
    fix:
      en: "You may give away money he didn't need."
      es: "Puede regalar dinero que no hacía falta."
concepts:
  - name:
      en: "Pause, then ask his number"
      es: "Pausa, y pídale su número"
    idea:
      en: "Wait two seconds. Then ask what payment he needs."
      es: "Espere dos segundos. Después pregunte qué pago necesita."
    items: [FUR-O03-PAUSE, FUR-O03-QFIRST]
  - name:
      en: "The sectional, apart from the payment"
      es: "El sectional, aparte del pago"
    idea:
      en: "Check that he wants this one."
      es: "Confirme que quiere este."
    items: [FUR-O03-ISOLATE]
  - name:
      en: "The number behind the number"
      es: "El número detrás del número"
    idea:
      en: "His limit has a real reason. Build to it with the sheet."
      es: "Su límite tiene una razón real. Llegue a él con la hoja."
    items: [FUR-O03-HIDDEN]
  - name:
      en: "With and without the plan"
      es: "Con el plan y sin el plan"
    idea:
      en: "The plan is optional. Show the payment both ways."
      es: "El plan es opcional. Enseñe el pago de las dos maneras."
    items: [FUR-O03-PLAN]
  - name: { en: Only real options, es: Solo opciones reales }
    idea:
      en: "More down or more months, from the sheet."
      es: "Más inicial o más meses, de la hoja."
    items: [FUR-O03-OPTIONS]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: "Print the options. Set when he comes back to pick one."
      es: "Imprima las opciones. Fije cuándo vuelve a escoger una."
    items: [FUR-O03-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T005 Isolate; T110 Treat a hard demand as a clue; T121 Two-payment menu; T083 Walk the wheel; T014 Specific next step
spanish_reviewed: false
