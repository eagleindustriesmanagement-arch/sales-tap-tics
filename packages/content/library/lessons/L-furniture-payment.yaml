code: L-furniture-payment
scenario: S-furniture-payment-L1
title:
  en: "\"The payment is too high\": get his number, show only real options"
  es: "\"El pago está muy alto\": sáquele su número, enseñe solo opciones reales"
hook:
  en: His wife already said yes. He reads the numbers sheet and says the payment is too high.
  es: La esposa ya le dio el sí al sectional. Él se sienta en su escritorio, lee la hoja de números y dice que el pago está muy alto.
what:
  en: Don't argue and don't start moving numbers. Ask what he needs. Show only the options on the sheet, call the plan optional, and say when a lower payment takes more months.
  es: No discuta el pago y no empiece a mover números. Pregunte qué necesita. Enseñe solo las opciones de la hoja, diga que el plan es opcional, y cuándo un pago más bajo es a más meses.
why:
  en: A sectional is one more monthly bill next to the car note and the kids' braces. He won't say his number first, afraid you'll build the deal right up to it. Ask, deal only in real numbers, and he relaxes.
  es: Un sectional es una cuenta más al mes, al lado del carro, la luz y los brackets de los niños. Él tiene un número y no lo dice primero, por miedo a que usted le arme el negocio justo hasta ahí. Pídaselo, trabaje solo con números reales, y se relaja.
when:
  en: Any time a customer on store financing says the payment is too high.
  es: Cada vez que un cliente con financiamiento de la tienda dice que el pago está muy alto.
when_not:
  en: Never to stretch the term quietly. Every payment is an estimate until the credit is approved.
  es: Nunca para alargar el plazo calladito. Cada pago es un estimado hasta que aprueben el crédito.
say:
  - en: Help me understand. When you say the payment is too high, what number were you expecting?
    es: Ayúdeme a entender. Cuando dice que el pago está muy alto, ¿qué número tenía en mente?
  - en: Other than the payment, is this the right sectional for your family room?
    es: Aparte del pago, ¿este es el sectional para su family room?
  - en: The protection plan is optional. I'll show you the payment with it and without it.
    es: El plan de protección es opcional. Le enseño el pago con el plan y sin el plan.
  - en: That one is a longer term, so you'd pay longer. It's an estimate until the credit is approved.
    es: Esa es a un plazo más largo, así que estaría pagando más tiempo, y es un estimado hasta que aprueben el crédito.
mistakes:
  - mistake:
      en: '"That''s a great payment. You''ll forget about it."'
      es: '"Ese es un excelente pago. Después ni se acuerda."'
    fix:
      en: He won't forget; it's his budget. Ask for his number.
      es: No se va a olvidar; es su presupuesto. Pregúntele su número.
  - mistake:
      en: Leaving the plan inside the payment without saying it.
      es: Dejar el plan metido en el pago sin decirlo.
    fix:
      en: Name it, call it optional, show the payment both ways.
      es: Nómbrelo, diga que es opcional, enseñe el pago de las dos maneras.
  - mistake:
      en: Reaching his number with a longer term, silently.
      es: Llegar a su número alargando el plazo, calladito.
    fix:
      en: Say the months out loud.
      es: Diga los meses en voz alta.
concepts:
  - name:
      en: "Pause, then ask his number"
      es: "Pausa, y pídale su número"
    idea:
      en: Two seconds, then one question about the payment he needs.
      es: Dos segundos, y una pregunta por el pago que necesita.
    items: [FUR-O03-PAUSE, FUR-O03-QFIRST]
  - name:
      en: "The sectional, apart from the payment"
      es: "El sectional, aparte del pago"
    idea:
      en: Confirm he wants this one, so the payment is the only gap.
      es: Confirme que quiere este, para que el pago sea lo único que falta.
    items: [FUR-O03-ISOLATE]
  - name:
      en: "The number behind the number"
      es: "El número detrás del número"
    idea:
      en: His ceiling protects something real. Once it's out, work toward it honestly.
      es: Su tope cuida algo real. Cuando sale, trabaje hacia él con honestidad.
    items: [FUR-O03-HIDDEN]
  - name:
      en: "With and without the plan"
      es: "Con el plan y sin el plan"
    idea:
      en: Optional means optional. Show the payment both ways, every time.
      es: Opcional es opcional. Enseñe el pago de las dos maneras, siempre.
    items: [FUR-O03-PLAN]
  - name: { en: Only real options, es: Solo opciones reales }
    idea:
      en: Every option comes from the sheet and says its term.
      es: Cada opción sale de la hoja y dice su plazo.
    items: [FUR-O03-OPTIONS]
  - name: { en: Lock a day and time, es: Amarre un día y una hora }
    idea:
      en: Print the options and set when he comes back to pick one.
      es: Imprima las opciones y fije cuándo vuelve a escoger una.
    items: [FUR-O03-NEXT]
sources:
  - T001 Pause and slow down; T002 Clarify with a question; T005 Isolate; T110 Treat a hard demand as a clue; T121 Two-payment menu; T083 Walk the wheel; T014 Specific next step
spanish_reviewed: false
