code: L-homes-price
scenario: S-homes-price-L1
title:
  en: "\"The price is too high\": ask \"compared to what?\""
  es: "\"El precio está muy alto\": pregunte \"¿comparado con qué?\""
hook:
  en: "He likes the house, but says the price is too high. He is comparing it to something."
  es: "Le gusta la casa, pero dice que el precio está muy alto. Lo está comparando con algo."
tactic:
  en: "Don't defend the price or lower it. Ask what he is comparing it to. Then compare both homes the same way."
  es: "No defienda el precio ni lo baje. Pregunte con qué lo está comparando. Después compare las dos casas de la misma manera."
steps:
  - en: "Pause, then ask: \"Compared to what?\""
    es: "Haga una pausa y pregunte: \"¿Comparado con qué?\""
  - en: "Ask if this is the right home for them, apart from the price."
    es: "Pregunte si esta es la casa para ellos, aparte del precio."
  - en: "Compare both: the price, plus what each will need, like a roof or AC."
    es: "Compare las dos: el precio, más lo que cada una va a necesitar, como techo o aire."
  - en: "Have him get insurance quotes for both. Never guess facts about the other house."
    es: "Que saque cotizaciones de seguro para las dos. Nunca adivine datos de la otra casa."
  - en: "Show the builder's real incentive last, in writing. Set a day and time."
    es: "Enseñe al final el incentivo real del builder, por escrito. Fije un día y una hora."
what:
  en: "Compare both homes fairly, on the same terms. Show any real incentive last, in writing."
  es: "Compare las dos casas con justicia, en los mismos términos. Enseñe cualquier incentivo real al final, por escrito."
why:
  en: "Here he is comparing an older house nearby with a lower price. He hasn't asked about its roof, AC or insurance. If you criticize it, you sound afraid of it. Compare it fairly, and he trusts your numbers."
  es: "Aquí la compara con una casa más vieja cerca, con un precio más bajo. Él no ha preguntado por el techo, el aire ni el seguro de esa casa. Si habla mal de ella, parece que le tiene miedo. Si la compara con justicia, él confía en sus números."
when:
  en: "A buyer who likes the home says the price is high."
  es: "Un cliente al que le gusta la casa dice que el precio está alto."
when_not:
  en: "Never make up facts about the other house. Tell him what to ask its seller and his insurance agent."
  es: "Nunca invente datos de la otra casa. Dígale qué preguntarle a ese vendedor y a su agente de seguros."
say:
  - en: I hear you. It's a lot of money. Compared to what? What are you measuring it against?
    es: Lo entiendo. Es mucho dinero. ¿Comparado con qué? ¿Con qué lo está comparando?
  - en: Setting the price aside for a second, is this the right home for you two?
    es: Dejando el precio a un lado un momento, ¿esta es la casa para ustedes dos?
  - en: That's a fair comparison. Let's line them up the same way, price plus what each one will need.
    es: Es una comparación justa. Pongámoslas lado a lado de la misma manera, el precio más lo que cada una va a necesitar.
  - en: Have your insurance agent quote both addresses, and we'll put both houses on one page.
    es: Pídale a su agente de seguros que le cotice las dos direcciones, y ponemos las dos casas en una sola página.
mistakes:
  - mistake:
      en: "\"Honestly, it's a great price.\""
      es: "\"La verdad, es un excelente precio.\""
    fix:
      en: "You argued before you understood. Ask \"Compared to what?\""
      es: "Discutió antes de entender. Pregunte \"¿Comparado con qué?\""
  - mistake:
      en: "Going to your manager for a lower price right away."
      es: "Ir enseguida donde el gerente a pedir un precio más bajo."
    fix:
      en: "You don't know the other house yet. Compare first."
      es: "Todavía no conoce la otra casa. Compare primero."
  - mistake:
      en: "\"Old houses always have problems.\""
      es: "\"Las casas viejas siempre traen problemas.\""
    fix:
      en: "You don't know that house. Give him questions to ask, not your opinion."
      es: "Usted no conoce esa casa. Déle preguntas para hacer, no su opinión."
concepts:
  - name: { en: "Pause, don't argue", es: "Pausa, sin discutir" }
    idea:
      en: "Wait two seconds. Don't defend the price or discount it."
      es: "Espere dos segundos. No defienda el precio ni lo rebaje."
    items: [HOM-O04-PAUSE, HOM-O04-NOARGUE]
  - name: { en: '"Compared to what?"', es: '"¿Comparado con qué?"' }
    idea:
      en: "This question brings out what he is comparing against."
      es: "Esta pregunta saca con qué lo está comparando."
    items: [HOM-O04-QFIRST, HOM-O04-HIDDEN]
  - name: { en: The right house?, es: ¿La casa correcta? }
    idea:
      en: "Check that the home fits them before you talk about money again."
      es: "Confirme que la casa les sirve antes de volver a hablar de dinero."
    items: [HOM-O04-ISOLATE]
  - name: { en: Side by side, es: Lado a lado }
    idea:
      en: "Same terms for both houses, real quotes, and a day to review them."
      es: "Los mismos términos para las dos casas, cotizaciones reales y un día para revisarlas."
    items: [HOM-O04-SIDEBYSIDE, HOM-O04-NEXT]
sources:
  - T001 Pause and slow down; T003 Acknowledge; T017 Sell value before discounting; T005 Isolate; T086 Side-by-side; T028 Counter a low anchor by refocusing; T107 Real deadline on the table; T014 Specific next step
  - Galinsky and Mussweiler (2001) on anchors, via T028
spanish_reviewed: false
