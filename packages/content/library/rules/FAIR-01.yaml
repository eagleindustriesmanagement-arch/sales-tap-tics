code: FAIR-01
family: fairness
severity: critical
description:
  en: Same offer method and pricing regardless of language.
  es: El mismo método de oferta y los mismos precios sin importar el idioma.
explanation:
  en: "The English and Spanish versions do not carry the same numbers. {fact}"
  es: "Las versiones en inglés y en español no tienen los mismos números. {fact}"
check_kind: parity
classifier: false
applies_to: [demonstrator, debrief]
channels: [floor, phone, text]
compliant_technique: T041
parameters:
  compare: [money, percent, clock_time]
  live_sessions: manager_review
legal_basis: "ECOA 15 U.S.C. 1691(a) and Reg B 12 CFR 1002.4(a): no disparate treatment on national origin in any aspect of credit; language used as a proxy counts. Cash-price parity across languages is a house rule. Disparate-impact theories dropped by the CFPB (Reg B, effective July 21, 2026) and the FTC (August 2026)."
attorney_reviewed: false
