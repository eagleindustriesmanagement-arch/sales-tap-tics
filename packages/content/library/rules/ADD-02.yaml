code: ADD-02
family: add_ons
severity: critical
description:
  en: No pre-installed option is described as impossible to remove; the store's removal policy is offered.
  es: Ninguna opción preinstalada se presenta como imposible de quitar; se ofrece la política de la tienda.
explanation:
  en: "A pre-installed item is either optional, so the customer can decline paying for it, or already included in the advertised price. It cannot be charged on top of the price and also be impossible to remove. {fact}"
  es: "Un producto preinstalado o es opcional, y el cliente puede no pagarlo, o ya está incluido en el precio anunciado. No se puede cobrar aparte y a la vez decir que no se puede quitar. {fact}"
check_kind: pattern
classifier: true
applies_to: [rep, demonstrator, debrief]
channels: [floor, phone, text]
compliant_technique: T120
parameters:
  negation_breaks: false
  attribution_breaks: true
  patterns:
    en:
      - '\b(can''?t|cannot|can not|no way to|unable to|won''?t)\b.{0,15}\b(be )?(remove|removed|take (it|them|that) off|taken off|come off|pull (it|that) off)\b'
      - '\b(comes with|is on) (the car|it|every car|all of them)\b.{0,30}\b(no way around|you have to (pay|take|keep))'
      - '\b(it''?s|it is|they''?re|they are) (already )?(installed|on (the car|there))\b.{0,30}\b(so )?you (have|need) to (pay|keep|take)'
      - '\bnon-?removable\b'
    es:
      - '\bno se (le )?(puede|pueden) (quitar|sacar|remover)\b'
      - '\b(ya )?viene (instalad[oa]|con el carro)\b.{0,30}\b(tiene que|hay que) (pagarlo|pagarla|pagar|llevarlo|quedarse)'
      - '\bno hay (manera|forma) de (quitar|sacar)'
      - '\b(es|está) instalad[oa],? (así que )?(tiene|hay) que pagar'
  fact_by_policy:
    credit_price:
      en: "Store policy: if the customer does not want it, the store credits its price."
      es: "Política de la tienda: si el cliente no lo quiere, la tienda le acredita el precio."
    show_alternative:
      en: "Store policy: if the customer does not want it, the store shows the same model without it."
      es: "Política de la tienda: si el cliente no lo quiere, la tienda le muestra el mismo modelo sin eso."
    none_configured:
      en: "The store has not set its policy for pre-installed items. Do not say the item cannot be removed. Offer to find a solution with the manager."
      es: "La tienda todavía no ha definido su política para los productos preinstalados. No diga que no se puede quitar. Ofrezca buscar una solución con el gerente."
legal_basis: "FTC Automobile Industry Pricing Transparency FAQs (Sept 15, 2026): no implying an installed option cannot be removed while charging for it; a non-removable item belongs in the advertised price. Requires store policy (spec 3.4)."
attorney_reviewed: false
