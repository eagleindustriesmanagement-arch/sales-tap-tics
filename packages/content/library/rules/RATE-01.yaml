code: RATE-01
family: rate_and_approval
severity: critical
description:
  en: Rates, payments and approvals match the scenario facts; no spot delivery on an approval that has not happened.
  es: Las tasas, los pagos y las aprobaciones coinciden con los datos del escenario; no se entrega el carro con una aprobación que no existe.
explanation:
  en: "That rate, payment or approval does not match the facts. {fact}"
  es: "Esa tasa, pago o aprobación no coincide con los datos. {fact}"
check_kind: rate_compare
classifier: true
applies_to: [rep, demonstrator, debrief]
channels: [floor, phone, text]
compliant_technique: T070
parameters:
  tolerance_cents: 100
  tolerance_bps: 0
  negation_breaks: true
  attribution_breaks: true
  rate_cues:
    en: ['apr', 'rate', 'interest']
    es: ['apr', 'tasa', 'interés']
  # Interest promised away in words (industry packs: store financing). A plain disclosure of deferred interest
  # ("if you don't pay it off, the interest comes back") is not one of these.
  zero_rate_claims:
    en:
      - '\b(no|zero) interest\b'
      - '\binterest[- ]free\b'
      - '\bsame as cash\b'
      # "0% financing this month": a 0% rate said with financing, not with an APR or rate cue.
      - '(?<![\d.,])(0|zero) ?(%|percent)( apr)? (financing|interest|financed|loans?)\b'
      - '\b(financing|financed|interest|loans?) (at|of|for) (0|zero) ?(%|percent)(?![\d.,])'
    es:
      - '\bsin intereses?\b'
      - '\bcero (de )?inter[eé]s(es)?\b'
      - '\bigual que (de )?contado\b'
      - '\b(financiamiento|financiación|financiado|financiada|préstamo|crédito)( de| al| a| en| con)? (0|cero) ?(%|por ciento)(?![\d.,])'
      - '(?<![\d.,])(0|cero) ?(%|por ciento) de (financiamiento|financiación|interés|intereses)\b'
      - '\bno (paga|le cobran|le cobramos) inter[eé]s(es)?\b'
  approval_claims:
    en:
      - '\byou(''re| are)( already| pre)?[- ]?approved\b'
      - '\byou (got|have been|were) approved\b'
      - '\b(the bank|they|the lender) (approved|approves) you\b'
      - '\byour (approval|loan) (is|came) (in|through|done)\b'
      - '\btake it home (tonight|today)\b.{0,40}\b(bank|approval|financ\w*)\b.{0,30}\b(later|tomorrow|monday|next week)\b'
      # A promise of a future approval is still an approval claim (industry packs: "the lender will approve you").
      - '\b(the bank|they|the lender|the finance company)( will|''ll| are going to| is going to)( definitely| for sure| easy)? approve you\b'
      - '\byou(''ll| will| are going to|''re going to)( definitely| for sure| easy)? (get|be) approved\b'
      - '\b(approval|getting approved|the approval) (is|will be) (guaranteed|a sure thing|no problem|not a problem)\b'
    es:
      - '\b(ya )?(está|esta|quedó) aprobad[oa]\b'
      - '\b(ya )?lo aprobaron\b'
      - '\bel banco (ya )?(lo|la) aprob[óo]\b'
      - '\bya salió (la|su) aprobación\b'
      - '\bllévese(lo|la)? hoy\b.{0,40}\b(banco|aprobación)\b.{0,30}\b(después|mañana|el lunes)\b'
      - '\b(lo|la|le|los) (van|va) a aprobar\b'
      - '\b(va|van) a salir aprobad[oa]s?\b'
      - '\bla aprobación (es segura|está garantizada|no es problema)\b'
legal_basis: Agreed rule (spec 4.2); FTC dealer enforcement
attorney_reviewed: false
