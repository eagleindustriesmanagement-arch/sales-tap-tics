    params: { rules: [ADD-01], topic: add_on }
  - code: FIN-SC
    behavior:
      en: "Described the service contract as optional and cancellable within 60 days"
      es: "Presentó el contrato de servicio como opcional y cancelable dentro de 60 días"
    dimension: technique
    method: rule
    points: 1
    evidence: Florida s. 634.121
    technique: T074
    params: { rules: [ADD-04], topic: add_on }
  - code: FIN-SETUP
    behavior:
      en: "Set up the finance visit"
      es: "Preparó la visita a financiamiento"
    dimension: outcome
    method: judge
    points: 1
    evidence: Practitioner tradition (T049)
    technique: T049
