code: P-own-bank-price
name_pool:
  en: [Mike, Steve, Ray, Tony]
  es: [Rolando, Héctor, Reinaldo, Pedro]
age_range: 45-54
temperament: [skeptical]
temperament_note:
  en: Skeptical and blunt. Asks one direct question and watches how you answer it. A dodge tells him everything; a straight answer earns a little trust.
  es: Desconfiado y directo. Hace una sola pregunta clara y se fija en cómo usted la contesta. Si le da la vuelta, ya sabe todo lo que necesita; una respuesta directa le gana un poco de confianza.
buyer_orientation: task
situation:
  en: Late 40s, runs a small landscaping company in Homestead and needs a work truck. Good credit, no trade. Just drove the 2026 Silverado 1500 LT and saw the all-in price on the numbers sheet. He has not said how he plans to pay.
  es: De unos 48 años, tiene una pequeña compañía de jardinería en Homestead y necesita una camioneta de trabajo. Buen crédito, sin trade-in. Acaba de manejar la Silverado 1500 LT 2026 y vio el precio total en la hoja de números. No ha dicho cómo piensa pagar.
stated_objection: O21
stated_line:
  en: That price only works if I finance with you, right?
  es: Ese precio es solo si financio con ustedes, ¿verdad?
hidden_truth:
  en: His bank already pre-approved him, and the letter is on his phone. Last month at another store, the price went up $2,000 the moment he said he would use his own bank, so he keeps the approval to himself here.
  es: Su banco ya lo pre-aprobó, y tiene la carta en el teléfono. El mes pasado, en otro dealer, el precio subió $2,000 en cuanto dijo que iba a usar su propio banco, así que aquí se guarda la aprobación.
# Phrases that would give the bank approval and the other store's price jump away before an unlock.
hidden_truth_markers:
  en:
    - '\bpre-?approv'
    - '\b(approval|approved) letter\b'
    - '\bmy (own )?bank\b'
    - '\$\s?2,?000\b'
    - '\btwo (thousand|grand)\b'
    - '\b(price|it) went up\b'
  es:
    - '\bpre-?aprob'
    - '\bcarta de aprobación\b'
    - '\bmi (propio )?banco\b'
    - '\$\s?2,?000\b'
    - '\bdos mil\b'
    - '\b(el precio )?(subió|me lo subieron)\b'
unlock_conditions:
  - code: asks_how_paying
    description:
      en: Asks how he plans to pay, or whether he already has financing lined up.
      es: Pregunta cómo piensa pagar, o si ya tiene financiamiento resuelto.
    cues:
      en:
        - '\bhow\b.{0,25}\b(plan|planning|thinking of|hoping|want|like|going) (to pay|on paying)\b'
        - '\b(do|did) you (already )?have (financing|a loan|an approval|a bank|your own)\b'
        - '\bfinancing (lined up|already|in place)\b'
      es:
        - '\bcómo\b.{0,25}\b(piensa|pensaba|quiere|quisiera|le gustaría|va a) pagar(lo|la)?\b'
        - '\b(ya )?tiene (financiamiento|un préstamo|una aprobación|su propio banco|banco)\b'
        - '\bfinanciamiento (ya )?(listo|resuelto|aprobado)\b'
  - code: asks_what_happened
    description:
      en: Asks what happened before, or what made him ask.
      es: Pregunta qué le pasó antes, o qué le hizo preguntar eso.
    cues:
      en:
        - '\bwhat (happened|made you (think|ask)|makes you (think|ask))\b'
        - '\b(did|has) (that|this|something like that) happen(ed)?\b'
        - '\bwhere did you (hear|get) that\b'
      es:
        - '\bqué (le )?(pasó|hizo pensar|hace pensar)\b'
        - '\bpor qué (lo )?pregunta\b'
        - '\b(le )?(pasó|ha pasado) (eso|esto|algo así)\b'
        - '\bdónde (le dijeron|escuchó|oyó) eso\b'
walk_out_triggers:
  - code: dodges_financing_question
    description:
      en: Dodges whether the price holds with his own financing ("don't worry about financing yet", "finance will go over that").
      es: Le da la vuelta a si el precio se mantiene con su propio financiamiento ("no se preocupe por el financiamiento", "eso lo ven en financiamiento").
    cues:
      en:
        - '\b(don''?t|let''?s not) worry about (the )?financing\b'
        - '\bwe''?ll (talk about|get to|deal with) (that|financing|it) (in finance|later)\b'
        - '\b(finance|the finance office) will (go over|explain|handle) (that|it|everything)\b'
      es:
        - '\bno se preocupe por el financiamiento\b'
        - '\beso lo (ve|habla|hablamos|vemos) (en financiamiento|después|luego)\b'
        - '\ben financiamiento (se lo|le) explican\b'
  - code: ties_price_to_financing
    description:
      en: Says or hints that the price depends on financing with the store.
      es: Dice o da a entender que el precio depende de financiar con la tienda.
    cues:
      en:
        - '\b(only|just)\b.{0,40}\bif you finance with us\b'
        - '\b(price|deal|discount)\b.{0,30}\b(is|comes) with (our|dealer) financing\b'
        - '\byou (have|need|got) to (finance|go) (with|through) us\b'
      es:
        - '\b(solo|nada más)\b.{0,40}\bsi financia con nosotros\b'
        - '\b(precio|oferta|descuento)\b.{0,30}\bcon nuestro financiamiento\b'
        - '\btiene que financiar con nosotros\b'
  - code: fake_today_price
    description:
      en: Makes up a today-only price or deadline.
      es: Inventa un precio o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(price|deal)\b.{0,20}\b(goes up|won''?t be (here|there)|is gone) tomorrow\b', '\bif you (leave|walk)\b.{0,40}\b(price|deal|offer)\b.{0,20}\b(gone|go away|disappear)']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube)\b', '\bsi se va\b.{0,40}\b(precio|oferta)\b.{0,20}\b(se pierde|ya no|desaparece)']
  - code: third_push
    description:
      en: Pushes for a decision a third time after two refusals.
      es: Insiste por tercera vez después de dos negativas.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(do it|write it up|get it done)\b', '\bsign (it )?(today|now|tonight)\b', '\bwhat (will|would) it take\b', '\btake it home (today|tonight)\b', '\bwhy not (today|now)\b']
      es: ['\bhagámoslo (hoy|ahora|ya)\b', '\bfirme (hoy|ahora|ya)\b', '\bqué (tengo|hace falta) (que hacer )?para que\b.{0,20}\bhoy\b', '\bllévese(lo|la)? hoy\b', '\bpor qué no (hoy|ahora)\b']
win_condition:
  description:
    en: His bank approval and the other store's price jump come out, plus a firm day and time to bring the letter and sign at the same price.
    es: Salen a la luz la aprobación de su banco y lo que le subieron en el otro dealer, más un día y una hora firmes para traer la carta y firmar al mismo precio.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: en
  mixes_when_rep_mixes: true
  everyday_terms: ["el dealer", "cash", "la troca"]
register: usted
voice_ids:
  en: tbd-en-us-male-40s
  es: tbd-es-miami-cuban-male-40s
difficulty: 1
variation:
  moods: [sunburned from a job site, checking the time, has his phone in his hand]
  amount_ranges: {}
offline_lines:
  deflect:
    - { en: "I've heard that one before. Does the price hold or not?", es: "Eso ya lo he oído. ¿El precio se mantiene o no?" }
    - { en: "Every store has a catch. What's yours?", es: "Todos los dealers tienen su truco. ¿Cuál es el de ustedes?" }
    - { en: "I just want a straight answer on the price.", es: "Yo nada más quiero una respuesta clara sobre el precio." }
  hint: { en: "Okay. I asked because I've been down this road before.", es: "Bueno. Le pregunto porque ya pasé por esto antes." }
  after_hint: { en: "The truck is exactly what I need for the business. That's not the issue.", es: "La camioneta es justo lo que necesito para el negocio. Ese no es el problema." }
  reveal: { en: "My bank already pre-approved me. The letter's on my phone. Last month at another store, the price went up $2,000 the second I said I'd use my own bank, so I didn't want to say it here.", es: "Mi banco ya me pre-aprobó. Tengo la carta en el teléfono. El mes pasado, en otro dealer, el precio subió $2,000 en cuanto dije que iba a usar mi propio banco, así que aquí no lo quería decir." }
  after_reveal:
    - { en: "That's all I wanted to hear. In writing is what matters.", es: "Eso es todo lo que quería oír. Lo que importa es que esté por escrito." }
    - { en: "If the number holds on paper, I'm ready to buy.", es: "Si el número se mantiene en el papel, estoy listo para comprar." }
  agree_next_step: { en: "That works. I'll bring the letter.", es: "Me sirve. Traigo la carta." }
  not_now: { en: "Not today. I'll keep looking.", es: "Hoy no. Voy a seguir buscando." }
  walk_away: { en: "Same game as everywhere else. I'm leaving.", es: "El mismo juego de todos lados. Me voy." }
  goodbye: { en: "Thanks.", es: "Gracias." }
  react_to_pressure: { en: "That's not an answer. Does the price hold or not?", es: "Eso no es una respuesta. ¿El precio se mantiene o no?" }
spanish_reviewed: false
