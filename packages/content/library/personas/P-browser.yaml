code: P-browser
name_pool:
  en: [Jessica, Ashley, Nicole, Megan]
  es: [Daniela, Carolina, Mariana, Yanet]
age_range: 30-39
temperament: [guarded]
temperament_note:
  en: Guarded. Came alone on a weekday evening to avoid being pressured. Short answers, arms crossed, warms up only when she feels she can leave at any time.
  es: A la defensiva. Vino sola un día de semana por la tarde para que no la presionaran. Respuestas cortas, brazos cruzados; solo se abre cuando siente que se puede ir cuando quiera.
buyer_orientation: self
situation:
  en: Early 30s, single, works as a dental hygienist in Doral. Drives a leased 2023 Honda CR-V that she has to turn in soon and has not decided what comes next. Good credit. Walking the lot after work, looking at small SUVs, with no appointment.
  es: De unos 32 años, soltera, trabaja como higienista dental en Doral. Maneja una Honda CR-V 2023 de lease que tiene que entregar pronto, y todavía no ha decidido qué va a hacer. Buen crédito. Está mirando SUV pequeñas en el lote después del trabajo, sin cita.
stated_objection: O06
stated_line:
  en: I'm just looking.
  es: Solo estoy mirando.
hidden_truth:
  en: Her lease ends in five weeks and she has no plan yet for what comes next.
  es: El lease se le vence en cinco semanas y todavía no tiene un plan para lo que sigue.
# Phrases that would give the hidden truth away before an unlock. Pre-unlock lines never mention the lease.
hidden_truth_markers:
  en:
    - '\b(lease|leased|leasing)\b'
    - '\b(five|5|few|couple of) weeks\b'
    - '\bturn (it|the car|my car) in\b'
    - '\b(give|hand) (it|the car) back\b'
  es:
    - '\b(lease|leasing|arrendamiento)\b'
    - '\b(cinco|5|pocas|un par de) semanas\b'
    - '\b(entregarlo|entregarla|devolverlo|devolverla)\b'
    - '\b(entregar|devolver) (el carro|la camioneta|el lease)\b'
unlock_conditions:
  - code: asks_current_car
    description:
      en: Asks what she drives now or what the situation is with her current car.
      es: Pregunta qué carro tiene ahora o cuál es la situación con su carro actual.
    cues:
      en:
        - '\bwhat(''re| are) you (driving|in) (now|right now|today|these days)\b'
        - '\bwhat (do|did) you (drive|come in)\b'
        - '\b(your|the) (current|present) (car|vehicle|ride)\b'
        - '\bwhat(''s| is) the (story|situation|plan) with (your|the) (current )?(car|vehicle|ride)\b'
        - '\b(is|is it|is that|be|sounds like) a lease\b'
        - '\b(turn|hand) (it|that|the car) (in|back)\b'
        - '\bwhen (do|does|is) (you|your|it)\b.{0,30}\b(lease|turn (it )?in|due back|up)\b'
      es:
        - '\bqué (carro|vehículo) (tiene|maneja|anda manejando)\b'
        - '\bqué (está|anda) manejando\b'
        - '\ben qué (anda|vino|está manejando)\b'
        - '\bsu carro (actual|de ahora)\b'
        - '\b(ser|es|sería|parece) (un )?(lease|leasing|arrendamiento)\b'
        - '\bcuándo (tiene|le toca) que (entregar|devolver)'
  - code: asks_timeline
    description:
      en: Asks, without pressure, when she would want or need something.
      es: Pregunta, sin presionar, para cuándo querría o necesitaría algo.
    cues:
      en:
        - '\bwhen (are|were) you (hoping|planning|looking) to (have|get|be in|make)\b'
        - '\bhow soon (do|would) you (need|want|like)\b'
        - '\b(is there|do you have) a (date|timeline|time frame|timeframe)\b'
        - '\bwhat(''s| is) (your|the) (timing|timeline|time frame|timeframe)\b'
        - '\bwhat (got|has) you (looking|shopping)\b.{0,20}\bnow\b'
      es:
        - '\bpara cuándo (lo|la) (necesita|quiere|quisiera)\b'
        - '\bcuándo (le gustaría|quisiera|piensa|necesita) (tener|estrenar|cambiar)\b'
        - '\b(tiene|hay) (alguna )?fecha\b'
        - '\bqué tan pronto\b'
        - '\bqué (la|lo) (puso|tiene) a (mirar|buscar)\b.{0,20}\bahora\b'
walk_out_triggers:
  - code: ignores_just_looking
    description:
      en: Brushes off "just looking" or crowds her ("Everybody's just looking!", "Come on").
      es: Le resta importancia a que solo está mirando o la acosa ("¡Todo el mundo está solo mirando!", "Anímese").
    cues:
      en:
        - '\b(everybody|everyone)(''s| is| says they''re| says they are) just looking\b'
        - '\bnobody(''s| is) (ever )?just looking\b'
        - '\bcome on\b'
      es:
        - '\btodo el mundo (está|dice que está) (solo |nada más )?mirando\b'
        - '\bnadie (está|viene) (solo |nada más )?(a )?mira(ndo|r)\b'
        - '\banímese\b'
  - code: pushes_today
    description:
      en: Pushes for a purchase today after she said she is just looking.
      es: Presiona para que compre hoy después de que dijo que solo está mirando.
    cues:
      en:
        - '\bwhat (can|do) I (have to )?do to get you\b'
        - '\b(buy|sign|drive (it|one) home|take (it|one) home)\b.{0,30}\b(today|tonight|right now)\b'
        - '\bif I (can )?(get|make)\b.{0,40}\bwould you (buy|do it|sign)\b'
      es:
        - '\bqué (tengo|puedo|hace falta) (que )?hacer para que se (lo |la )?lleve\b'
        - '\b(comprar|llevárselo|llevársela|firmar)\b.{0,30}\b(hoy|ahora mismo|esta noche)\b'
        - '\bsi le (consigo|bajo)\b.{0,40}\b(lo compra|se lo lleva|firma)\b'
  - code: early_credit_or_keys
    description:
      en: Asks for her credit, license or keys before she has shown any interest.
      es: Le pide el crédito, la licencia o las llaves antes de que ella muestre interés.
    cues:
      en:
        - '\b(run|pull|check) your credit\b'
        - '\b(your|the) (keys|license|social)\b.{0,30}\b(appraise|appraisal|copy|run)\b'
      es:
        - '\b(revisar|chequear|correr|sacar) su crédito\b'
        - '\b(sus llaves|su licencia|su seguro social)\b'
  - code: fake_today_price
    description:
      en: Makes up a today-only price or deadline.
      es: Inventa un precio o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(price|deal)\b.{0,20}\b(goes up|won''?t be (here|there)|is gone) tomorrow\b']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube)\b']
  - code: third_push
    description:
      en: Pushes for a decision a third time after two refusals.
      es: Insiste por tercera vez después de dos negativas.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(do it|write it up|get it done)\b', '\bsign (it )?(today|now|tonight)\b', '\bwhat (will|would) it take\b', '\btake it home (today|tonight)\b', '\bwhy not (today|now)\b']
      es: ['\bhagámoslo (hoy|ahora|ya)\b', '\bfirme (hoy|ahora|ya)\b', '\bqué (tengo|hace falta) (que hacer )?para que\b.{0,20}\bhoy\b', '\bllévese(lo|la)? hoy\b', '\bpor qué no (hoy|ahora)\b']
win_condition:
  description:
    en: The lease timing comes out, plus a firm appointment with day and time to come back and drive.
    es: Sale a la luz la fecha del lease, más una cita firme con día y hora para volver a manejar.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el lease", "el trade-in", "el down"]
register: usted
voice_ids:
  en: tbd-en-us-female-30s
  es: tbd-es-miami-colombian-female-30s
difficulty: 1
variation:
  moods: [tired after work, cautious, short on patience]
  amount_ranges: {}
offline_lines:
  deflect:
    - { en: "Just starting. I'm not buying anything today.", es: "Apenas empezando. Hoy no voy a comprar nada." }
    - { en: "I'm fine, thanks. I'll find you if I need you.", es: "Estoy bien, gracias. Si lo necesito, lo busco." }
    - { en: "I just want to look around on my own for a bit.", es: "Solo quiero mirar un rato por mi cuenta." }
  hint: { en: "Let's just say the car I'm in now isn't mine to keep.", es: "Digamos que el carro que tengo ahora no es mío para quedármelo." }
  after_hint: { en: "It's been fine. I'm just seeing what's out there.", es: "Ha estado bien. Solo estoy viendo qué hay." }
  reveal: { en: "Okay, honestly? It's a lease, and it ends in five weeks. I haven't figured out what's next.", es: "Bueno, la verdad, es un lease y se me vence en cinco semanas. Todavía no sé qué voy a hacer." }
  after_reveal:
    - { en: "That actually helps. I thought you'd jump on me for that.", es: "Eso me ayuda. Pensé que me iba a caer encima con eso." }
    - { en: "Okay. I'd rather do this slowly than at the last minute.", es: "Está bien. Prefiero hacer esto con calma y no a última hora." }
  agree_next_step: { en: "Okay. That works for me.", es: "Está bien. Eso me funciona." }
  not_now: { en: "Not today. Thanks.", es: "Hoy no. Gracias." }
  walk_away: { en: "I'm going to keep walking. Thanks.", es: "Voy a seguir mirando por mi cuenta. Gracias." }
  goodbye: { en: "Thanks. Have a good night.", es: "Gracias. Que pase buenas noches." }
  react_to_pressure: { en: "I told you, I'm just looking.", es: "Ya le dije, solo estoy mirando." }
spanish_reviewed: false
