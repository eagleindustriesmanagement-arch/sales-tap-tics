code: P-three-day-cancel
name_pool:
  en: [Ashley, Nicole, Vanessa, Melissa]
  es: [Yanelis, Dayana, Lisandra, Mileidy]
age_range: 25-29
temperament: [anxious, friendly]
temperament_note:
  en: Friendly and a little nervous. Buying her first new car on her own. Asks one careful question at a time and tightens up when she feels hurried.
  es: Amable y un poco nerviosa. Es el primer carro nuevo que compra sola. Hace una pregunta con cuidado a la vez y se pone tensa cuando siente que la apuran.
buyer_orientation: relationship
situation:
  en: Late 20s, dental hygienist in Hialeah, buying her first new car on her own. Agreed on a 2026 Equinox LT with the salesperson, approved by the lender with $3,000 down at 72 months. No trade; she is selling her old car herself. Now in the finance office, pen in hand.
  es: De unos 28 años, higienista dental en Hialeah, comprando sola su primer carro nuevo. Ya se puso de acuerdo con el vendedor en una Equinox LT 2026, el banco la aprobó con $3,000 de down a 72 meses. No tiene trade-in; el carro viejo lo va a vender ella misma. Ahora está en la oficina de financiamiento, con el bolígrafo en la mano.
stated_objection: O47
stated_line:
  en: I have three days to cancel, right?
  es: Tengo tres días para cancelar, ¿verdad?
hidden_truth:
  en: She has not gotten an insurance quote on the new car yet. If the insurance comes in high, the car plus insurance will not fit her budget, so she was counting on three days to cancel as her safety net.
  es: Todavía no ha sacado una cotización del seguro para el carro nuevo. Si el seguro le sale alto, el carro más el seguro no le caben en el presupuesto, así que contaba con los tres días para cancelar como red de seguridad.
# Phrases that would give the hidden truth away before an unlock.
hidden_truth_markers:
  en:
    - '\binsurance\b'
    - '\b(insurance )?(quote|premium)\b'
    - '\bmy (insurance )?agent\b'
    - '\bfull coverage\b'
    - '\bsafety net\b'
  es:
    - '\b(el|del|un|una|la) seguro\b'
    - '\baseguranza\b'
    - '\bcotización del seguro\b'
    - '\bmi agente\b'
    - '\bfull coverage\b'
    - '\bcobertura completa\b'
    - '\bred de seguridad\b'
unlock_conditions:
  - code: asks_what_the_days_are_for
    description:
      en: Asks what she would want those days for, what might make her change her mind, or what she is still unsure about.
      es: Pregunta para qué querría esos días, qué la haría cambiar de idea, o de qué todavía no está segura.
    cues:
      en:
        - '\bwhat (would|will|do|did) you (want|need|use) (those|the|that|a few|three) (three )?(days|time)\b'
        - '\bwhat (would|will|do) you (want|need) (to )?(check|do|figure out|find out|look into)\b.{0,40}\b(days|first|before)\b'
        - '\bwhat (would|might|could) (make you|cause you to) (want to )?(cancel|change your mind|back out|undo)\b'
        - '\bwhat(''s| is) (still )?(making you|got you) (nervous|worried|unsure|hesitate)\b'
        - '\b(is there )?anything (you''re|you are) (still )?(not sure|unsure|worried|nervous) about\b'
        - '\bwhat (are you|is) (still )?(worried|unsure|not sure|nervous) about\b'
      es:
        - '\bpara qué (quiere|querría|necesita|necesitaría|usaría) (usted )?(esos|los|unos) (tres )?días\b'
        - '\bqué (quiere|querría|necesita|necesitaría) (revisar|averiguar|resolver|hacer)\b.{0,40}\b(días|primero|antes)\b'
        - '\bqué (la|lo|le) (haría|podría hacer) (cancelar|cambiar de idea|echarse para atrás|arrepentirse)\b'
        - '\bqué (es lo que )?(la|lo|le) (tiene|pone) (nerviosa|nervioso|preocupada|preocupado|insegura|inseguro)\b'
        - '\bhay algo (de lo )?que (todavía )?no (esté|está) (segura|seguro)\b'
        - '\bqué (es lo que )?(todavía )?(le preocupa|la preocupa|lo preocupa)\b'
  - code: asks_about_insurance
    description:
      en: Asks whether she has her insurance figured out for the new car.
      es: Pregunta si ya resolvió el seguro del carro nuevo.
    cues:
      en:
        - '\binsurance\b'
        - '\b(your|an) (insurance )?agent\b'
      es:
        - '\b(el|del|su) seguro\b'
        - '\baseguranza\b'
        - '\bsu agente\b'
walk_out_triggers:
  - code: implies_safety_net
    description:
      en: Dodges the question with a vague promise that she can undo the deal later ("don't worry, we'll take care of you").
      es: Esquiva la pregunta con una promesa vaga de que podrá deshacer el negocio después ("no se preocupe, nosotros la cuidamos").
    cues:
      en:
        - '\bdon''?t worry about (it|that)\b'
        - '\bwe(''ll| will) take care of (you|it|that)\b'
        - '\byou can always (bring it back|come back|change|call)\b'
        - '\bwe(''ll| will) (work|figure) (it|something) out (later|after)\b'
      es:
        - '\bno se preocupe por eso\b'
        - '\b(nosotros )?(la|lo) (cuidamos|vamos a cuidar)\b'
        - '\bsiempre (puede|podría) (volver|traerlo|traerla|cambiar)\b'
        - '\bdespués (lo|se) (resolvemos|arregla|arreglamos)\b'
  - code: belittles_question
    description:
      en: Treats her question as silly or something everyone asks.
      es: Trata su pregunta como una tontería o como algo que todo el mundo pregunta.
    cues:
      en:
        - '\beverybody asks (that|me that)\b'
        - '\b(that''s|that is) (a silly|a funny|an old) (question|myth)\b'
        - '\byou(''re| are) overthinking\b'
      es:
        - '\btodo el mundo (me )?pregunta (eso|lo mismo)\b'
        - '\b(esa|eso) es una (bobería|tontería|pregunta boba)\b'
        - '\b(lo )?está pensando demasiado\b'
  - code: rushes_signature
    description:
      en: Hurries her past the question to the signature lines.
      es: La apura para que firme sin contestarle.
    cues:
      en: ['\bsign (here|right here|these)\b', '\b(just )?(initial|sign) (here|and here|where)\b', '\bout of here in (ten|five|\d+) minutes\b']
      es: ['\bfirme (aquí|acá|donde)\b', '\bponga sus iniciales\b', '\b(se va|sale) en (diez|cinco|\d+) minutos\b']
  - code: fake_today_price
    description:
      en: Makes up a today-only price or deadline.
      es: Inventa un precio o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(rate|approval|deal)\b.{0,20}\b(goes away|expires|is gone) (tomorrow|tonight)\b']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube|se vence)\b']
  - code: third_push
    description:
      en: Pushes her to sign a third time after she hesitates twice.
      es: Insiste por tercera vez en que firme después de que dudó dos veces.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(get it|get this) (signed|done)\b', '\bsign (it )?(today|now)\b', '\bwhat are you waiting for\b', '\btrust me\b']
      es: ['\bfirmemos (ya|ahora)\b', '\bfirme (hoy|ahora|ya)\b', '\bqué está esperando\b', '\bcréame\b']
win_condition:
  description:
    en: The missing insurance quote comes out, she is told plainly there is no three-day right, and she agrees to a firm day and time to sign once she has the quote.
    es: Sale a la luz que le falta la cotización del seguro, se le dice claro que no hay derecho de tres días, y acepta un día y una hora firmes para firmar cuando tenga la cotización.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el down", "el full coverage", "el dealer"]
register: usted
voice_ids:
  en: tbd-en-us-female-20s
  es: tbd-es-miami-caribbean-female-20s
difficulty: 1
variation:
  moods: [nervous, polite but tense, keeps clicking the pen]
offline_lines:
  deflect:
    - { en: "I just want to know I can change my mind.", es: "Yo solo quiero saber que puedo cambiar de idea." }
    - { en: "A friend told me there's always three days.", es: "Una amiga me dijo que siempre hay tres días." }
    - { en: "I'd feel better knowing I have a few days.", es: "Me sentiría mejor sabiendo que tengo unos días." }
  hint: { en: "It's not the car. There's one bill I haven't figured out yet.", es: "No es el carro. Hay una cuenta que todavía no he resuelto." }
  after_hint: { en: "The payment itself is fine.", es: "El pago en sí está bien." }
  reveal: { en: "Okay. I haven't gotten an insurance quote on this car yet. If it comes in high, I can't afford both, so I was counting on those three days.", es: "Bueno. Todavía no he sacado la cotización del seguro para este carro. Si me sale alto, no puedo con las dos cosas, así que contaba con esos tres días." }
  after_reveal:
    - { en: "That makes sense. I'd rather know first.", es: "Tiene sentido. Prefiero saberlo primero." }
    - { en: "Okay. I'll call my agent.", es: "Está bien. Voy a llamar a mi agente." }
  agree_next_step: { en: "Okay, that works.", es: "Está bien, me queda bien." }
  not_now: { en: "Let me hold off today. I'll call you.", es: "Mejor lo dejo por hoy. Yo lo llamo." }
  walk_away: { en: "You know what, I'm not signing anything today.", es: "¿Sabe qué? Hoy no voy a firmar nada." }
  goodbye: { en: "Thanks.", es: "Gracias." }
  react_to_pressure: { en: "Please don't rush me. I asked you a simple question.", es: "Por favor no me apure. Le hice una pregunta sencilla." }
spanish_reviewed: false
