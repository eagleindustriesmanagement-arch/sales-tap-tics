code: P-no-extras
name_pool:
  en: [Carlos, Daniel, Mario, Steven]
  es: [Ramón, Alexis, Yunior, Osvaldo]
age_range: 30-39
temperament: [guarded, skeptical]
temperament_note:
  en: Arms crossed, short answers. Expects to be sold in the finance office; relaxes when nothing is pushed and every number has a label.
  es: Brazos cruzados, respuestas cortas. Espera que le vendan cosas en la oficina de financiamiento; se relaja cuando no le empujan nada y cada número tiene su nombre.
buyer_orientation: task
situation:
  en: Early 30s. Agreed on a 2026 Blazer LT with the salesperson, approved by the lender, putting $1,000 down. Now sitting down in the finance office.
  es: De unos 32 años. Ya se puso de acuerdo con el vendedor en una Blazer LT 2026, el banco lo aprobó, y da $1,000 de inicial. Ahora está sentado en la oficina de financiamiento.
stated_objection: O46
stated_line:
  en: I do not want any extras in finance.
  es: No quiero ningún extra en financiamiento.
hidden_truth:
  en: On his last car a $2,800 warranty ended up in his payment without anyone asking him, so he swore off extras. But he is putting only $1,000 down, and he would consider GAP if it is shown honestly, with its own price.
  es: En su último carro le metieron una garantía de $2,800 en el pago sin preguntarle, así que juró no comprar más extras. Pero solo está dando $1,000 de inicial, y consideraría el GAP si se lo enseñan con honestidad, con su propio precio.
# Phrases that would give the hidden truth away before an unlock.
hidden_truth_markers:
  en:
    - '\b(last|previous|old|other) (car|deal|truck)\b.{0,60}\b(warranty|extras?|added|payment)\b'
    - '\bnobody (asked|told|explained)\b'
    - '\b(snuck|slipped|buried|stuck) (it )?(in|into)\b'
    - '\b(wondered|thinking|thought|think) about (the )?gap\b'
    - '\bonly putting\b'
    - '\bin my payment\b'
  es:
    - '\b(último|otro|anterior|viejo) carro\b.{0,60}\b(garantía|extras?|pago)\b'
    - '\bnadie me (preguntó|dijo|explicó)\b'
    - '\b(me la|me lo|me los) (metieron|colaron)\b'
    - '\b(pensado|pensando|pensé) en (el )?gap\b'
    - '\bsolo (estoy )?(dando|poniendo)\b'
    - '\ben (mi|el) pago\b'
unlock_conditions:
  - code: nothing_without_yes
    description:
      en: Promises that nothing is added without his yes.
      es: Le asegura que no se agrega nada sin que él diga que sí.
    cues:
      en:
        - '\bnothing (is|gets|goes) (added|on|in)\b.{0,40}\bwithout your (yes|ok|okay|say[- ]so|approval)\b'
        - '\bonly (what|the products?) you (choose|pick|say yes to)\b'
      es:
        - '\bno se (agrega|añade|pone|incluye) nada\b.{0,40}\bsin (que usted diga que sí|su sí|su aprobación|su permiso)\b'
        - '\bsolo lo que usted (escoja|elija|apruebe)\b'
  - code: asks_what_happened
    description:
      en: Asks what happened last time, or whether something ended up in his payment unexplained.
      es: Pregunta qué le pasó la última vez, o si algo terminó en su pago sin explicación.
    cues:
      en:
        - '\bwhat happened (last time|before|on your last|with your last)\b'
        - '\b(did|has) something happen(ed)? (last time|before|with your last|on your last)\b'
        - '\b(ended|showed) up in your (last )?payment\b'
        - '\b(get|got|was) added to your (last )?payment\b'
      es:
        - '\bqué (le )?pasó (la última vez|antes|con su último|en su último)\b'
        - '\ble pasó algo (la última vez|antes|con su último)\b'
        - '\b(terminó|apareció|le agregaron|le metieron)\b.{0,20}\ben su pago\b'
walk_out_triggers:
  - code: calls_required
    description:
      en: Says or implies a product is required, or that everyone takes it.
      es: Dice o da a entender que un producto es obligatorio, o que todo el mundo lo compra.
    cues:
      en:
        - '\b(bank|lender) (requires|needs|wants|likes to see|insists on)\b'
        - '\byou (need|have|ought) to (get|take|have|buy) (the )?(warranty|service contract|gap|protection)\b'
        - '\beveryone (gets|takes|buys)\b'
        - '(?<!nothing |neither one |neither |none of them |none )\b(it''s|it is|they''re|they are|is|are) (required|mandatory)\b'
      es:
        - '\bel banco (pide|exige|requiere|quiere)\b'
        - '(?<!no )\b(tiene|necesita|debería) (que )?(llevar|comprar|coger|tener) (la |el )?(garantía|contrato de servicio|gap|protección)\b'
        - '\btodo el mundo (la|lo) (compra|coge|lleva)\b'
        - '(?<!no |nunca |nada |ninguno |ninguna )\b(es|son) (obligatori[oa]s?|un requisito)\b'
  - code: blends_payment
    description:
      en: Quotes one payment "with everything" or shrinks a product to "only a few dollars more".
      es: Da un solo pago "con todo" o achica un producto a "solo unos dólares más".
    cues:
      en: ['\bwith everything\b', '\b(only|just) \$?\d+ (more|extra)\b', '\bfor (just|only) (a few|pennies)\b']
      es: ['\bcon todo eso\b', '\b(solo|nada más) \$?\d+ (más|extra)\b', '\bpor (solo|nada más) unos (dólares|centavos)\b']
  - code: third_push
    description:
      en: Pushes a product a third time after he says no.
      es: Insiste con un producto por tercera vez después de que dijo que no.
    min_hits: 3
    cues:
      en: ['\btrust me\b', '\byou(''ll| will) be glad\b', '\byou(''ll| will) regret\b', '\bare you sure you don''?t want\b']
      es: ['\bcréame\b', '\bse va a alegrar\b', '\bse va a arrepentir\b', '\bestá seguro (de )?que no (lo|la) quiere\b']
win_condition:
  description:
    en: He tells you about the warranty slipped into his last payment and his interest in GAP, plus a firm delivery time today.
    es: Le cuenta de la garantía que le metieron en el pago anterior y de su interés en el GAP, más una hora firme de entrega hoy.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el GAP", "la inicial", "el down"]
register: usted
voice_ids:
  en: tbd-en-us-male-30s
  es: tbd-es-miami-caribbean-male-30s
difficulty: 2
variation:
  moods: [impatient, wary, tired of waiting]
offline_lines:
  deflect:
    - { en: "I just want the car. No extras.", es: "Yo solo quiero el carro. Sin extras." }
    - { en: "I already said no. Can we just do the paperwork?", es: "Ya le dije que no. ¿Podemos hacer los papeles y ya?" }
    - { en: "I know how this office works.", es: "Yo sé cómo funciona esta oficina." }
  hint: { en: "Let's just say I've been burned before.", es: "Digamos que ya me quemaron una vez." }
  after_hint: { en: "I'm just careful in this room.", es: "Es que en esta oficina tengo cuidado." }
  reveal: { en: "Yes. On my last car a $2,800 warranty ended up in my payment, and nobody asked me. But I'm only putting $1,000 down, so I've wondered about GAP.", es: "Sí. En mi último carro me metieron una garantía de $2,800 en el pago y nadie me preguntó. Pero solo estoy dando $1,000 de inicial, así que he pensado en el GAP." }
  after_reveal:
    - { en: "Okay. Show me GAP by itself.", es: "Está bien. Enséñeme el GAP solo." }
    - { en: "That's fair. That's all I wanted.", es: "Eso es justo. Es lo único que quería." }
  agree_next_step: { en: "Okay, that works.", es: "Está bien, eso me funciona." }
  not_now: { en: "Let's leave it for today. I'll come back to sign.", es: "Dejémoslo por hoy. Vuelvo otro día a firmar." }
  walk_away: { en: "Forget it. I'll get my own financing.", es: "Olvídese. Yo busco mi propio financiamiento." }
  goodbye: { en: "Thanks.", es: "Gracias." }
  react_to_pressure: { en: "I said no extras.", es: "Ya le dije que sin extras." }
spanish_reviewed: false
