code: P-furniture-payment
name_pool:
  en: [Chris, Danny, Mike, Eddie]
  es: [Reinaldo, Yosvany, Lázaro, Pedro]
age_range: 38-46
temperament: [friendly]
temperament_note:
  en: Friendly and direct, a little tired. Wants straight numbers and no speeches. Not a haggler; he just has a budget.
  es: Amable y directo, un poco cansado. Quiere números claros y nada de discursos. No es de regatear; es que tiene un presupuesto.
buyer_orientation: task
situation:
  en: Early 40s, married, two kids, a house in Hialeah. Replacing the family room sofa with the Ravenna Capri power-reclining sectional in top-grain leather. His wife already said yes to the sectional. Good credit, wants the store's financing. Was shown a payment that includes the optional leather protection plan.
  es: De unos 42 años, casado, con dos hijos, vive en una casa en Hialeah. Quiere cambiar el sofá del family room por el sectional Capri de Ravenna, reclinable eléctrico, en cuero top-grain. Su esposa ya le dio el sí al sectional. Buen crédito, quiere el financiamiento de la tienda. Le enseñaron un pago que incluye el plan opcional de protección para el cuero.
stated_objection: O03
stated_line:
  en: I like it, but the payment is too high.
  es: Me gusta, pero el pago está muy alto.
hidden_truth:
  en: He has a hard ceiling of $240 a month that he has not said yet, because his daughter's braces payment just started. Above that, the budget does not work.
  es: Tiene un tope fijo de $240 al mes que todavía no ha dicho, porque acaba de empezar a pagar los brackets de su hija. Por encima de eso, el presupuesto no le da.
# Phrases that would give the ceiling away before an unlock.
hidden_truth_markers:
  en:
    - '\btwo[- ]forty\b'
    - '\$\s?240\b'
    - '\b(can''?t|cannot|won''?t)\b.{0,15}\b(go|be|pay) (over|above|past|more than)\b'
    - '\b(ceiling|max(imum)?|hard stop|cap)\b'
    - '\b(braces|orthodont\w*)\b'
  es:
    - '\bdoscientos cuarenta\b'
    - '\$\s?240\b'
    - '\bno (me )?puedo (pasar|subir|ir más)\b'
    - '\b(tope|máximo|límite)\b'
    - '\b(brackets|frenillos|ortodonc\w*)\b'
unlock_conditions:
  - code: asks_payment_number
    description:
      en: Asks what payment he had in mind or needs to stay under.
      es: Pregunta qué pago tenía en mente o de qué pago no se puede pasar.
    cues:
      en:
        - '\bwhat (payment|number|monthly( payment)?)\b.{0,30}\b(had in mind|have in mind|were you (expecting|hoping for|thinking)|are you (expecting|hoping for|looking for|trying to (hit|stay under)))'
        - '\bwhat (payment|number) (do|would) you need\b'
        - '\bwhere (does|would) the payment (need to|have to) (be|land|sit)\b'
        - '\bwhat(''s| is) the (most|highest|max(imum)?)\b.{0,25}\b(pay|payment)\b'
        - '\bhow (high|much) (can|could) you (go|pay)\b.{0,20}\b(month|monthly|payment)\b'
      es:
        - '\bqué (pago|número|cuota|mensualidad)\b.{0,30}\b(tenía en mente|tiene en mente|esperaba|le funciona|necesita|busca)\b'
        - '\b(cuál|qué) (es|sería) (el|su) pago máximo\b'
        - '\bhasta (qué pago|cuánto) puede (llegar|pagar)\b'
        - '\bcuánto (es lo máximo que|puede|esperaba|pensaba) pagar\b'
        - '\b(dónde|en cuánto) (tiene|necesita) que (estar|quedar) el pago\b'
  - code: asks_what_number_protects
    description:
      en: Treats his number as a clue and asks what it protects (T110).
      es: Ve su número como una pista y pregunta qué está cuidando con él (T110).
    cues:
      en:
        - '\bwhat (is|was) (that|the) (number|payment) protecting\b'
        - '\bwhat(''s| is) (behind|driving) (that|the) (number|payment)\b'
      es:
        - '\bqué (es lo que )?(está|anda) cuidando con (ese|el) (número|pago)\b'
        - '\bqué hay detrás de (ese|el) (número|pago)\b'
walk_out_triggers:
  - code: argues_payment
    description:
      en: Argues that the payment is fine instead of asking ("That's a great payment").
      es: Discute que el pago está bien en vez de preguntar ("Ese es un excelente pago").
    cues:
      en:
        - '\b(the )?payment (isn''?t|is not) (that |really |even )?(high|bad)\b'
        - '\b(great|good|fair|excellent) payment\b'
        - '\byou(''ll| will) (forget about|get used to) (it|the payment)\b'
        - '\bonly (a )?(few|couple( of)?) (dollars|bucks) (more )?a day\b'
      es:
        - '\b(el pago )?no está (tan |muy )?(alto|mal)\b'
        - '\b(buen|excelente|muy buen) pago\b'
        - '\b(ni se acuerda|se (le )?va a olvidar|se acostumbra)\b'
        - '\bunos (pocos )?(dólares|pesos) (más )?al día\b'
  - code: plan_as_required
    description:
      en: Presents the protection plan as required or part of the financing.
      es: Presenta el plan de protección como obligatorio o como parte del financiamiento.
    cues:
      en:
        - '\b(plan|protection)\b.{0,30}\b(is|are) (required|mandatory|part of the financing)\b'
        - '\b(need|have to (get|take|keep)) the (plan|protection)\b'
        - '\bthe (plan|protection) comes with the financing\b'
      es:
        - '\b(plan|protección)\b.{0,30}\b(es|son) (obligatori[oa]s?|requisito|parte del financiamiento)\b'
        - '\b(necesita|tiene que (coger|tomar|llevar)) el plan\b'
        - '\bel plan viene con el financiamiento\b'
  - code: piles_on_options
    description:
      en: Walks him to other sectionals instead of finding his number.
      es: Le enseña otros sectionals en vez de averiguar su número.
    cues:
      en:
        - '\blet me show you (all|every|a few more|some more|the others)\b'
        - '\b(a few|a couple|some|two|three|four) (more|other|cheaper) (sofas|sectionals|collections|options)\b'
      es:
        - '\b(le enseño|le muestro) (todos|todas|unos cuantos|otros|otras)\b'
        - '\b(unos cuantos|un par de|dos|tres|cuatro) (sofás|sectionals|modelos|colecciones) más\b'
  - code: fake_today_price
    description:
      en: Makes up a today-only price or deadline.
      es: Inventa un precio o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(price|deal|payment|sale)\b.{0,20}\b(goes up|won''?t be (here|there)|is gone) tomorrow\b', '\bif you (leave|walk)\b.{0,40}\b(price|deal|offer|payment)\b.{0,20}\b(gone|go away|disappear)']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube)\b', '\bsi se va\b.{0,40}\b(precio|oferta|pago)\b.{0,20}\b(se pierde|ya no|desaparece)']
  - code: third_push
    description:
      en: Pushes for a decision a third time after two refusals.
      es: Insiste por tercera vez después de dos negativas.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(do it|write it up|get it done|do the paperwork)\b', '\b(order|sign)\b.{0,15}\b(today|now|tonight)\b', '\bwhat (will|would) it take\b', '\bwhy not (today|now)\b']
      es: ['\bhagámoslo (hoy|ahora|ya)\b', '\b(firme|lo ordenamos|lo dejamos ordenado)\b.{0,15}\b(hoy|ahora|ya)\b', '\bqué (tengo|hace falta) (que hacer )?para que\b.{0,20}\bhoy\b', '\bpor qué no (hoy|ahora)\b']
win_condition:
  description:
    en: His real ceiling comes out, plus a firm time to come back and pick between real options.
    es: Sale a la luz su tope real, más una hora firme para volver y escoger entre opciones reales.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el down", "el pago", "el sectional", "el family room"]
register: usted
voice_ids:
  en: tbd-en-us-male-40s
  es: tbd-es-miami-cuban-male-40s
difficulty: 1
variation:
  moods: [tired after work, hungry, checking his phone for his wife's texts]
  amount_ranges: {}
offline_lines:
  deflect:
    - { en: "It's just too high. What else can you do?", es: "Está muy alto. ¿Qué más se puede hacer?" }
    - { en: "I like it. The monthly is the problem.", es: "Me gusta. El problema es la mensualidad." }
    - { en: "I'm not trying to be difficult. It just doesn't work.", es: "No es que me ponga difícil. Es que no me da." }
  hint: { en: "I've got a number in my head. I just didn't want to say it first.", es: "Tengo un número en la cabeza. Es que no quería decirlo yo primero." }
  after_hint: { en: "Yeah, the sectional's perfect. It's the monthly.", es: "Sí, el sectional está perfecto. Es la mensualidad." }
  reveal: { en: "Two forty. I can't go over $240 a month. My daughter's braces just started.", es: "Doscientos cuarenta. No me puedo pasar de $240 al mes. Acabamos de empezar a pagar los brackets de mi hija." }
  after_reveal:
    - { en: "Okay. Show me those side by side.", es: "Está bien. Enséñemelas lado a lado." }
    - { en: "As long as it's real and on paper, I can decide fast.", es: "Mientras sea real y esté por escrito, yo decido rápido." }
  agree_next_step: { en: "That works. Have them printed for me.", es: "Eso me sirve. Téngamelas impresas." }
  not_now: { en: "Not today. I need to get home.", es: "Hoy no. Me tengo que ir para la casa." }
  walk_away: { en: "I'm going to head out.", es: "Me voy a ir yendo." }
  goodbye: { en: "Thanks. Take care.", es: "Gracias. Que le vaya bien." }
  react_to_pressure: { en: "I'm telling you, it's too high for us.", es: "Le estoy diciendo que para nosotros está muy alto." }
spanish_reviewed: false
