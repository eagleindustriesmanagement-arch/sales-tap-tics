code: P-solar-payment
name_pool:
  en: [Marcus, Chris, Jason, Andre]
  es: [Yoel, Luis, Raúl, Dairon]
age_range: 30-39
temperament: [friendly]
temperament_note:
  en: Friendly and tired after a long shift. Wants the bill down, not a lecture. Goes quiet when he feels talked into something.
  es: Amable y cansado después de un turno largo. Quiere bajar la cuenta de la luz, no que le den una charla. Se queda callado cuando siente que lo están convenciendo.
buyer_orientation: task
situation:
  en: Late 30s, married, works in logistics in Doral, owns a single-family home in Homestead. Good credit. Would finance. Just saw the written quote for the system with the home battery and the monitoring upgrade.
  es: De unos 38 años, casado, trabaja en logística en Doral, dueño de una casa en Homestead. Buen crédito. Lo financiaría. Acaba de ver la cotización por escrito del sistema con la batería y el monitoreo.
stated_objection: O03
stated_line:
  en: The payment is too high. I can't do that every month.
  es: El pago está muy alto. No puedo con eso todos los meses.
hidden_truth:
  en: He thought the battery was required to get the panels and the loan, because a door-to-door rep from another company told him so. He never asked for it. He budgeted about $200 a month.
  es: Pensaba que la batería era obligatoria para los paneles y el préstamo, porque un vendedor de otra compañía que tocó a su puerta se lo dijo. Él nunca la pidió. Había calculado como $200 al mes.
# Phrases that would give the hidden truth away before an unlock.
hidden_truth_markers:
  en:
    - '\bbattery\b.{0,40}\b(required|mandatory|had to|have to|came with|part of)\b'
    - '\b(thought|figured|assumed|told me)\b.{0,40}\bbattery\b'
    - '\b(two hundred|\$\s?200)\b'
    - '\bdon''?t (need|want) the battery\b'
    - '\bnever asked for\b'
  es:
    - '\bbatería\b.{0,40}\b(obligatoria|requisito|había que|hay que|venía con|tenía que)\b'
    - '\b(pensé|creí|me dijeron|me dijo)\b.{0,40}\bbatería\b'
    - '\b(doscientos|\$\s?200)\b'
    - '\bno (necesito|quiero) la batería\b'
    - '\bnunca la pedí\b'
unlock_conditions:
  - code: asks_payment_number
    description:
      en: Asks what payment he had in mind or needs to stay under.
      es: Pregunta qué pago tenía en mente o de qué pago no se puede pasar.
    cues:
      en:
        - '\bwhat (payment|number|monthly( payment)?)\b.{0,30}\b(had in mind|have in mind|were you (expecting|hoping for|thinking)|are you (expecting|hoping for|looking for|trying to (hit|stay under)))'
        - '\bwhat (payment|number) (do|would) you need\b'
        - '\bwhere (does|would) the payment (need to|have to) (be|land|sit)\b'
        - '\bwhat(''s| is) the (most|highest|max(imum)?)\b.{0,25}\b(pay|payment)\b'
      es:
        - '\bqué (pago|número|cuota|mensualidad)\b.{0,30}\b(tenía en mente|tiene en mente|esperaba|le funciona|le queda bien|necesita|busca)\b'
        - '\b(cuál|qué) (es|sería) (el|su) pago máximo\b'
        - '\bhasta (qué pago|cuánto) puede (llegar|pagar)\b'
        - '\bcuánto (es lo máximo que|puede|esperaba|pensaba) pagar\b'
  - code: asks_what_he_wants_in_it
    description:
      en: Asks what is in the payment, or whether he actually wants the battery or the monitoring.
      es: Pregunta qué hay en el pago, o si de verdad quiere la batería o el monitoreo.
    cues:
      en:
        - '\b(battery|batteries)\b[^.!]{0,60}\?'
        - '\bwhat(''s| is) in (that|the|this) (payment|quote|number)\b'
        - '\bwhich (parts?|pieces?|items?) (do )?you (actually |really )?(want|need)\b'
        - '\bdid you (ask for|want) the (battery|monitoring)\b'
      es:
        - '\b(batería|baterías)\b[^.!]{0,60}\?'
        - '\bqué (hay|incluye|lleva) (en )?(ese|el|este) (pago|estimado|número)\b'
        - '\bqué partes? (de verdad |realmente )?(quiere|necesita)\b'
        - '\b(pidió|quería) (usted )?la batería\b'
walk_out_triggers:
  - code: argues_payment
    description:
      en: Argues that the payment is fine instead of asking ("That's a great payment").
      es: Discute que el pago está bien en vez de preguntar ("Ese es un excelente pago").
    cues:
      en:
        - '\b(the )?payment (isn''?t|is not) (that |really |even )?(high|bad)\b'
        - '\b(great|good|fair|excellent) payment\b'
        - '\byou(''ll| will) (forget about|get used to) (it|the payment)\b'
        - '\bonly (a )?(few|couple( of)?) (dollars|bucks) (more )?a day\b'
      es:
        - '\b(el pago )?no está (tan |muy )?(alto|mal)\b'
        - '\b(buen|excelente|muy buen) pago\b'
        - '\b(ni se acuerda|se (le )?va a olvidar|se acostumbra)\b'
        - '\bunos (pocos )?(dólares|pesos) (más )?al día\b'
  - code: piles_on_add_ons
    description:
      en: Piles on more products (more panels, a second battery) when the payment is already too high.
      es: Le echa encima más productos (más paneles, otra batería) cuando el pago ya está muy alto.
    cues:
      en:
        - '\bwhile we''?re at it\b'
        - '\b(add|adding|include|including)\b.{0,20}\b(a second battery|another battery|more panels)\b'
        - '\b(also|too)\b.{0,30}\b(add|adding)\b.{0,20}\b(a second battery|another battery|more panels)\b'
      es:
        - '\bya que estamos\b'
        - '\b(agregar|agregarle|sumar|sumarle|incluir|incluirle)\b.{0,20}\b(otra batería|una segunda batería|más paneles)\b'
  - code: fake_deadline
    description:
      en: Makes up a today-only price, payment or deadline.
      es: Inventa un precio, un pago o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(price|deal|offer|quote|payment|rate)\b.{0,20}\b(goes up|won''?t be (here|there)|is gone|expires) tomorrow\b', '\bif you (wait|don''?t sign)\b.{0,40}\b(price|deal|offer|quote|payment|rate)\b.{0,20}\b(gone|go away|goes up|disappear)']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube)\b', '\bsi (espera|no firma)\b.{0,40}\b(precio|oferta|cotización|pago|tasa)\b.{0,20}\b(se pierde|ya no|sube|desaparece)']
  - code: third_push
    description:
      en: Pushes for a signature a third time after two refusals.
      es: Insiste por tercera vez en que firme después de dos negativas.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(do it|write it up|get it done)\b', '\bsign (it |the contract |the paperwork )?(today|now|tonight)\b', '\bwhat (will|would) it take\b', '\bwhy not (today|now)\b', '\bget you signed\b']
      es: ['\bhagámoslo (hoy|ahora|ya)\b', '\bfirme (hoy|ahora|ya|esta noche)\b', '\bqué (tengo|hace falta) (que hacer )?para que\b.{0,20}\b(hoy|firme)\b', '\bpor qué no (hoy|ahora)\b', '\bdejemos (escrito|firmado)\b']
win_condition:
  description:
    en: His belief that the battery was required comes out, plus a firm day and time to go over the written estimate with and without it.
    es: Sale a la luz que pensaba que la batería era obligatoria, más un día y una hora firmes para revisar el estimado por escrito con ella y sin ella.
  requires_all: [hidden_revealed]
  requires_any: [next_step]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el bill de la luz", "el loan", "el pago", "el estimate"]
register: usted
voice_ids:
  en: tbd-en-us-male-30s
  es: tbd-es-miami-cuban-male-30s
difficulty: 1
variation:
  moods: [tired after a double shift, hungry, checking a text from his wife]
  amount_ranges: {}
offline_lines:
  deflect:
    - { en: "It's just too high for me.", es: "Está muy alto para mí." }
    - { en: "I came into this to lower my bills, not to add a bill.", es: "Yo me metí en esto para bajar la cuenta de la luz, no para sumar otra cuenta." }
    - { en: "I like the panels. The monthly is the problem.", es: "Los paneles me gustan. El problema es la mensualidad." }
  hint: { en: "I've got a number in my head. And honestly, I'm not even sure what all is in that payment.", es: "Tengo un número en la cabeza. Y la verdad, no estoy seguro de todo lo que hay en ese pago." }
  after_hint: { en: "The panels are fine. It's the monthly.", es: "Los paneles están bien. Es la mensualidad." }
  reveal: { en: "Okay. I thought the battery was required to get the panels and the loan. Another company's guy told me that. I never asked for it. I budgeted about two hundred a month.", es: "Bueno. Yo pensé que la batería era obligatoria para los paneles y para el préstamo. Eso me lo dijo el de otra compañía. Yo nunca la pedí. Yo había calculado como doscientos al mes." }
  after_reveal:
    - { en: "Okay. Show me that on paper.", es: "Está bien. Enséñemelo en papel." }
    - { en: "As long as it's in writing, I can work with that.", es: "Mientras esté por escrito, con eso puedo trabajar." }
  agree_next_step: { en: "That works. Have both ready.", es: "Eso me queda bien. Téngame los dos listos." }
  not_now: { en: "Not today. I'm beat.", es: "Hoy no. Estoy muerto del cansancio." }
  walk_away: { en: "I think I'm done for today.", es: "Creo que por hoy ya terminé." }
  goodbye: { en: "Thanks. Have a good night.", es: "Gracias. Que pase buenas noches." }
  react_to_pressure: { en: "Don't push me. I said it's too high.", es: "No me presione. Le dije que está muy alto." }
spanish_reviewed: false
