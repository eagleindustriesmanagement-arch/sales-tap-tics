code: P-partner-check
name_pool:
  en: [Mike, Dave, Chris, Tony]
  es: [Roberto, Ernesto, Alejandro, Yoel]
age_range: 40-49
temperament: [friendly]
temperament_note:
  en: Friendly, a little evasive. Likes the car and does not want an argument.
  es: Amable, un poco evasivo. Le gusta el carro y no quiere discutir.
buyer_orientation: relationship
situation:
  en: Married, mid-40s, shopping for a midsize SUV. Trading a paid-off sedan. Good credit. Just finished the test drive.
  es: Casado, de unos 45 años, buscando una SUV mediana. Tiene un sedán pagado para dar como trade-in. Buen crédito. Acaba de terminar la prueba de manejo.
stated_objection: O01
stated_line:
  en: I like it, but I need to talk to my wife before I do anything.
  es: Me gusta, pero tengo que hablarlo con mi esposa antes de hacer nada.
hidden_truth:
  en: The payment is about $60 a month above what he told his wife it would be.
  es: El pago está como $60 al mes por encima de lo que él le dijo a su esposa.
# Phrases that would give the hidden truth away before an unlock. Generic on purpose: the exact gap varies by seed.
hidden_truth_markers:
  en:
    - '\b(bucks|dollars)\b.{0,15}\b(higher|more|over|above)\b'
    - '\b(higher|more|over|above) than (what )?I (told|said)'
    - '\bI (told|said to) (her|my wife)\b.{0,30}\b(it would be|the payment|\$?\d)'
    - '\bwhat I told (her|my wife)\b'
  es:
    - '\b(dólares|pesos)\b.{0,20}\b(más|por encima)\b'
    - '\b(más|por encima) de lo que (le )?(dije|había dicho)'
    - '\ble dije (a ella|a mi esposa)\b'
    - '\blo que le dije\b'
unlock_conditions:
  - code: asks_partner_question
    description:
      en: Asks what the partner will want to know or ask first.
      es: Pregunta qué va a querer saber o preguntar primero la pareja.
    cues:
      en:
        - '\bwhat (do you think )?(will|would|is) (she|he|your wife|your husband|your partner)\b.{0,25}\b(ask|want to know|say|think|worry)'
        - '\b(her|his) first question\b'
        - '\bwhat(''s| is) (she|he) going to (ask|say|want)'
        - '\bwhat will you tell (her|him)\b'
      es:
        - '\bqué (cree que )?(le )?va a (preguntar|decir|querer saber)\b'
        - '\bsu primera pregunta\b'
        - '\bqué (le )?va a (preguntar|decir) (ella|su esposa|él)\b'
        - '\bqué (le )?(va a|piensa) decir(le)?\b'
  - code: asks_payment_directly
    description:
      en: Asks directly whether the payment is where he said it would be at home.
      es: Pregunta directamente si el pago está donde él dijo en la casa.
    cues:
      en:
        - '\b(payment|number)\b.{0,40}\b(told her|told your wife|said it would|she expect|had in mind|you discussed|you talked about)'
        - '\bwhat (payment|number) did you (tell|give|mention)'
        - '\bis (it|the payment) where you (told|said)'
      es:
        - '\b(pago|número)\b.{0,40}\b(le dijo|dijo que|ella espera|tenía en mente|hablaron)'
        - '\bqué (pago|número) le (dijo|dio|mencionó)'
        - '\bel pago está donde\b'
walk_out_triggers:
  - code: belittles_partner
    description:
      en: Belittles consulting a partner ("Can't you decide yourself?").
      es: Le resta importancia a consultar con la pareja ("¿No puede decidir usted solo?").
    cues:
      en:
        - '\b(can''?t|cannot) you decide\b'
        - '\bdo you (really )?need (her|his|your wife''?s?|your husband''?s?) (permission|ok|okay|approval)\b'
        - '\bwho wears the pants\b'
        - '\byou(''re| are) a grown (man|woman|adult)\b'
        - '\byou don''?t need (her|his) (permission|ok|okay)\b'
      es:
        - '\bno puede decidir (usted )?sol[oa]\b'
        - '\bnecesita (el )?permiso\b'
        - '\bquién manda en (su )?casa\b'
        - '\busted (ya )?es (un hombre|una mujer|grande|adulto)\b'
  - code: fake_today_price
    description:
      en: Makes up a today-only price or deadline.
      es: Inventa un precio o una fecha límite solo para hoy.
    cues:
      en: ['\b(today|tonight|right now) only\b', '\bonly (good|valid) (today|tonight)\b', '\b(price|deal)\b.{0,20}\b(goes up|won''?t be (here|there)|is gone) tomorrow\b', '\bif you (leave|walk)\b.{0,40}\b(price|deal|offer)\b.{0,20}\b(gone|go away|disappear)']
      es: ['\bsolo (por )?hoy\b', '\bmañana (ya )?(no|sube)\b', '\bsi se va\b.{0,40}\b(precio|oferta)\b.{0,20}\b(se pierde|ya no|desaparece)']
  - code: third_push
    description:
      en: Pushes for a decision a third time after two refusals.
      es: Insiste por tercera vez después de dos negativas.
    min_hits: 3
    cues:
      en: ['\blet''?s (just )?(do it|write it up|get it done)\b', '\bsign (it )?(today|now|tonight)\b', '\bwhat (will|would) it take\b', '\btake it home (today|tonight)\b', '\bwhy not (today|now)\b']
      es: ['\bhagámoslo (hoy|ahora|ya)\b', '\bfirme (hoy|ahora|ya)\b', '\bqué (tengo|hace falta) (que hacer )?para que\b.{0,20}\bhoy\b', '\bllévese(lo|la)? hoy\b', '\bpor qué no (hoy|ahora)\b']
win_condition:
  description:
    en: The hidden payment gap is surfaced, plus a firm appointment with day and time or a live call with his wife.
    es: Sale a la luz la diferencia escondida en el pago, más una cita firme con día y hora o una llamada en vivo con su esposa.
  requires_all: [hidden_revealed]
  requires_any: [next_step, partner_call]
language:
  preferred: es
  mixes_when_rep_mixes: true
  everyday_terms: ["el down", "el trade-in"]
register: usted
voice_ids:
  en: tbd-en-us-male-40s
  es: tbd-es-miami-caribbean-male-40s
difficulty: 1
variation:
  moods: [relaxed, a little tired, wants to get home for dinner]
  amount_ranges:
    budget_told_spouse_cents: [51000, 53000]
spanish_reviewed: false
