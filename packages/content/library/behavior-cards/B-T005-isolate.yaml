code: B-T005-isolate
technique: T005
title: { en: Isolate, es: Aislar }
behavior:
  en: Before solving, ask whether anything besides the stated objection is holding the customer back.
  es: Antes de resolver, pregunte si hay algo aparte de la objeción que dijo que esté deteniendo al cliente.
floor_check_script:
  saw:
    en: "I watched you with [the customer]. You solved [the objection] and then a new one came up."
    es: "Lo vi con [el cliente]. Usted resolvió [la objeción] y después salió otra."
  behavior:
    en: Next time, isolate it before you solve it.
    es: La próxima vez, antes de resolver, pregunte si hay algo más.
  line:
    en: "\"Other than that, is there anything else holding you back?\""
    es: "\"Aparte de eso, ¿hay algo más que lo frene?\""
  check_again:
    en: Try it on your next up. I'll ask you how it went after lunch.
    es: Pruébelo con su próximo cliente. Le pregunto cómo le fue después del almuerzo.
look_for:
  en: ["An \"other than that\" question", "Waits for the answer before solving"]
  es: ["Una pregunta de \"aparte de eso\"", "Espera la respuesta antes de resolver"]
rubric_items: [U-ISOLATE, O01-ISOLATE, U-HIDDEN, O01-HIDDEN]
duration_seconds: 60
spanish_reviewed: false
