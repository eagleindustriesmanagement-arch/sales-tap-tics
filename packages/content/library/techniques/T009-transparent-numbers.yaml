  en: Price, trade, fees and payment on one sheet, then stop talking.
  es: Precio, trade-in, cargos y pago en una sola hoja, y luego silencio.
flawed_line:
  en: Let's just focus on the monthly payment for now. Don't worry about the price or the fees, we'll get to those later, and honestly...
  es: Por ahora fijémonos solo en el pago mensual. No se preocupe por el precio ni por los cargos, eso lo vemos después, y la verdad...
