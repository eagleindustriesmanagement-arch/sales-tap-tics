slug: remove-real-risk
name:
  en: Remove real risk
  es: Quitar el riesgo real
family: indecision
stages:
  - objection
  - closing
when:
  en: Fear of a lemon or the wrong choice
  es: Miedo a que le salga malo el carro o a escoger mal
model_line_kind: spoken
model_line:
  en: Here is the warranty booklet. Let me show you exactly what is covered.
  es: Aquí está la garantía. Déjeme enseñarle exactamente lo que incluye.
flawed_line:
  en: Don't overthink it. It's brand new, just enjoy it.
  es: No le dé tantas vueltas. Es nuevecito, disfrútelo.
flawed_line_violates: []
why:
  en: This draws on the JOLT research on indecision, where fear of a wrong choice is what stalls buyers. Showing exactly what a real warranty covers makes that risk smaller; use only protections you can show.
  es: Se basa en la investigación de JOLT sobre la indecisión, donde el miedo a escoger mal es lo que frena al cliente. Enseñarle exactamente lo que cubre una garantía real hace ese riesgo más pequeño; use solo protecciones que pueda enseñar.
evidence:
  grade: B
  note: same; only real, showable protections
