model_line:
  en: Both keys, phone paired, tank full, first service booked. Anything missing?
  es: Las dos llaves, el teléfono conectado, el tanque lleno y su primer servicio agendado. ¿Le falta algo?
flawed_line:
  en: Okay, you're all set. The manual has everything else. Drive safe!
  es: Bueno, ya está todo. Lo demás está en el manual. ¡Maneje con cuidado!
