why:
  en: Service research found that a bad ending hurts more than a staged high point helps. Checking keys, phone, tank and first service before they leave makes sure the last moment of the sale is a good one.
  es: La investigación sobre servicio encontró que un mal final hace más daño del que ayuda un momento especial preparado. Revisar las llaves, el teléfono, el tanque y el primer servicio antes de que se vaya asegura que el último momento de la venta sea bueno.
