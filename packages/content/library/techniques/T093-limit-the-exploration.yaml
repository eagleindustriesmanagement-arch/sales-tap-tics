code: T093
slug: limit-the-exploration
name:
  en: Limit the exploration
  es: Limitar la búsqueda
family: indecision
stages:
  - objection
  - closing
when:
  en: Wants one more comparison
  es: Quiere hacer una comparación más
model_line_kind: spoken
model_line:
  en: You have compared the three that fit your budget. The only open question is the payment. Let's settle that.
  es: Usted ya comparó los tres que le cuadran en el presupuesto. Lo único que falta es el pago. Resolvamos eso.
flawed_line:
  en: Sure, let's go look at a few more. We've got a whole lot out back.
  es: Claro, vamos a ver unos cuantos más. Allá atrás tenemos un montón.
flawed_line_violates: []
why:
  en: The JOLT research and a 2015 meta-analysis on choice overload (Chernev) both support this. More comparisons can deepen indecision; closing the search and settling the one open question helps the customer decide.
  es: La investigación de JOLT y un metaanálisis de 2015 sobre el exceso de opciones (Chernev) respaldan esto. Más comparaciones pueden aumentar la indecisión; cerrar la búsqueda y resolver la única duda pendiente ayuda al cliente a decidir.
evidence:
  grade: B
  note: same; choice overload meta-analysis (Chernev 2015)
sources:
  - https://myscp.onlinelibrary.wiley.com/doi/abs/10.1016/j.jcps.2014.08.002
placeholders: []
related: []
rubric_items:
  - U-LIMIT
compliance: []
requires_store_policy: false
use_only_when: null
spanish_reviewed: false
status: active
