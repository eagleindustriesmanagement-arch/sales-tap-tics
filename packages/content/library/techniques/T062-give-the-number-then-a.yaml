code: T062
slug: give-the-number-then-a
name:
  en: Give the number, then a reason to visit
  es: Dar el número y luego una razón para venir
family: phone
stages:
  - phone
when:
  en: '"Just email me the price"'
  es: '"Nada más mándeme el precio por email"'
model_line_kind: spoken
model_line:
  en: Sent. That is the full out-the-door number. The one thing I cannot email is your trade value. That takes ten minutes here.
  es: Enviado; ese es el precio total con todos los cargos. Lo único que no puedo mandarle es el valor de su trade-in; eso toma diez minutos aquí.
flawed_line:
  en: Sorry, we don't email prices. You'll have to come in for that.
  es: Disculpe, nosotros no mandamos precios por email. Para eso tiene que venir.
flawed_line_violates: []
why:
  en: This is floor practice, not a tested finding, and the number you send must be the full walk-in price. Giving it freely earns trust, and the trade appraisal is a real reason to come in.
  es: Es una práctica de piso, no un hallazgo comprobado, y el número que mande tiene que ser el precio completo en tienda. Darlo sin rodeos gana confianza, y la tasación del trade-in es una razón real para venir.
evidence:
  grade: D
  note: must satisfy PRICE-02
sources: []
placeholders: []
related: []
rubric_items: []
compliance:
  - PRICE-02
requires_store_policy: false
use_only_when: null
spanish_reviewed: false
status: active
