code: T018
slug: trade-never-give
name:
  en: Trade, never give
  es: Intercambiar, nunca regalar
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Any request for a concession
  es: Cualquier pedido de una concesión
model_line_kind: spoken
model_line:
  en: If I can get my manager to $575 a month, are you taking it home today?
  es: Si consigo que mi gerente lo deje en $575 al mes, ¿se lo lleva hoy?
flawed_line:
  en: Okay, I'll get my manager to drop it to $575 a month.
  es: Está bien, voy a hacer que mi gerente se lo baje a $575 al mes.
flawed_line_violates: []
# The manager really can go to $575 here: the concession is true, the question is what it is traded for.
