why:
  en: This is floor tradition, not a tested finding. Showing the cheaper option before the drive lets a budget-minded buyer compare calmly, so if they pick the higher one it is their own choice.
  es: Es una tradición del piso de ventas, no un hallazgo comprobado. Enseñar la opción más económica antes de manejar deja que el cliente que cuida su presupuesto compare con calma, y si escoge la más cara es por decisión propia.
