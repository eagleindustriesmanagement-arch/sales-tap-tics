code: T110
slug: treat-a-hard-demand-as
name:
  en: Treat a hard demand as a clue
  es: Ver una exigencia firme como una pista
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: '"I need $400 a month, period"'
  es: '"Necesito $400 al mes, y punto"'
model_line_kind: spoken
model_line:
  en: Help me understand the four hundred. What is that number protecting for you?
  es: Ayúdeme a entender esos cuatrocientos. ¿Qué es lo que usted está cuidando con ese número?
flawed_line: null
flawed_line_violates: []
why:
  en: This comes from Malhotra and Bazerman's negotiation method, not a tested sales finding. A firm number usually protects something, like a budget or a fear, and once you know what, you may find other ways to meet it.
  es: Viene del método de negociación de Malhotra y Bazerman, no de un hallazgo comprobado en ventas. Un número firme casi siempre protege algo, como un presupuesto o un miedo, y cuando usted sabe qué es, puede encontrar otras formas de cumplirlo.
