code: T118
slug: all-in-quote-by-phone-or
name:
  en: All-in quote by phone or text
  es: Precio con todo incluido por teléfono o texto
family: compliance
stages:
  - numbers
when:
  en: Any price given outside the desk
  es: Cualquier precio que se da fuera de la mesa
model_line_kind: spoken
model_line:
  en: The price is $X, and that already includes our $Y dealer fee. Only taxes and the state tag and title fees are added.
  es: El precio es $X, y ya incluye nuestro cargo de concesionario de $Y. Solo se suman los impuestos y los cargos de placa y título del estado.
flawed_line:
  en: Prices change a lot, so I can't really say over the phone. When can you come in?
  es: Los precios cambian mucho, así que por teléfono no le puedo decir. ¿Cuándo puede pasar?
flawed_line_violates: []
why:
  en: Under the FTC's 2026 pricing guidance, a price given by phone or text must be the full walk-in price, with only government charges added. The customer hears the real number first, so nothing changes when they arrive.
  es: Según la guía de precios de la FTC de 2026, el precio que se da por teléfono o texto tiene que ser el precio completo en tienda, y solo se suman los cargos del gobierno. El cliente oye el número real primero, y nada cambia cuando llega.
evidence:
  grade: A
  note: FTC pricing guidance, September 15, 2026
sources:
  - https://www.ftc.gov/business-guidance/resources/automobile-industry-pricing-transparency-faqs
placeholders:
  - X
  - Y
related:
  - T030
  - T085
rubric_items:
  - U-TOTALFIRST
compliance:
  - PRICE-01
  - PRICE-02
requires_store_policy: false
use_only_when: null
spanish_reviewed: false
status: active
