code: T023
slug: one-well-timed-close
name:
  en: One well-timed close
  es: Un solo cierre en el momento justo
family: closing
stages:
  - closing
when:
  en: After needs are confirmed
  es: Después de confirmar las necesidades
model_line_kind: spoken
model_line:
  en: You said third row and under $650. This does both. Want me to get it ready?
  es: Usted dijo tercera fila y menos de $650. Este cumple con las dos. ¿Se lo preparo?
flawed_line:
  en: So, are we doing it? Come on, what do I have to do? Should I start the paperwork?
  es: Entonces, ¿lo hacemos? Dígame, ¿qué tengo que hacer? ¿Empiezo los papeles?
flawed_line_violates: []
why:
  en: In Rackham's photo-store study, training staff in closing techniques cut success on higher-value goods from 42% to 33%. One clear ask, once the needs are confirmed, avoids that pressure.
  es: En el estudio de Rackham en tiendas de fotografía, entrenar al personal en técnicas de cierre bajó el éxito en productos más caros del 42% al 33%. Una sola pregunta clara, después de confirmar las necesidades, evita esa presión.
evidence:
  grade: B
  note: Rackham photo-store study; closing training cut success on higher-value goods from 42% to 33%
