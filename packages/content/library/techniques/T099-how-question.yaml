code: T099
slug: how-question
name:
  en: '"How" question'
  es: La pregunta del "cómo"
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Customer demands a number you cannot meet
  es: El cliente exige un número al que usted no puede llegar
model_line_kind: spoken
model_line:
  en: How am I supposed to get to that number and still give you this truck?
  es: ¿Y cómo hago yo para llegar a ese número y todavía darle esta troca?
flawed_line:
  en: That's not happening. Not even close.
  es: Eso no va a pasar. Ni cerca.
flawed_line_violates: []
why:
  en: This comes from Chris Voss's negotiation method, not a tested finding. Asking how you could reach their number makes the customer look at the gap themselves, without you having to say no.
  es: Viene del método de negociación de Chris Voss, no de un hallazgo comprobado. Preguntar cómo podría usted llegar a ese número hace que el cliente mire la diferencia por sí mismo, sin que usted tenga que decir que no.
evidence:
  grade: D
  note: Chris Voss
sources: []
