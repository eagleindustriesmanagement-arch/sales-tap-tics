why:
  en: This comes from trainer Jonathan Dawson, not a tested finding. Lining both offers up out-the-door with the same equipment shows whether the lower quote is really cheaper, without telling the customer they are wrong.
  es: Viene del entrenador Jonathan Dawson, no de un hallazgo comprobado. Poner las dos ofertas lado a lado, con precio total y el mismo equipo, muestra si la cotización más baja de verdad es más barata, sin decirle al cliente que está equivocado.
