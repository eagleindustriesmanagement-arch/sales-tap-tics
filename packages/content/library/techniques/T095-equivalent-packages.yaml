code: T095
slug: equivalent-packages
name:
  en: Equivalent packages
  es: Paquetes equivalentes
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: First numbers, after discovery
  es: Los primeros números, después del descubrimiento
model_line_kind: spoken
model_line:
  en: I put together two ways to do this. Same deal for us, different for you. Which fits you better?
  es: Le preparé dos opciones. Para nosotros es lo mismo, pero para usted es distinto. ¿Cuál le conviene más?
flawed_line:
  en: Here's your number. So, are we doing it or not?
  es: Aquí está su número. ¿Lo hacemos o no?
flawed_line_violates: []
why:
  en: This draws on Leonardelli and others (2019), six experiments. Two packages that are equal for the store but different for the customer let them pick what they value most, so the choice feels like theirs.
  es: Se basa en Leonardelli y otros (2019), seis experimentos. Dos opciones que para la tienda son iguales pero para el cliente son distintas le dejan escoger lo que más valora, y la decisión se siente suya.
evidence:
  grade: B
  note: Leonardelli and others 2019, six experiments
