code: T068
slug: advance-not-let-me-know
name:
  en: Advance, not "let me know"
  es: Avanzar, no "me avisa"
family: closing
stages:
  - closing
when:
  en: End of every stage
  es: Al final de cada etapa
model_line_kind: spoken
model_line:
  en: Rather than leave it open, can we do the appraisal now so you have a real number to take home?
  es: En vez de dejarlo en el aire, ¿hacemos la tasación de su carro ahora para que se lleve un número real?
flawed_line:
  en: Sounds good. Just let me know what you decide.
  es: Perfecto. Me avisa lo que decida.
flawed_line_violates: []
why:
  en: This draws on Rackham's research on sales calls. Agreeing on a concrete next action, like the appraisal now, moves the sale forward, while "let me know" leaves it to chance.
  es: Se basa en la investigación de Rackham sobre llamadas de ventas. Acordar una acción concreta, como hacer la tasación ahora, hace avanzar la venta, mientras que un "me avisa" la deja a la suerte.
evidence:
  grade: B
  note: Rackham
