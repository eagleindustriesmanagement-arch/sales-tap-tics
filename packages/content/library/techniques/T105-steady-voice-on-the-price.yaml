code: T105
slug: steady-voice-on-the-price
name:
  en: Steady voice on the price
  es: Voz firme al dar el precio
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Saying any number
  es: Al decir cualquier número
model_line_kind: direction
model_line:
  en: Same volume and pace; no rising pitch; no speeding up.
  es: Mismo volumen y ritmo; sin subir el tono ni acelerarse.
flawed_line:
  en: So the price is, um... I know, it's kind of a lot? But that's just a starting point, we can totally move...
  es: Entonces el precio es, eh... ya sé, es un poco caro, ¿no? Pero eso es solo para empezar, lo podemos mover...
flawed_line_violates: []
why:
  en: This draws on Van Zant and Berger (2020). Saying the price at the same volume and pace sounds confident, while a rising pitch or speeding up sounds like you doubt the number yourself.
  es: Se basa en Van Zant y Berger (2020). Decir el precio con el mismo volumen y ritmo suena seguro, mientras que subir el tono o acelerarse suena a que usted mismo duda del número.
evidence:
  grade: B
  note: Van Zant and Berger 2020
sources:
  - https://faculty.wharton.upenn.edu/wp-content/uploads/2019/01/Voice-Persuades.pdf
