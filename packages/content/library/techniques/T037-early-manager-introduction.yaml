why:
  en: The only support is unaudited consultant data, so treat this as floor practice. Meeting the manager before numbers means the person who may join the desk later is not a stranger.
  es: El único respaldo son datos de consultores sin auditar, así que tómelo como práctica de piso. Conocer al gerente antes de los números hace que la persona que quizás se siente después en la mesa no sea un extraño.
