code: T030
slug: out-the-door-first
name:
  en: Out-the-door first
  es: Primero el precio total final
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Every price conversation
  es: En cada conversación de precio
model_line_kind: spoken
model_line:
  en: Out the door with doc fee, tag and tax, it is $38,912. Now, how do you want to pay for it?
  es: El precio total con el cargo de documentación, placa e impuestos es $38,912. ¿Cómo lo quiere pagar?
flawed_line:
  en: Let's not worry about the price yet. What monthly payment do you want to be at?
  es: No se preocupe por el precio todavía. ¿En cuánto quiere que le quede el pago mensual?
flawed_line_violates: []
example_deal:
  price_cents: 3801300
  all_in_price_cents: 3891200
why:
  en: The rules require any price you quote to include every dealer charge, with the total said before the breakdown. The customer knows the real number up front, so nothing surprises them at signing.
  es: Las reglas exigen que todo precio que usted diga incluya todos los cargos del concesionario, y que el total vaya antes del desglose. El cliente sabe el número real desde el principio y nada lo sorprende al firmar.
evidence:
  grade: A
  note: Florida s. 501.976; FTC 2026
sources:
  - https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599%2F0501%2FSections%2F0501.976.html
  - https://www.ftc.gov/business-guidance/resources/automobile-industry-pricing-transparency-faqs
placeholders: []
related:
  - T085
  - T118
rubric_items:
