code: T096
slug: trade-on-its-own-line
name:
  en: Trade on its own line when strong
  es: El trade-in en su propia línea cuando es fuerte
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Presenting the trade
  es: Al presentar el trade-in
model_line_kind: spoken
model_line:
  en: Your trade came in strong at $14,200. Here it is on its own line, and here is your net.
  es: Su trade-in salió bien, en $14,200. Aquí lo tiene en su propia línea, y aquí está lo que le queda.
flawed_line:
  en: With your trade, your payment comes out to $549 a month.
  es: Con su trade-in, el pago le queda en $549 al mes.
flawed_line_violates: []
why:
  en: This draws on Kim and others (2022). When the trade value is strong, showing it on its own line lets the customer see the good news instead of losing it inside the net.
  es: Se basa en Kim y otros (2022). Cuando el trade-in salió bien, ponerlo en su propia línea deja que el cliente vea la buena noticia en vez de que se pierda dentro del total.
evidence:
  grade: B
  note: Kim and others 2022
sources:
  - https://myscp.onlinelibrary.wiley.com/doi/abs/10.1002/jcpy.1238
