code: T056
slug: value-redirect
name:
  en: Value redirect
  es: Redirigir hacia el valor
family: discovery
stages:
  - discovery
when:
  en: Price asked before a car is picked
  es: Pregunta el precio antes de escoger un carro
model_line_kind: spoken
model_line:
  en: Fair question, and you will get every number. First, is this one for you or the family?
  es: "Claro, le doy todos los números. Primero: ¿este es para usted o para la familia?"
flawed_line:
  en: We'll get to price later. Trust me, we'll make it work.
  es: Del precio hablamos después. Créame, que se lo resolvemos.
flawed_line_violates: []
why:
  en: This comes from trainer Joe Verde, not a tested finding. A price means little before you know which car fits; promising every number, then asking one question, keeps trust while you find the right car.
  es: Viene del entrenador Joe Verde, no de un hallazgo comprobado. Un precio dice poco antes de saber qué carro le sirve; prometer todos los números y hacer una pregunta mantiene la confianza mientras usted encuentra el carro correcto.
evidence:
  grade: D
  note: Joe Verde
sources:
  - https://blog.joeverde.com/facts-about-buying-selling/
