code: T027
slug: precise-number-with-a-reason
name:
  en: Precise number with a reason
  es: Número exacto con una razón
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: First pencil, trade offer
  es: La primera propuesta de números, la oferta por el trade-in
model_line_kind: spoken
model_line:
  en: Your trade comes in at $14,850. Here is the auction data behind it.
  es: Su trade-in sale en $14,850. Aquí están los datos de subasta que lo respaldan.
flawed_line:
  en: Your trade? We can give you around fifteen for it.
  es: ¿Su trade-in? Por ese le podemos dar como quince.
flawed_line_violates: []
example_deal:
  trade: { vehicle: 2019 Honda CR-V EX, appraisal_cents: 1485000, payoff_cents: 0, basis: auction data, conditions: [] }
why:
  en: This draws on Mason and others (2013). An exact number like $14,850 sounds worked out rather than rounded off, and the auction data shows the customer where it came from.
  es: Se basa en Mason y otros (2013). Un número exacto como $14,850 suena calculado y no redondeado, y los datos de subasta le muestran al cliente de dónde salió.
evidence:
  grade: B
  note: Mason and others 2013
sources:
  - https://columbia.edu/~da358/publications/Precise_offers.pdf
placeholders: []
related: []
rubric_items:
