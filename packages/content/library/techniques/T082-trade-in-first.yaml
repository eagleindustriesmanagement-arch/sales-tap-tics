code: T082
slug: trade-in-first
name:
  en: Trade-in first
  es: Primero el trade-in
family: discovery
stages:
  - discovery
when:
  en: Right after the greeting, when there is a trade
  es: Justo después del saludo, cuando hay trade-in
model_line_kind: spoken
model_line:
  en: Before we look at anything new, let's walk around your Equinox. What do you love about it, and what drives you crazy?
  es: Antes de ver algo nuevo, vamos a darle la vuelta a su Equinox. ¿Qué es lo que más le gusta y qué es lo que ya no aguanta?
flawed_line:
  en: Let's go look at the new ones first. We'll deal with your trade later.
  es: Vamos a ver los nuevos primero. Lo de su trade-in lo vemos después.
flawed_line_violates: []
why:
  en: This comes from trainer Mark Tewart, not a tested finding. Starting with the customer's own car shows what they love and what they want to get away from, which points you to the right new one.
  es: Viene del entrenador Mark Tewart, no de un hallazgo comprobado. Empezar por el carro del cliente muestra lo que le encanta y lo que ya no aguanta, y eso le indica cuál carro nuevo le conviene.
evidence:
  grade: D
  note: Mark Tewart
