why:
  en: This is floor tradition, not a tested finding. Two concrete options are easier to answer than an open question, so a stuck customer can move forward without feeling cornered.
  es: Es una tradición del piso de ventas, no un hallazgo comprobado. Dos opciones concretas son más fáciles de contestar que una pregunta abierta, y el cliente que está trabado puede avanzar sin sentirse acorralado.
