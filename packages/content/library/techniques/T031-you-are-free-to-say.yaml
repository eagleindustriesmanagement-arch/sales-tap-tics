code: T031
slug: you-are-free-to-say
name:
  en: '"You are free to say no"'
  es: '"Usted está en libertad de decir que no"'
family: closing
stages:
  - closing
when:
  en: Test-drive ask, close, takeaway
  es: Al pedir la prueba de manejo, en el cierre, en el takeaway
model_line_kind: spoken
model_line:
  en: Totally your call, and you are free to walk away. Would you take it around the block first?
  es: Usted decide, y está en libertad de irse. ¿Le da una vuelta primero?
flawed_line:
  en: Come on, just get in, you're going to love it. Let's go.
  es: Dale, súbase, que le va a encantar. Vamos.
flawed_line_violates: []
why:
  en: A meta-analysis of 42 studies found that telling people they are free to say no makes a yes somewhat more likely, though the effect is small. Taking the pressure off lets the customer decide without feeling pushed.
  es: Un metaanálisis de 42 estudios encontró que decirle a la persona que es libre de decir que no hace un poco más probable el sí, aunque el efecto es pequeño. Quitar la presión deja que el cliente decida sin sentirse empujado.
evidence:
  grade: A
  note: meta-analysis of 42 studies (small effect)
sources:
  - https://www.researchgate.net/publication/234839851_A_Meta-Analysis_of_the_Effectiveness_of_the_But_You_Are_Free_Compliance-Gaining_Technique
