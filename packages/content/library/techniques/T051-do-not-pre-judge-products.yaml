code: T051
slug: do-not-pre-judge-products
name:
  en: Do not pre-judge products
  es: No prejuzgar los productos
family: finance_handoff
stages:
  - finance
when:
  en: '"Do I need the warranty?"'
  es: '"¿Necesito la garantía?"'
model_line_kind: spoken
model_line:
  en: That is your call. Ana will show you what it covers and what it costs so you can decide.
  es: Eso lo decide usted. Ana le muestra qué cubre y cuánto cuesta para que decida.
flawed_line: null
flawed_line_violates: []
why:
  en: The rules say no optional product can be presented as required. Letting finance show what it covers and costs, and leaving the call to the customer, keeps the decision theirs, so they never feel talked into it.
  es: Las reglas dicen que ningún producto opcional se puede presentar como obligatorio. Dejar que financiamiento muestre lo que cubre y lo que cuesta, y que el cliente decida, mantiene la decisión en sus manos y nunca siente que lo convencieron.
evidence:
  grade: A
  note: Florida s. 634.121 notice
sources:
  - https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&Search_String=&URL=0600-0699%2F0634%2FSections%2F0634.121.html
