code: T007
slug: summarize-and-confirm
name:
  en: Summarize and confirm
  es: Resumir y confirmar
family: discovery
stages:
  - discovery
when:
  en: End of discovery, before numbers
  es: Al final del descubrimiento, antes de los números
model_line_kind: spoken
model_line:
  en: So you need three rows, under $600 a month, by the end of the month. Did I get that right?
  es: Entonces necesita tres filas, menos de $600 al mes, para fin de mes. ¿Lo entendí bien?
flawed_line:
  en: Got it. Let me grab the keys to the Equinox and run you some numbers.
  es: Perfecto. Déjeme buscar las llaves de la Equinox y le saco unos números.
flawed_line_violates: []
why:
  en: This is a long-standing floor practice rather than a tested finding. Playing back what you heard catches mistakes before the numbers, and the customer hears that you listened.
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Repetirle lo que usted entendió corrige errores antes de los números, y el cliente siente que lo escucharon.
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
sources: []
