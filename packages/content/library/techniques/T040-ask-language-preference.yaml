code: T040
slug: ask-language-preference
name:
  en: Ask language preference
  es: Preguntar el idioma preferido
family: language_trust
stages:
  - greeting
  - discovery
when:
  en: First two minutes, and before financing
  es: En los primeros dos minutos, y antes del financiamiento
model_line_kind: spoken
model_line:
  en: Happy to do this in English or Spanish. Which works better for you, paperwork included?
  es: Con mucho gusto lo atendemos en español o en inglés. ¿Cómo prefiere que hagamos todo, incluyendo los papeles?
flawed_line:
  en: Let's just do it in English, it's faster.
  es: Hagámoslo en inglés, que es más rápido.
flawed_line_violates: []
why:
  en: Service-encounter research found that using the customer's preferred language from the start works better than switching later. Asking up front, paperwork included, lets them follow every step in the language they trust.
  es: La investigación sobre la atención al cliente encontró que usar el idioma preferido desde el principio funciona mejor que cambiar después. Preguntar de entrada, incluyendo los papeles, le permite seguir cada paso en el idioma en que se siente seguro.
evidence:
  grade: B
  note: service-encounter research; using the preferred language from the start beats switching later
