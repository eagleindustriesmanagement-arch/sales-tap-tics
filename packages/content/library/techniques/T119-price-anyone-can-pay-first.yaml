code: T119
slug: price-anyone-can-pay-first
name:
  en: Price anyone can pay first
  es: Primero el precio que cualquiera puede pagar
family: compliance
stages:
  - numbers
when:
  en: A rebate only some buyers qualify for
  es: Un reembolso para el que solo califican algunos compradores
model_line_kind: spoken
model_line:
  en: Anyone can drive this home for $X out the door. If you are a first responder, there is another $1,000 off.
  es: Cualquier persona se lo puede llevar por $X precio total final. Si usted es socorrista, hay $1,000 adicionales de descuento.
flawed_line: null
flawed_line_violates: []
why:
  en: Under the FTC's pricing guidance, the first price must be one any customer can pay, with special rebates after. That way no one is drawn in by a number they do not qualify for.
  es: Según la guía de precios de la FTC, el primer precio tiene que ser uno que cualquier cliente pueda pagar, y los descuentos especiales van después. Así nadie llega atraído por un número para el que no califica.
evidence:
  grade: A
  note: same
