model_line:
  en: "Here is how it works: drive, appraisal, numbers in writing, then the lender. Nothing is signed until you have seen everything."
  es: "Le explico cómo funciona aquí: la prueba de manejo, la tasación, los números por escrito y luego el banco. Nada se firma hasta que usted lo haya visto todo."
flawed_line:
  en: Okay, let me grab your license and run your credit real quick.
  es: Bueno, déme su licencia y le corremos el crédito rapidito.
