code: T022
slug: shrink-the-gap
name:
  en: Shrink the gap
  es: Achicar la diferencia
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Small difference left
  es: Queda una diferencia pequeña
model_line_kind: spoken
model_line:
  en: We are $30 a month apart. That is about a dollar a day for the one you actually want.
  es: Estamos a $30 al mes. Es como un dólar al día por el que de verdad quiere.
flawed_line: null
flawed_line_violates: []
why:
  en: Gourville's research found that breaking a cost into a per-day amount works only for small sums. A small gap shown as about a dollar a day feels manageable; never do this with the whole payment.
  es: La investigación de Gourville encontró que dividir un costo por día solo funciona con cantidades pequeñas. Una diferencia chiquita, vista como un dólar al día, se siente manejable; nunca lo haga con el pago completo.
evidence:
  grade: B
  note: Gourville; per-day framing works only for small amounts
