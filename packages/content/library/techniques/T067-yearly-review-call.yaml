code: T067
slug: yearly-review-call
name:
  en: Yearly review call
  es: Llamada de revisión anual
family: follow_up
stages:
  - follow_up
when:
  en: Sold customers, once a year
  es: Clientes que compraron, una vez al año
model_line_kind: spoken
model_line:
  en: It has been a year. I would like to check what your car is worth today.
  es: Ya pasó un año; me gustaría revisar cuánto vale su carro hoy.
flawed_line:
  en: Hi, it's Luis. Just checking in. Let me know if you need anything.
  es: Hola, le habla Luis. Solo para saludarlo. Cualquier cosa, me avisa.
flawed_line_violates: []
why:
  en: This is a long-standing floor practice rather than a tested finding. A yearly check on what their car is worth is a useful reason to call, and it keeps you their contact when they are ready to trade.
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Revisar cada año cuánto vale su carro es una razón útil para llamar, y lo mantiene a usted como su contacto cuando esté listo para cambiarlo.
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
