code: T102
slug: reason-first-call
name:
  en: Reason-first call
  es: Llamada con la razón primero
family: phone
stages:
  - phone
when:
  en: Old leads and past customers
  es: Leads viejos y clientes anteriores
model_line_kind: spoken
model_line:
  en: It's Carlos from Bomnin Chevrolet. I am calling because your lease ends in March. Can I take 30 seconds?
  es: Le habla Carlos de Bomnin Chevrolet. Le llamo porque su lease se vence en marzo. ¿Me regala 30 segundos?
flawed_line:
  en: Hi, how are you? It's been a while! Just calling to see how everything's going.
  es: ¡Hola! ¿Cómo está? ¡Cuánto tiempo! Lo llamaba para ver cómo va todo.
flawed_line_violates: []
example_deal:
  deadlines:
    - { what: The customer's lease ends, date: "2027-03-31", proof: The customer's lease contract on file }
why:
  en: Gong's data on 300 million business calls found that stating the reason for the call raised success 2.1 times. A real reason, like a lease ending, tells the customer right away why the call is worth their time.
  es: Los datos de Gong sobre 300 millones de llamadas entre empresas encontraron que decir el motivo de la llamada multiplicó el éxito 2.1 veces. Una razón real, como un lease que se vence, le dice al cliente de inmediato por qué vale la pena escucharlo.
evidence:
  grade: B
  note: Gong, 300 million calls; stating the reason raised success 2.1 times (business-to-business)
sources:
  - https://www.gong.io/blog/the-best-and-worst-cold-call-openers-backed-by-data-from-300m-calls
