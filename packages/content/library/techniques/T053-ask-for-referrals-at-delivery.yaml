code: T053
slug: ask-for-referrals-at-delivery
name:
  en: Ask for referrals at delivery
  es: Pedir referidos en la entrega
family: follow_up
stages:
  - follow_up
when:
  en: Delivery and follow-ups
  es: En la entrega y en los seguimientos
model_line_kind: spoken
model_line:
  en: Who do you know that is looking for a car?
  es: ¿A quién conoce que esté buscando carro?
flawed_line:
  en: If you hear of anyone, give them my card or whatever.
  es: Si sabe de alguien, déle mi tarjeta, si quiere.
flawed_line_violates: []
why:
  en: This is Joe Girard's method, a trainer's practice rather than a tested finding. Delivery, with a happy customer, is the easiest moment to ask. Girard paid $25 per sold referral, but any reward here needs the store attorney's approval.
  es: Es el método de Joe Girard, una práctica de entrenador y no un hallazgo comprobado. La entrega, con el cliente contento, es el momento más fácil para pedir. Girard pagaba $25 por cada referido que compraba, pero cualquier premio aquí necesita la aprobación del abogado de la tienda.
evidence:
  grade: D
  note: Girard paid $25 per sold referral; any reward needs attorney approval (store setting)
