code: T106
slug: concession-staircase
name:
  en: Concession staircase
  es: Escalera de concesiones
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Desk negotiation
  es: Negociación en la mesa
model_line_kind: spoken
model_line:
  en: I took this back to my manager and got you two hundred more on the trade. That one was tough to get.
  es: Fui donde mi gerente y le conseguí doscientos más por el trade-in. Ese no fue fácil, se lo digo.
flawed_line:
  en: Okay, fine, I'll give you another two thousand on your trade.
  es: Bueno, está bien, le doy dos mil más por su trade-in.
flawed_line_violates: []
example_deal:
  trade: { vehicle: 2019 Honda CR-V EX, appraisal_cents: 1485000, payoff_cents: 0, basis: auction data, conditions: [] }
  authority: { manager_has_room: true }
why:
  en: This builds on Kwon and Weingart (2004), and a 2025 study found big early concessions make the other side push harder. Small, hard-won steps show you are near the limit; describe a manager trip only as it really happened.
  es: Se basa en Kwon y Weingart (2004), y un estudio de 2025 encontró que ceder mucho al principio hace que la otra parte apriete más. Pasos pequeños y bien ganados muestran que usted está cerca del límite; cuente la ida al gerente solo como de verdad pasó.
evidence:
  grade: B
  note: Kwon and Weingart 2004; a 2025 study found big early concessions make the other side push harder
sources:
  - https://pubmed.ncbi.nlm.nih.gov/15065974/
placeholders: []
