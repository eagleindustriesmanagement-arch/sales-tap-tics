code: T020
slug: real-urgency
name:
  en: Real urgency
  es: Urgencia real
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: A true, showable deadline or scarce unit
  es: Una fecha límite verdadera que se puede mostrar, o una unidad escasa
model_line_kind: spoken
model_line:
  en: The $1,500 rebate ends Monday. Here is the bulletin.
  es: El reembolso de $1,500 vence el lunes. Aquí tiene el boletín.
flawed_line:
  en: There's a big rebate on this one right now. Trust me, you don't want to miss it.
  es: Ahora mismo este tiene un reembolso grande. Créame, no se lo puede perder.
flawed_line_violates: []
why:
  en: This draws on Gino and Moore (2008) and applies to real deadlines only. A true deadline the customer can see on paper gives a reason to decide now; a made-up one breaks trust and the rules.
  es: Se basa en Gino y Moore (2008) y aplica solo a fechas límite reales. Una fecha verdadera que el cliente puede ver en papel le da una razón para decidir ahora; una inventada rompe la confianza y las reglas.
evidence:
  grade: B
  note: Gino and Moore 2008 (real deadlines only)
sources:
  - https://ncmr.lps.library.cmu.edu/article/id/82/
placeholders: []
related:
  - T107
rubric_items:
  - U-DEADLINE
compliance:
  - DEAD-01
requires_store_policy: false
use_only_when: null
spanish_reviewed: false
status: active
