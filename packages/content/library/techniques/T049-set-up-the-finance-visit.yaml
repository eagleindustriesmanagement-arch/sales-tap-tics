code: T049
slug: set-up-the-finance-visit
name:
  en: Set up the finance visit
  es: Preparar la visita a financiamiento
family: finance_handoff
stages:
  - finance
when:
  en: Customer agrees to numbers
  es: El cliente acepta los números
model_line_kind: spoken
model_line:
  en: Next you will sit with Ana in finance. She shows you every protection option with its price. You choose what you want, if anything.
  es: Ahora va a pasar con Ana, de financiamiento. Ella le muestra todas las opciones de protección con su precio. Usted escoge lo que quiera, o nada.
flawed_line:
  en: Okay, go sit with Ana. She'll just have you sign a few things.
  es: Bueno, pase con Ana, que ella le pone a firmar unas cositas.
flawed_line_violates: []
why:
  en: This is floor practice, not a tested finding. Telling the customer that finance shows every option with its price, and that they choose, sets honest expectations so the menu feels like information, not a pitch.
  es: Es una práctica de piso, no un hallazgo comprobado. Decirle al cliente que en financiamiento le van a enseñar cada opción con su precio, y que él escoge, crea expectativas honestas para que el menú se sienta como información y no como presión.
evidence:
  grade: D
  note: menu practice (300% rule) is disclosure
