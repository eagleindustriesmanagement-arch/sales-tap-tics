why:
  en: This comes from Chris Voss's negotiation method, not a tested finding. Saying out loud what a burned buyer expects takes the sting out of it and shows you are not hiding anything.
  es: Viene del método de negociación de Chris Voss, no de un hallazgo comprobado. Decir en voz alta lo que espera un cliente que ya salió quemado le quita fuerza a esa idea y muestra que usted no esconde nada.
