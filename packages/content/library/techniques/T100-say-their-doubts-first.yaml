model_line:
  en: You are probably expecting me to play games with the numbers and keep you here four hours.
  es: Seguramente usted piensa que le voy a jugar con los números y tenerlo aquí cuatro horas.
flawed_line:
  en: Trust me, I'm not like other salespeople.
  es: Confíe en mí, yo no soy como los otros vendedores.
