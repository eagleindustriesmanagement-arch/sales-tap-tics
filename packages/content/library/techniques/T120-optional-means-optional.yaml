code: T120
slug: optional-means-optional
name:
  en: Optional means optional
  es: Opcional quiere decir opcional
family: compliance
stages:
  - numbers
when:
  en: Customer objects to a pre-installed package
  es: El cliente objeta un paquete que ya viene instalado
model_line_kind: spoken
model_line:
  en: That package is already on the car, but it is optional. If you do not want to pay for it, here is what we do.
  es: Ese paquete ya viene instalado, pero es opcional. Si no lo quiere pagar, esto es lo que hacemos.
flawed_line:
  en: That package is already installed on the car. It can't come off, so it's part of the price.
  es: Ese paquete ya viene instalado en el carro. No se le puede quitar, así que va en el precio.
flawed_line_violates:
  - ADD-02
why:
  en: Under the FTC's pricing guidance, an optional package cannot be presented as impossible to remove. Offering the store's policy lets the customer choose for real, so they do not feel forced to pay for something they did not want.
  es: Según la guía de precios de la FTC, un paquete opcional no se puede presentar como imposible de quitar. Ofrecer la política de la tienda deja que el cliente decida de verdad, y no siente que lo obligaron a pagar algo que no quería.
evidence:
  grade: A
  note: same; requires store policy
sources: []
placeholders: []
related: []
rubric_items: []
compliance:
  - ADD-02
requires_store_policy: true
use_only_when:
  en: Store policy fills the remedy.
  es: La política de la tienda define la solución.
spanish_reviewed: false
status: needs_store_policy
