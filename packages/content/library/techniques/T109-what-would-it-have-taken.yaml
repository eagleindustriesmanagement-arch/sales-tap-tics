code: T109
slug: what-would-it-have-taken
name:
  en: '"What would it have taken?"'
  es: '"¿Qué hubiera hecho falta?"'
family: closing
stages:
  - closing
when:
  en: After a firm no or lost deal
  es: Después de un no firme o un negocio perdido
model_line_kind: spoken
model_line:
  en: Before you go, honestly, what would it have taken for this to be a yes today?
  es: "Antes de que se vaya, dígame con toda confianza: ¿qué hubiera hecho falta para que hoy me dijera que sí?"
flawed_line:
  en: Alright, no problem. Thanks for coming in.
  es: Bueno, no hay problema. Gracias por venir.
flawed_line_violates: []
why:
  en: This comes from Malhotra and Bazerman's negotiation method, not a tested sales finding. After a firm no, the customer can answer honestly, and the answer tells you what to fix or whether the deal can still be saved.
  es: Viene del método de negociación de Malhotra y Bazerman, no de un hallazgo comprobado en ventas. Después de un no firme, el cliente puede contestar con franqueza, y la respuesta le dice qué arreglar o si el negocio todavía se puede salvar.
evidence:
  grade: D
  note: Malhotra and Bazerman
