when:
  en: Customer leaving undecided
  es: El cliente se va sin decidirse
model_line_kind: spoken
model_line:
  en: Sounds like today is not the day, and that is fine. Can I text you the out-the-door number so you have it in writing?
  es: Parece que hoy no es el día, y está bien. ¿Le envío por texto el precio total final para que lo tenga por escrito?
flawed_line: null
