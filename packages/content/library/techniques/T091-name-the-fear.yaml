code: T091
slug: name-the-fear
name:
  en: Name the fear
  es: Ponerle nombre al miedo
family: indecision
stages:
  - objection
  - closing
when:
  en: A stall with no clear objection
  es: Se frena sin una objeción clara
model_line_kind: spoken
model_line:
  en: A lot of people at this point worry about picking the wrong one and regretting it in a year. Is any of that going on for you?
  es: Mucha gente en este punto tiene miedo de escoger el carro equivocado y arrepentirse después. ¿Le está pasando algo de eso?
flawed_line: null
flawed_line_violates: []
why:
  en: Research behind The JOLT Effect, from 2.5 million business sales calls, found that a stall is usually fear of choosing wrong, and pressure makes it worse. Naming the fear calmly lets the customer talk about it.
  es: La investigación de The JOLT Effect, con 2.5 millones de llamadas de ventas entre empresas, encontró que la indecisión casi siempre es miedo a escoger mal, y que la presión la empeora. Nombrar ese miedo con calma deja que el cliente hable de él.
evidence:
  grade: B
  note: The JOLT Effect, 2.5 million calls (business-to-business)
sources:
  - https://www.jolteffect.com/
