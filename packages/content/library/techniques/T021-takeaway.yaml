code: T021
slug: takeaway
name:
  en: Takeaway
  es: Takeaway (quitar la opción)
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Wants top trim at base price
  es: Quiere la versión más alta al precio de la básica
model_line_kind: spoken
model_line:
  en: Maybe this trim is more than you need. Want to see the one below it?
  es: A lo mejor esta versión es más de lo que necesita. ¿Quiere ver la de abajo?
flawed_line:
  en: Let me see what I can do to get you the top trim at your number.
  es: Déjeme ver qué puedo hacer para dejarle la versión más equipada en su número.
flawed_line_violates: []
why:
  en: This is floor tradition, not a tested finding. Offering the lower trim takes the pressure off, so the customer either finds one that fits the budget or decides on their own that the top trim is worth it.
  es: Es una tradición del piso de ventas, no un hallazgo comprobado. Ofrecer la versión de abajo le quita presión al cliente, y así encuentra una que le cuadre en el presupuesto o decide por su cuenta que la de arriba vale la pena.
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
sources: []
