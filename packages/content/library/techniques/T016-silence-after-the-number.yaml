code: T016
slug: silence-after-the-number
name:
  en: Silence after the number
  es: Silencio después del número
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Right after presenting figures
  es: Justo después de presentar las cifras
model_line_kind: direction
model_line:
  en: Present, then say nothing until the customer speaks.
  es: Presentar y no decir nada hasta que el cliente hable.
flawed_line:
  en: So there it is. I know it seems like a lot, but honestly it's a great price, and we can always look at...
  es: Ahí lo tiene. Ya sé que parece mucho, pero la verdad es un buen precio, y siempre podemos ver...
flawed_line_violates: []
why:
  en: This is a long-standing floor practice rather than a tested finding. Talking right after the number fills the gap with nerves or a discount; staying quiet lets the customer react first.
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Hablar justo después del número llena el silencio con nervios o con un descuento; quedarse callado deja que el cliente reaccione primero.
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
