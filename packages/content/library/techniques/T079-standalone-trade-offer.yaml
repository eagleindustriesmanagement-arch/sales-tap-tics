code: T079
slug: standalone-trade-offer
name:
  en: Standalone trade offer
  es: Oferta por el trade-in por separado
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Customer suspects the trade is being moved around
  es: El cliente sospecha que le están moviendo el valor del trade-in
model_line_kind: spoken
model_line:
  en: We will make you a written offer on your car either way.
  es: Le hacemos una oferta por escrito por su carro, compre o no compre.
flawed_line:
  en: Don't worry about the trade, I'll take care of it in the numbers.
  es: No se preocupe por el trade-in, yo se lo acomodo en los números.
flawed_line_violates: []
why:
  en: This is a store policy, not a tested finding, so confirm your store offers it. A written offer on the car whether they buy or not shows the trade value is not being moved around to hide the real price.
  es: Es una política de la tienda, no un hallazgo comprobado, así que confirme que su tienda la ofrece. Una oferta por escrito por su carro, compre o no compre, muestra que el valor del trade-in no se está moviendo para esconder el precio real.
evidence:
  grade: D
  note: Bomnin store policy; confirm per store
