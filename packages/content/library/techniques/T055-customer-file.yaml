code: T055
slug: customer-file
name:
  en: Customer file
  es: Ficha del cliente
family: follow_up
stages:
  - follow_up
when:
  en: After every sale and walkout
  es: Después de cada venta y de cada cliente que se va sin comprar
model_line_kind: direction
model_line:
  en: Record family, work, interests and the reason they left; open the next contact with it.
  es: Anotar familia, trabajo, intereses y la razón por la que se fue; empezar el próximo contacto con eso.
flawed_line:
  en: Hi, sorry, remind me, which car were you looking at again?
  es: Hola, perdone, recuérdeme, ¿qué carro era el que estaba mirando?
flawed_line_violates: []
why:
  en: This is Joe Girard's method, not a tested finding. Opening the next contact with something personal they told you shows you remember them, and the reason they left tells you what to fix.
  es: Es el método de Joe Girard, no un hallazgo comprobado. Empezar el próximo contacto con algo personal que le contaron demuestra que usted se acuerda de ellos, y la razón por la que se fueron le dice qué arreglar.
evidence:
  grade: D
  note: Girard
