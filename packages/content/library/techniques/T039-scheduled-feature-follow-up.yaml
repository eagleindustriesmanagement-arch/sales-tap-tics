code: T039
slug: scheduled-feature-follow-up
name:
  en: Scheduled feature follow-up
  es: Seguimiento programado de funciones
family: follow_up
stages:
  - follow_up
when:
  en: Two to three weeks after delivery
  es: Dos o tres semanas después de la entrega
model_line_kind: spoken
model_line:
  en: I will call on the 14th to set up the driver profiles we skipped.
  es: Lo llamo el 14 para configurar los perfiles de conductor que nos faltaron.
flawed_line:
  en: If you have any questions about the features, just give me a call.
  es: Si tiene alguna pregunta sobre las funciones, me llama.
flawed_line_violates: []
why:
  en: In J.D. Power's 2025 study, 22% of buyers wanted a follow-up on features and 53% of those never got one. Putting the date on the calendar at delivery makes sure your customer does.
  es: En el estudio de J.D. Power de 2025, el 22% de los compradores quería un seguimiento sobre las funciones del carro, y el 53% de ellos nunca lo recibió. Poner la fecha en el calendario al entregar el carro asegura que su cliente sí lo reciba.
evidence:
  grade: B
  note: J.D. Power 2025; 22% want it and 53% of those never get it
