code: T008
slug: tie-feature-to-stated-need
name:
  en: Tie feature to stated need
  es: Conectar la característica con la necesidad que dijo
family: discovery
stages:
  - discovery
when:
  en: Walkaround
  es: En el recorrido alrededor del carro
model_line_kind: spoken
model_line:
  en: You said your mother has trouble climbing in. Watch how low this step is.
  es: Usted me dijo que a su mamá le cuesta subirse. Mire lo bajito que está este escalón.
flawed_line:
  en: This one has the Bose sound system, wireless charging and a heated steering wheel.
  es: Este trae el sistema de sonido Bose, cargador inalámbrico y timón con calefacción.
flawed_line_violates: []
why:
  en: This is floor tradition, not a tested finding. A feature only matters to a customer when it solves something they told you, so tie each one to their own words.
  es: Es una tradición del piso de ventas, no un hallazgo comprobado. Un detalle del carro solo le importa al cliente cuando resuelve algo que él mismo le dijo, así que conéctelo con sus propias palabras.
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
