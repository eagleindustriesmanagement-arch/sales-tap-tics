code: T077
slug: switch-channels-on-silence
name:
  en: Switch channels on silence
  es: Cambiar de canal si no contesta
family: phone
stages:
  - phone
when:
  en: After one or two unanswered contacts
  es: Después de uno o dos contactos sin respuesta
model_line_kind: spoken
model_line:
  en: Maybe email is not the best way to reach you. Want a 30-second video of the car by text?
  es: Quizás el email no es lo más práctico. ¿Le mando por texto un video cortico del carro?
flawed_line: null
flawed_line_violates: []
why:
  en: This is floor practice, not a tested finding. Some people never answer email but will watch a short video by text, so a new channel can restart the conversation. Text only customers who have given consent.
  es: Es una práctica de piso, no un hallazgo comprobado. Hay gente que nunca contesta un email pero sí ve un video corto por texto, así que cambiar de vía puede revivir la conversación. Mande textos solo a clientes que hayan dado su consentimiento.
evidence:
  grade: D
  note: requires text consent (CONSENT-01)
sources: []
placeholders: []
related: []
rubric_items: []
compliance:
  - CONSENT-01
requires_store_policy: false
use_only_when: null
spanish_reviewed: false
status: active
