code: T063
slug: two-appointment-times-with-a
name:
  en: Two appointment times with a reason
  es: Dos horarios de cita con una razón
family: phone
stages:
  - phone
when:
  en: Any phone or internet lead
  es: Cualquier lead de teléfono o internet
model_line_kind: spoken
model_line:
  en: I will have it pulled up and your trade appraised in fifteen minutes. Is 4:15 or 5:45 better?
  es: Se lo tengo listo y le evaluamos su trade-in en quince minutos. ¿Le queda mejor a las 4:15 o a las 5:45?
flawed_line:
  en: Come by whenever you get a chance. I'm here all day.
  es: Pase cuando pueda. Yo estoy aquí todo el día.
flawed_line_violates: []
why:
  en: This is a long-standing floor practice rather than a tested finding. A reason makes the visit worth the trip, and two set times are easier to commit to than "come by whenever."
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Una razón hace que la visita valga el viaje, y dos horas fijas comprometen más que un "pase cuando quiera".
evidence:
  grade: D
  note: Practitioner tradition; the research named no source
