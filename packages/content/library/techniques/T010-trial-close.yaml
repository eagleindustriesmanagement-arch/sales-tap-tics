name:
  en: Trial close
  es: Cierre de prueba
family: closing
stages:
  - closing
when:
  en: After the drive and each resolved objection
  es: Después de la prueba de manejo y de cada objeción resuelta
model_line_kind: spoken
model_line:
  en: If we can get the numbers where you need them, is this the one?
  es: Si logramos que los números le cuadren, ¿es este el carro?
flawed_line:
  en: So, that's the car. Any other questions?
  es: Bueno, ese es el carro. ¿Tiene alguna otra pregunta?
flawed_line_violates: []
why:
  en: This is a long-standing floor practice rather than a tested finding. A low-pressure check tells you whether this is the car or something is still in the way, before you go to numbers.
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Una pregunta sin presión le dice si este es el carro o si todavía hay algo en el camino, antes de pasar a los números.
