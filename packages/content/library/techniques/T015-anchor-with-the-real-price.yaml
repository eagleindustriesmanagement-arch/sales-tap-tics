code: T015
slug: anchor-with-the-real-price
name:
  en: Anchor with the real price and a reason
  es: Anclar con el precio real y una razón
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: First number
  es: El primer número
model_line_kind: spoken
model_line:
  en: This one is $38,450, everything included but tax and tags. Here is why it is priced there.
  es: Este está en $38,450, todo incluido menos impuestos y placas. Le explico por qué tiene ese precio.
flawed_line:
  en: I know, the sticker's a little high, but don't worry, we can come way down from there.
  es: Ya sé, el precio está un poco alto, pero no se preocupe, de ahí lo bajamos bastante.
flawed_line_violates: []
example_deal:
  price_cents: 3755100
  all_in_price_cents: 3845000
why:
  en: A 2025 review of 90 studies found ambitious opening numbers win about 75% of the time but cause more walkaways and worse feelings. Opening with the real all-in price and a reason keeps the anchor honest and avoids that backlash.
  es: Una revisión de 90 estudios en 2025 encontró que abrir con un número ambicioso gana como el 75% de las veces, pero hace que más gente se vaya y quede molesta. Abrir con el precio total real y una razón mantiene el ancla honesta y evita ese rechazo.
evidence:
  grade: A
  note: 2025 meta-analysis of 90 studies; ambitious openings win about 75% of the time but cause more walkaways and worse feelings, and the effect shrinks in complex deals
sources:
  - https://ink.library.smu.edu.sg/lkcsb_research/7752
placeholders: []
related: []
