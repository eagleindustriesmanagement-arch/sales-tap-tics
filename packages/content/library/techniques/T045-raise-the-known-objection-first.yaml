why:
  en: This is a long-standing floor practice rather than a tested finding. When you explain a fee before the customer finds it, it reads as honesty instead of a surprise.
  es: Es una práctica de piso de toda la vida, no un hallazgo comprobado. Cuando usted explica un cargo antes de que el cliente lo encuentre, se ve como honestidad y no como una sorpresa.
