code: T004
slug: label-the-concern
name:
  en: Label the concern
  es: Ponerle nombre a la preocupación
family: objection_sequence
stages:
  - objection
when:
  en: Emotion is ahead of logic
  es: La emoción va por delante de la lógica
model_line_kind: spoken
model_line:
  en: It sounds like the trade number caught you off guard.
  es: Parece que el número del trade-in lo tomó por sorpresa.
flawed_line:
  en: Look, that's what the book says your car is worth. It's nothing personal.
  es: Mire, eso es lo que dice el libro que vale su carro. No es nada personal.
flawed_line_violates: []
why:
  en: This comes from Chris Voss's negotiation method, not a tested sales study. Naming the feeling out loud makes the customer feel understood, which usually cools the emotion so you can talk numbers.
  es: Viene del método de negociación de Chris Voss, no de un estudio de ventas comprobado. Ponerle nombre a lo que siente el cliente lo hace sentirse entendido, y eso suele calmar la emoción para poder hablar de números.
evidence:
  grade: D
  note: Voss
