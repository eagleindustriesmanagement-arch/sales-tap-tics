code: T113
slug: feelings-before-numbers
name:
  en: Feelings before numbers
  es: Los sentimientos antes que los números
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Angry be-back
  es: Cliente que regresa molesto
model_line_kind: spoken
model_line:
  en: You came in expecting one number and got another. I would be upset too. Let me fix the part that is on us first.
  es: Usted vino esperando un número y le dieron otro. Yo también estaría molesto. Déjeme arreglar primero lo que nos toca.
flawed_line:
  en: That's not what I told you. Let's just look at the numbers again.
  es: Eso no fue lo que yo le dije. Vamos a ver los números otra vez.
flawed_line_violates: []
why:
  en: This comes from Stuart Diamond's negotiation method, not a tested finding. An upset customer cannot hear numbers yet; owning the part that is on the store first calms things so the deal can move.
  es: Viene del método de negociación de Stuart Diamond, no de un hallazgo comprobado. Un cliente molesto todavía no puede oír números; reconocer primero lo que le toca a la tienda calma las cosas para que el negocio avance.
evidence:
  grade: D
  note: Stuart Diamond
