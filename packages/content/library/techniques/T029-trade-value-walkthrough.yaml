code: T029
slug: trade-value-walkthrough
name:
  en: Trade-value walkthrough
  es: Explicar el valor del trade-in paso a paso
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: '"You are low on my trade"'
  es: '"Me está dando poco por mi trade-in"'
model_line_kind: spoken
model_line:
  en: Here are the three closest auction sales and the $1,100 in tires and brakes it needs.
  es: Aquí tiene las tres ventas de subasta más parecidas y los $1,100 de gomas y frenos que necesita.
flawed_line:
  en: That's what it's worth. The market is the market.
  es: Eso es lo que vale. El mercado es el mercado.
flawed_line_violates: []
why:
  en: In J.D. Power's 2025 sales satisfaction study, deal satisfaction scored 800 when things were explained versus 672 when they were not. Walking through auction sales and needed repairs shows why the trade number is what it is.
  es: En el estudio de satisfacción de ventas de J.D. Power de 2025, la satisfacción con el negocio fue de 800 cuando se explicó, contra 672 cuando no. Repasar las ventas de subasta y las reparaciones muestra por qué el trade-in vale lo que vale.
evidence:
  grade: C
  note: J.D. Power 2025 SSI; deal satisfaction 800 when explained versus 672
