code: T043
slug: package-trade
name:
  en: Package trade
  es: Negociar todo en paquete
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Buyer keeps reopening single items
  es: El comprador sigue reabriendo puntos sueltos
model_line_kind: spoken
model_line:
  en: "Let's look at it all together: price, your trade and the extras."
  es: "Veamos todo junto: el precio, su trade-in y los extras."
flawed_line:
  en: Okay, fine, I'll give you a little more on the trade. Now what else?
  es: Bueno, está bien, le doy un poquito más por el trade-in. ¿Ahora qué más?
flawed_line_violates: []
why:
  en: This draws on Ogliastri's negotiation research, a credible but indirect source. Putting price, trade and extras together stops the deal from being reopened one piece at a time and lets you trade across items.
  es: Se basa en la investigación de negociación de Ogliastri, una fuente seria pero indirecta. Poner juntos el precio, el trade-in y los extras evita que el negocio se reabra pedazo por pedazo y le permite negociar entre una cosa y otra.
evidence:
  grade: C
  note: Ogliastri
sources:
  - https://www.redalyc.org/pdf/716/71602504.pdf
