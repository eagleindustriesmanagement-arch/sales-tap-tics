code: T083
slug: walk-the-wheel
name:
  en: Walk the wheel
  es: Recorrer la rueda
family: negotiation
stages:
  - numbers
  - negotiation
when:
  en: Price-fixated customer at the desk
  es: Cliente fijado en el precio, ya en la mesa
model_line_kind: spoken
model_line:
  en: "Let me sketch every way people set this up: cash, finance, lease, shorter, longer. Then you pick what fits."
  es: "Déjeme dibujarle todas las formas de armar este negocio: contado, financiado, lease, más corto o más largo. Usted escoge lo que le conviene."
flawed_line:
  en: It is what it is. $599 a month for 72 months.
  es: Es lo que hay. $599 al mes, a 72 meses.
flawed_line_violates: [RATE-01]
why:
  en: This comes from trainer Mark Tewart, not a tested finding. Laying out every way to structure the deal moves a price-fixated customer from one number to choosing the setup that fits them.
  es: Viene del entrenador Mark Tewart, no de un hallazgo comprobado. Enseñar todas las formas de armar el negocio hace que el cliente obsesionado con un número pase a escoger la opción que le conviene.
evidence:
  grade: D
  note: Mark Tewart
sources:
  - https://tewart.com/giving-enough-trade/
